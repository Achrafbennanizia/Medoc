name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=pnpm --filter medoc lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_cmd=pnpm --filter medoc format" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=yarn workspace medoc lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_cmd=yarn workspace medoc format" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=npm run lint:fix -w medoc" >> "$GITHUB_OUTPUT"
            echo "format_cmd=npm run format -w medoc" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.name }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}
      - name: Deterministic Rust formatting
        run: cargo fmt --all
      - name: Deterministic JS lint fixes
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const s=require('./apps/practice-host-ui/package.json').scripts||{}; process.exit(s['lint:fix'] ? 0 : 1)"; then
            ${{ steps.pm.outputs.lint_fix_cmd }}
          else
            npx eslint apps/practice-host-ui/src --ext .ts,.tsx --fix --max-warnings 0 --no-cache || true
          fi
      - name: Deterministic formatting script (if present)
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const s=require('./apps/practice-host-ui/package.json').scripts||{}; process.exit(s.format ? 0 : 1)"; then
            ${{ steps.pm.outputs.format_cmd }}
          else
            echo "No format script in apps/practice-host-ui/package.json; skipping JS formatter."
          fi
      - name: Commit fixes if anything changed
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply deterministic autofixes"
            git push origin "HEAD:${PR_HEAD_REF}"
          else
            echo "No deterministic autofixes to commit."
          fi
