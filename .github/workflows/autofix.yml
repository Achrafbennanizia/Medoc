name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - run: corepack enable

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install_cmd }}

      - name: cargo fmt (deterministic autofix)
        run: cargo fmt --all

      - name: Run deterministic JS fixes when scripts exist
        shell: bash
        run: |
          set -euo pipefail
          run_if_present() {
            local script_name="$1"
            if node -e "const p=require('./package.json'); process.exit((p.scripts && p.scripts['${script_name}']) ? 0 : 1)"; then
              if [ "${{ steps.pm.outputs.pm }}" = "npm" ]; then
                npm run "$script_name" --if-present
              else
                ${{ steps.pm.outputs.pm }} run "$script_name"
              fi
            else
              echo "Skipping '$script_name' (script not present)."
            fi
          }
          run_if_present "lint:fix"
          run_if_present "format"

      - name: Block automated edits to security/audit/crypto/RBAC paths
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            exit 0
          fi
          sensitive="$(printf '%s\n' "$changed" | rg -i '(security|audit|crypto|rbac)' || true)"
          if [ -n "$sensitive" ]; then
            echo "Autofix touched restricted paths:" >&2
            echo "$sensitive" >&2
            exit 1
          fi

      - name: Commit fixes if anything changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No autofix changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply deterministic autofix (fmt/lint)"
          git push origin "HEAD:${{ github.head_ref }}"
