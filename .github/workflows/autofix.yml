name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: Deterministic Rust formatting
        run: cargo fmt --all
      - name: Deterministic JS lint/format fixes
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"

          run_script() {
            local dir="$1"
            local script="$2"
            shift 2 || true
            case "$PM" in
              pnpm) pnpm --dir "$dir" run "$script" -- "$@" ;;
              yarn) yarn --cwd "$dir" run "$script" "$@" ;;
              npm) npm --prefix "$dir" run "$script" -- "$@" ;;
            esac
          }

          script_exists() {
            local dir="$1"
            local script="$2"
            node -e '
              const fs = require("fs");
              const path = require("path");
              const pkgPath = path.resolve(process.argv[1], "package.json");
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              process.exit(pkg.scripts && pkg.scripts[process.argv[2]] ? 0 : 1);
            ' "$dir" "$script"
          }

          if script_exists "apps/practice-host-ui" "lint:fix"; then
            run_script "apps/practice-host-ui" "lint:fix"
          else
            run_script "apps/practice-host-ui" "lint" "--fix"
          fi

          if script_exists "apps/practice-host-ui" "format"; then
            run_script "apps/practice-host-ui" "format"
          else
            echo "No apps/practice-host-ui format script; skipping."
          fi

          if script_exists "." "format"; then
            run_script "." "format"
          else
            echo "No root format script; skipping."
          fi
      - name: Commit fixes if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic fixes to commit."
          fi
