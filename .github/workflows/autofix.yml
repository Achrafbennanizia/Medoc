name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}"; exit 1 ;;
          esac
      - name: Apply deterministic autofixes
        run: |
          cargo fmt --all
          HAS_LINT_FIX="$(node -e "const p=require('./package.json');process.stdout.write(p.scripts&&p.scripts['lint:fix']?'1':'0')")"
          HAS_FORMAT="$(node -e "const p=require('./package.json');process.stdout.write(p.scripts&&p.scripts['format']?'1':'0')")"
          if [ "$HAS_LINT_FIX" = "1" ]; then
            ${{ steps.pm.outputs.pm }} run lint:fix || true
          fi
          if [ "$HAS_FORMAT" = "1" ]; then
            ${{ steps.pm.outputs.pm }} run format || true
          fi
      - name: Block compliance-path mutations
        run: |
          SENSITIVE_FILES="$(git diff --name-only | grep -E '(^|/)(security|audit|crypto|rbac)(/|_|\\.|-)|config/rbac\\.yaml' || true)"
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "::error::autofix changed compliance-sensitive files:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
      - name: Commit deterministic fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic fixes found."
          fi
