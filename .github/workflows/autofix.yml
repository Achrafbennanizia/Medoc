name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - run: corepack enable
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager"; exit 1 ;;
          esac
      - name: Apply deterministic fixes only
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm --filter medoc run lint:fix
              pnpm --filter medoc run format || true
              ;;
            yarn)
              yarn workspace medoc lint:fix
              yarn workspace medoc format || true
              ;;
            npm)
              npm run lint:fix -w medoc
              npm run format -w medoc || true
              ;;
            *) echo "Unsupported package manager"; exit 1 ;;
          esac
      - name: Block protected compliance paths
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only)"
          if [ -z "$changed_files" ]; then
            exit 0
          fi

          protected_hits="$(echo "$changed_files" | rg -i '(^|/)(security|audit|crypto|rbac)(/|_|\.|$)' || true)"
          if [ -n "$protected_hits" ]; then
            echo "Autofix touched protected compliance paths; aborting:"
            echo "$protected_hits"
            exit 1
          fi
      - name: Commit fixes if anything changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
