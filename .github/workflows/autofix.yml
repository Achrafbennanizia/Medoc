name: autofix

on: pull_request

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}

      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}

      # Deterministic, logic-free fixes only.
      - run: cargo fmt --all

      - name: Apply JavaScript deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm run lint:fix || true
              pnpm run format || true
              ;;
            yarn)
              yarn run lint:fix || true
              yarn run format || true
              ;;
            npm)
              npm run lint:fix --if-present || true
              npm run format --if-present || true
              ;;
          esac
          npx eslint apps/practice-host-ui/src --fix --no-cache || true

      - name: "Guardrail: block compliance-sensitive mutations"
        shell: bash
        run: |
          set -euo pipefail
          SENSITIVE_PATTERN='(^|/)(security|audit|crypto|rbac)(/|\\.|_|-)|(^|/)auth(/|\\.|_|-)|(^|/)license(/|\\.|_|-)'
          SENSITIVE_CHANGED="$(git diff --name-only | rg "$SENSITIVE_PATTERN" || true)"
          if [ -n "$SENSITIVE_CHANGED" ]; then
            echo "::error::Autofix touched compliance-sensitive files:"
            echo "$SENSITIVE_CHANGED"
            exit 1
          fi

      - name: Commit fixes if anything changed
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${HEAD_REF}"
          else
            echo "No deterministic autofix changes detected."
          fi
