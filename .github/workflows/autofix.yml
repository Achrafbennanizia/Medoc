name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Detect package manager from lockfile
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.name }}
      - name: Enable corepack for pnpm/yarn
        run: corepack enable
      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: Apply deterministic Rust formatting
        run: cargo fmt --all
      - name: Apply deterministic JS lint fixes
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) (pnpm run lint:fix || pnpm run lint -- --fix) || true ;;
            yarn) (yarn lint:fix || yarn lint --fix) || true ;;
            npm) (npm run lint:fix --if-present || npm run lint -- --fix) || true ;;
          esac
      - name: Apply optional format script when available
        run: |
          if node -e 'const pkg=require("./package.json"); process.exit(pkg.scripts?.format ? 0 : 1)'; then
            case "${{ steps.pm.outputs.name }}" in
              pnpm) pnpm run format ;;
              yarn) yarn format ;;
              npm) npm run format ;;
            esac
          else
            echo "No format script configured; skipping format step."
          fi
      - name: Commit fixes if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No deterministic fixes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply automated formatting and lint fixes"
          git push origin HEAD:${{ github.head_ref }}
