name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect JS package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - run: corepack enable
      - name: Install JS dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager"; exit 1 ;;
          esac
      - name: Deterministic Rust formatting
        run: cargo fmt --all
      - name: Deterministic JS lint/format fixes
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              (pnpm run lint:fix || true)
              (pnpm run format || true)
              ;;
            yarn)
              (yarn run lint:fix || true)
              (yarn run format || true)
              ;;
            npm)
              (npm run lint:fix --if-present || true)
              (npm run format --if-present || true)
              ;;
            *)
              echo "Unsupported package manager"
              exit 1
              ;;
          esac
      - name: Block compliance-sensitive paths from autofix
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only)"
          if [ -z "$changed_files" ]; then
            exit 0
          fi

          if printf '%s\n' "$changed_files" | rg -n '(^|/)(security|audit|crypto|rbac)(/|_|\.|$)'; then
            echo "Autofix touched security/audit/crypto/RBAC paths; refusing to push automated changes."
            exit 1
          fi
      - name: Commit deterministic fixes if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic autofix changes detected."
          fi
