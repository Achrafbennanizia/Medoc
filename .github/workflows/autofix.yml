name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - id: pm
        name: Detect JavaScript package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Enable corepack shims
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager" >&2; exit 1 ;;
          esac

      - name: Apply deterministic Rust formatting
        run: cargo fmt --all

      - name: Apply deterministic JavaScript lint fixes
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm --filter medoc run lint -- --fix ;;
            yarn) yarn workspace medoc lint --fix ;;
            npm) npm run lint -w medoc -- --fix ;;
          esac

      - name: Apply deterministic formatter script if present
        run: |
          set -euo pipefail
          HAS_FORMAT=$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(pkg.scripts && pkg.scripts.format ? '1' : '0');")
          if [ "$HAS_FORMAT" = "1" ]; then
            case "${{ steps.pm.outputs.manager }}" in
              pnpm) pnpm run format ;;
              yarn) yarn format ;;
              npm) npm run format ;;
            esac
          else
            echo "No root format script found; skipping formatter step."
          fi

      - name: Commit deterministic fixes (if any)
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No deterministic autofixes were necessary."
          fi
