name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable Corepack
        if: steps.pm.outputs.pm != 'npm'
        run: corepack enable
      - name: Install dependencies
        shell: bash
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac
      - name: Deterministic safe fixes
        shell: bash
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set -euo pipefail

          run_medoc_script() {
            case "$PM" in
              pnpm) pnpm --filter medoc run "$1" "${@:2}" ;;
              yarn) yarn workspace medoc "$1" "${@:2}" ;;
              npm) npm run "$1" -w medoc -- "${@:2}" ;;
            esac
          }

          cargo fmt --all

          # Lint autofix: script preferred, fallback to lint --fix.
          if node -e 'const fs=require("node:fs"); const pkg=JSON.parse(fs.readFileSync("apps/practice-host-ui/package.json","utf8")); process.exit(pkg.scripts && pkg.scripts["lint:fix"] ? 0 : 1);'; then
            run_medoc_script lint:fix || true
          else
            run_medoc_script lint --fix || true
          fi

          # Formatter script is optional. If absent, skip without failing.
          if node -e 'const fs=require("node:fs"); const pkg=JSON.parse(fs.readFileSync("apps/practice-host-ui/package.json","utf8")); process.exit(pkg.scripts && pkg.scripts.format ? 0 : 1);'; then
            run_medoc_script format || true
          fi
      - name: Commit fixes if anything changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply deterministic formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic fixes needed."
          fi
