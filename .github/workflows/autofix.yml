name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager"; exit 1 ;;
          esac
      - name: Apply deterministic Rust formatting
        run: cargo fmt --all
      - name: Apply deterministic web lint and formatting fixes
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm --filter medoc run lint:fix || true
              pnpm --filter medoc run format || true
              ;;
            yarn)
              yarn workspace medoc lint:fix || true
              yarn workspace medoc format || true
              ;;
            npm)
              npm run lint:fix -w medoc || true
              npm run format -w medoc || true
              ;;
            *)
              echo "Unsupported package manager"
              exit 1
              ;;
          esac
      - name: Block sensitive-path mutations
        run: |
          SENSITIVE_PATHS="$(git diff --name-only | rg -i '(^|/)(security|audit|crypto|rbac)(/|_|\\.|$)' || true)"
          if [ -n "$SENSITIVE_PATHS" ]; then
            echo "Autofix touched restricted paths:"
            echo "$SENSITIVE_PATHS"
            exit 1
          fi
      - name: Commit and push fixes when needed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply deterministic formatting and lint fixes"
            git push origin "HEAD:${HEAD_REF}"
          else
            echo "No autofix changes detected."
          fi
