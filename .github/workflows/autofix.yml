name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.event.pull_request.head.ref || github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run_cmd=pnpm run" >> "$GITHUB_OUTPUT"
            echo "cache_dependency=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run_cmd=yarn run" >> "$GITHUB_OUTPUT"
            echo "cache_dependency=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "run_cmd=npm run" >> "$GITHUB_OUTPUT"
            echo "cache_dependency=package-lock.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.cache_dependency }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}
      - name: cargo fmt
        run: cargo fmt --all
      - name: lint:fix
        run: ${{ steps.pm.outputs.run_cmd }} lint:fix || true
      - name: format
        run: ${{ steps.pm.outputs.run_cmd }} format || true
      - name: Revert protected compliance paths
        shell: bash
        run: |
          protected_pattern='(^|/)(security|audit|crypto|rbac)(/|_|\.|$)'
          protected_files="$(git diff --name-only | rg "$protected_pattern" || true)"
          if [ -n "$protected_files" ]; then
            echo "Autofix touched protected paths; reverting:"
            echo "$protected_files"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              git checkout -- "$file"
            done <<< "$protected_files"
          fi
      - name: Commit fixes when files changed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "No deterministic autofixes to commit."
          fi
