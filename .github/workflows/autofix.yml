name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install JavaScript dependencies
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable || yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: $PM" ; exit 1 ;;
          esac
      - name: Apply deterministic fixes
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          run_in_dir() {
            local dir="$1"
            shift
            case "$PM" in
              pnpm) pnpm --dir "$dir" "$@" ;;
              yarn) yarn --cwd "$dir" "$@" ;;
              npm) npm --prefix "$dir" "$@" ;;
              *) echo "Unsupported package manager: $PM" ; exit 1 ;;
            esac
          }

          # Deterministic, logic-free formatting only.
          cargo fmt --all
          run_in_dir "apps/practice-host-ui" run lint:fix || run_in_dir "apps/practice-host-ui" run lint -- --fix || true
          run_in_dir "apps/practice-host-ui" run format --if-present || true
      - name: Commit and push fixes if needed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No deterministic fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply automated formatting and lint fixes"
          git push origin "HEAD:${{ github.head_ref }}"
