name: autofix

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - id: pm
        name: Detect JavaScript package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Deterministic Rust formatting
        run: cargo fmt --all

      - name: Deterministic lint autofix (if script exists)
        shell: bash
        run: |
          if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts['lint:fix'] ? 0 : 1)"; then
            ${{ steps.pm.outputs.pm }} run lint:fix
          else
            echo "No lint:fix script declared; skipping."
          fi

      - name: Deterministic formatting (if script exists)
        shell: bash
        run: |
          if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts.format ? 0 : 1)"; then
            ${{ steps.pm.outputs.pm }} run format
          else
            echo "No format script declared; skipping."
          fi

      - name: Commit fixes if anything changed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push
          else
            echo "No deterministic autofix changes to commit."
          fi
