name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - run: corepack enable
      - name: Install dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: cargo fmt
        run: cargo fmt --all
      - name: lint:fix (deterministic)
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run lint:fix ;;
            yarn) yarn run lint:fix ;;
            npm) npm run lint:fix ;;
          esac
      - name: format (deterministic)
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run format ;;
            yarn) yarn run format ;;
            npm) npm run format ;;
          esac
      - name: Block sensitive-path mutations
        shell: bash
        run: |
          if git diff --name-only | rg -i '(security|audit|crypto|rbac)' >/dev/null; then
            echo "Autofix touched sensitive paths (security/audit/crypto/RBAC). Refusing to push."
            git diff --name-only
            exit 1
          fi
      - name: Commit deterministic fixes
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No deterministic fixes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply automated formatting and lint fixes"
          git push origin "HEAD:${PR_HEAD_REF}"
