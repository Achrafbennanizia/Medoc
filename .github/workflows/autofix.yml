name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run_cmd=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run_cmd=yarn run" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "run_cmd=npm run" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}

      - name: Enable corepack
        run: corepack enable

      - name: Install web dependencies
        run: ${{ steps.pm.outputs.install_cmd }}

      - name: Apply deterministic Rust formatting
        run: cargo fmt --all

      - id: scripts
        name: Detect optional autofix scripts
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const scripts=pkg.scripts||{}; console.log('has_lint_fix=' + Boolean(scripts['lint:fix'])); console.log('has_lint=' + Boolean(scripts.lint)); console.log('has_format=' + Boolean(scripts.format));" >> "$GITHUB_OUTPUT"

      - name: Apply lint:fix script
        if: steps.scripts.outputs.has_lint_fix == 'true'
        run: ${{ steps.pm.outputs.run_cmd }} lint:fix

      - name: Apply lint --fix fallback
        if: steps.scripts.outputs.has_lint_fix != 'true' && steps.scripts.outputs.has_lint == 'true'
        run: ${{ steps.pm.outputs.run_cmd }} lint -- --fix

      - name: Apply format script
        if: steps.scripts.outputs.has_format == 'true'
        run: ${{ steps.pm.outputs.run_cmd }} format

      - name: Commit deterministic fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply deterministic formatting and lint fixes"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No deterministic autofix changes detected."
          fi
