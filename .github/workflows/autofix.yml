name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.name }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --immutable
              ;;
            npm)
              npm ci
              ;;
            *)
              echo "Unsupported package manager: ${{ steps.pm.outputs.name }}"
              exit 1
              ;;
          esac
      - name: Run deterministic autofixes
        run: |
          cargo fmt --all
          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm run lint:fix || true
              pnpm run format || true
              ;;
            yarn)
              yarn run lint:fix || true
              yarn run format || true
              ;;
            npm)
              npm run lint:fix || true
              npm run format || true
              ;;
            *)
              echo "Unsupported package manager: ${{ steps.pm.outputs.name }}"
              exit 1
              ;;
          esac
      - name: Commit fixes when tree changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic autofix changes found."
          fi
