name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: Apply deterministic fixes only
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"

          run_medoc_script() {
            case "$PM" in
              pnpm) pnpm --filter medoc run "$1" ;;
              yarn) yarn workspace medoc run "$1" ;;
              npm) npm run "$1" -w medoc ;;
            esac
          }

          cargo fmt --all

          if node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('apps/practice-host-ui/package.json','utf8')); process.exit(pkg.scripts && pkg.scripts['lint:fix'] ? 0 : 1);" ; then
            run_medoc_script lint:fix
          else
            case "$PM" in
              pnpm) pnpm --filter medoc exec eslint src --fix --max-warnings 0 --no-cache ;;
              yarn) yarn workspace medoc eslint src --fix --max-warnings 0 --no-cache ;;
              npm) npm exec --workspace medoc -- eslint src --fix --max-warnings 0 --no-cache ;;
            esac
          fi

          if node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('apps/practice-host-ui/package.json','utf8')); process.exit(pkg.scripts && pkg.scripts.format ? 0 : 1);" ; then
            run_medoc_script format
          else
            echo "No dedicated format script found in apps/practice-host-ui/package.json; skipping formatter pass."
          fi
      - name: Commit and push fixes if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic fixes to commit."
          fi
