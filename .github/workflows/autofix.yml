name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=pnpm --filter medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_cmd=pnpm --filter medoc run format" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=yarn workspace medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_cmd=yarn workspace medoc run format" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=npm run lint:fix -w medoc" >> "$GITHUB_OUTPUT"
            echo "format_cmd=npm run format -w medoc" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}
      - run: cargo fmt --all
      - run: ${{ steps.pm.outputs.lint_fix_cmd }} || true
      - run: ${{ steps.pm.outputs.format_cmd }} || true
      - id: compliance_guard
        shell: bash
        run: |
          changed_files="$(git diff --name-only)"
          if [ -z "$changed_files" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          protected_regex='(^|/)(security|audit|crypto)(/|_|-)|(^|/)rbac(\.|/|_|-)'
          blocked_files="$(printf '%s\n' "$changed_files" | rg -i "$protected_regex|^config/rbac\\.yaml$" || true)"
          if [ -n "$blocked_files" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "blocked_files<<EOF"
              echo "$blocked_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop on protected compliance paths
        if: steps.compliance_guard.outputs.blocked == 'true'
        run: |
          echo "autofix refused to commit because protected paths changed:"
          echo "${{ steps.compliance_guard.outputs.blocked_files }}"
          exit 1
      - name: Commit deterministic fixes
        if: steps.compliance_guard.outputs.blocked != 'true'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic fix changes detected."
          fi
