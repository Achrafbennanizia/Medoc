name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - id: loop_guard
        name: detect bot-authored commit
        run: |
          last_email="$(git log -1 --pretty=format:'%ae')"
          if [ "$last_email" = "github-actions[bot]@users.noreply.github.com" ] || [ "$last_email" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.loop_guard.outputs.skip != 'true'
        with:
          components: rustfmt
      - id: pm
        if: steps.loop_guard.outputs.skip != 'true'
        name: detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.loop_guard.outputs.skip != 'true'
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - name: enable corepack
        if: steps.loop_guard.outputs.skip != 'true'
        run: corepack enable
      - name: install dependencies
        if: steps.loop_guard.outputs.skip != 'true'
        run: ${{ steps.pm.outputs.install_cmd }}
      - name: rust fmt
        if: steps.loop_guard.outputs.skip != 'true'
        run: cargo fmt --all
      - name: lint fix
        if: steps.loop_guard.outputs.skip != 'true'
        working-directory: apps/practice-host-ui
        run: |
          if node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); process.exit(p.scripts && p.scripts['lint:fix'] ? 0 : 1)"; then
            ${{ steps.pm.outputs.pm }} run lint:fix || true
          else
            echo "No lint:fix script detected; skipping."
          fi
      - name: format
        if: steps.loop_guard.outputs.skip != 'true'
        working-directory: apps/practice-host-ui
        run: |
          if node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); process.exit(p.scripts && p.scripts.format ? 0 : 1)"; then
            ${{ steps.pm.outputs.pm }} run format || true
          else
            echo "No format script detected; skipping."
          fi
      - name: commit deterministic fixes
        if: steps.loop_guard.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push
          else
            echo "No deterministic autofix changes detected."
          fi
