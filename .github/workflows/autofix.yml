name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=pnpm --filter medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_cmd=pnpm run --if-present format" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=yarn workspace medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_cmd=yarn run format" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "lint_fix_cmd=npm run lint:fix -w medoc" >> "$GITHUB_OUTPUT"
            echo "format_cmd=npm run format --if-present" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install_cmd }}

      - name: Apply Rust formatting fixes
        run: cargo fmt --all

      - name: Apply JS lint fixes (deterministic only)
        run: ${{ steps.pm.outputs.lint_fix_cmd }}

      - name: Apply JS format fixes (if configured)
        run: ${{ steps.pm.outputs.format_cmd }} || true

      - name: Commit and push deterministic fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "No deterministic autofixes to commit."
          fi
