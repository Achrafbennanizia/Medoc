name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm install" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}
      - name: cargo fmt --all
        run: cargo fmt --all
      - name: lint:fix (deterministic only)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run lint:fix ;;
            yarn) yarn workspace medoc run lint:fix ;;
            npm) npm run lint:fix -w medoc ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: format (deterministic only)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run format ;;
            yarn) yarn workspace medoc run format ;;
            npm) npm run format -w medoc ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: Remove sensitive-path changes from auto-fix
        shell: bash
        run: |
          set -euo pipefail
          sensitive_files="$(git diff --name-only | grep -E -i '(^|/)(security|audit|crypto|rbac)(/|_|-|\\.|$)' || true)"
          if [ -n "$sensitive_files" ]; then
            echo "Auto-fix must not touch security/audit/crypto/RBAC code. Reverting:"
            printf '%s\n' "$sensitive_files"
            git checkout -- $sensitive_files
          fi
      - name: Commit deterministic fixes when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply deterministic formatting and lint fixes"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "No deterministic fixes to commit."
          fi
