name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager and autofix commands
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "cache_path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix=pnpm --filter medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format=pnpm --filter medoc run format" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "cache_path=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix=yarn workspace medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format=yarn workspace medoc run format" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "cache_path=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "lint_fix=npm run lint:fix -w medoc" >> "$GITHUB_OUTPUT"
            echo "format=npm run format -w medoc" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.cache_path }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}
      - name: Deterministic Rust formatting
        run: cargo fmt --all
      - name: Deterministic lint autofix
        run: ${{ steps.pm.outputs.lint_fix }}
      - name: Deterministic formatting autofix
        run: ${{ steps.pm.outputs.format }}
      - name: Commit and push autofix changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No deterministic autofix changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: apply automated formatting and lint fixes"
          git push origin "HEAD:${{ github.head_ref }}"
