name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: Rust fmt (deterministic)
        run: cargo fmt --all
      - name: Lint autofix script (if available)
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm -r --if-present run lint:fix || true ;;
            yarn) yarn run lint:fix || true ;;
            npm) npm run lint:fix --workspaces --if-present || true ;;
          esac
      - name: Format script (if available)
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm -r --if-present run format || true ;;
            yarn) yarn run format || true ;;
            npm) npm run format --workspaces --if-present || true ;;
          esac
      - name: Fallback ESLint autofix for medoc UI
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run lint -- --fix || true ;;
            yarn) yarn workspace medoc run lint --fix || true ;;
            npm) npm run lint -w medoc -- --fix || true ;;
          esac
      - name: Commit fixes if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic fixes were necessary."
          fi
