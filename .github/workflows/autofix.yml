name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn run" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock

      - run: corepack enable
      - run: ${{ steps.pm.outputs.install }}

      - name: Deterministic Rust formatting
        run: cargo fmt --all

      - name: Deterministic lint + format fixes
        shell: bash
        run: |
          set -euo pipefail

          if node -e 'const fs=require("fs");const scripts=(JSON.parse(fs.readFileSync("package.json","utf8")).scripts)||{};process.exit(scripts["lint:fix"]?0:1);'; then
            ${{ steps.pm.outputs.run }} lint:fix || true
          else
            ${{ steps.pm.outputs.run }} lint -- --fix || true
          fi

          if node -e 'const fs=require("fs");const scripts=(JSON.parse(fs.readFileSync("package.json","utf8")).scripts)||{};process.exit(scripts["format"]?0:1);'; then
            ${{ steps.pm.outputs.run }} format || true
          fi

      - name: Commit fixes if changes exist
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "No deterministic auto-fixes were necessary."
          fi
