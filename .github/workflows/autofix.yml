name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.pm != 'npm'
        run: corepack enable
      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: cargo fmt (deterministic autofix)
        run: cargo fmt --all
      - name: Lint autofix (deterministic)
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run lint -- --fix ;;
            yarn) yarn workspace medoc lint --fix ;;
            npm) npm run lint -w medoc -- --fix ;;
          esac
      - name: Optional format script (if present)
        run: |
          set -euo pipefail
          if node -e "const pkg = require('./apps/practice-host-ui/package.json'); process.exit(pkg.scripts && pkg.scripts.format ? 0 : 1);"; then
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm --filter medoc run format ;;
              yarn) yarn workspace medoc format ;;
              npm) npm run format -w medoc ;;
            esac
          else
            echo "No format script declared for workspace package 'medoc'; skipping format step."
          fi
      - name: Block autofix changes on security/audit/crypto/RBAC paths
        run: |
          set -euo pipefail
          if git diff --name-only | grep -Eiq '(^|/)(security|audit|crypto|rbac)(/|[-_.]|$)'; then
            echo "Autofix touched protected compliance paths (security/audit/crypto/RBAC); refusing to commit."
            exit 1
          fi
      - name: Commit deterministic fixes (if changed)
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply deterministic formatting and lint fixes [skip autofix]"
            git push
          else
            echo "No deterministic autofixes to commit."
          fi
