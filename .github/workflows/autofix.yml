name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enable Corepack
        run: corepack enable
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager"; exit 1 ;;
          esac
      - name: cargo fmt (deterministic)
        run: cargo fmt --all
      - name: lint:fix (deterministic; if script exists)
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));process.exit(p.scripts && p.scripts['lint:fix'] ? 0 : 1)"; then
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm run lint:fix ;;
              yarn) yarn run lint:fix ;;
              npm) npm run lint:fix ;;
            esac
          else
            echo "No lint:fix script found at workspace root; skipping."
          fi
      - name: format (deterministic; if script exists)
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));process.exit(p.scripts && p.scripts.format ? 0 : 1)"; then
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm run format ;;
              yarn) yarn run format ;;
              npm) npm run format ;;
            esac
          else
            echo "No format script found at workspace root; skipping."
          fi
      - name: Commit deterministic fixes (if any)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply deterministic autofixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic autofix changes to commit."
          fi
