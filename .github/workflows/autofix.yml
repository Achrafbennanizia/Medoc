name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - id: author
        name: Loop guard for CI bot commit authorship
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=format:%ae)" == "github-actions[bot]@users.noreply.github.com" ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - if: steps.author.outputs.skip == 'true'
        name: Skip bot-authored commit to prevent loops
        run: echo "Latest commit is from github-actions[bot]; skipping autofix run."

      - if: steps.author.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - if: steps.author.outputs.skip != 'true'
        id: js
        name: Detect JavaScript package manager and autofix commands
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f pnpm-lock.yaml ]]; then
            pm="pnpm"
            install_cmd="pnpm install --frozen-lockfile"
            lint_fix_cmd="pnpm --filter medoc run lint:fix || true"
            format_cmd="pnpm --filter medoc run format || true"
          elif [[ -f yarn.lock ]]; then
            pm="yarn"
            install_cmd="yarn install --frozen-lockfile"
            lint_fix_cmd="yarn workspace medoc lint:fix || true"
            format_cmd="yarn workspace medoc format || true"
          else
            pm="npm"
            install_cmd="npm ci"
            lint_fix_cmd="npm run lint:fix -w medoc || true"
            format_cmd="npm run format -w medoc || true"
          fi

          {
            echo "pm=$pm"
            echo "install_cmd<<EOF"
            echo "$install_cmd"
            echo "EOF"
            echo "lint_fix_cmd<<EOF"
            echo "$lint_fix_cmd"
            echo "EOF"
            echo "format_cmd<<EOF"
            echo "$format_cmd"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - if: steps.author.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.js.outputs.pm }}

      - if: steps.author.outputs.skip != 'true'
        name: Enable Corepack
        run: corepack enable

      - if: steps.author.outputs.skip != 'true'
        name: Install JS dependencies
        run: ${{ steps.js.outputs.install_cmd }}

      - if: steps.author.outputs.skip != 'true'
        name: Deterministic Rust formatting
        run: cargo fmt --all

      - if: steps.author.outputs.skip != 'true'
        name: Deterministic lint autofix (if available)
        run: ${{ steps.js.outputs.lint_fix_cmd }}

      - if: steps.author.outputs.skip != 'true'
        name: Deterministic formatting command (if available)
        run: ${{ steps.js.outputs.format_cmd }}

      - if: steps.author.outputs.skip != 'true'
        name: Commit fixes if anything changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: apply automated formatting and lint fixes"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No deterministic autofix changes to commit."
          fi
