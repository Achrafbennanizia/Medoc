name: autofix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Detect package manager and fix commands
        id: pm
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_command=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix_command=pnpm run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_command=pnpm run format" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_command=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_fix_command=yarn lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_command=yarn format" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_command=npm ci" >> "$GITHUB_OUTPUT"
            echo "lint_fix_command=npm run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_command=npm run format" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install_command }}
      - name: Deterministic Rust format fixes
        run: cargo fmt --all
      - name: Deterministic lint autofix
        run: ${{ steps.pm.outputs.lint_fix_command }} || true
      - name: Deterministic format command
        run: ${{ steps.pm.outputs.format_command }} || true
      - name: Commit deterministic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deterministic fixes to commit."
            exit 0
          fi
          git commit -m "ci: apply automated formatting and lint fixes"
          git push origin "HEAD:${{ github.head_ref }}"
