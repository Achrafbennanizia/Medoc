name: Website

on:
  push:
    branches: [main]
  # Pull requests that touch either site build them but never deploy.
  pull_request:
    paths:
      - "website/**"
      - "sifralabs/**"
      - "package-lock.json"
      - "sifralabs/package-lock.json"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('website-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sifralabs/package-lock.json
      # One artifact: Sifra Labs at /Medoc/, MeDoc Dentist inside it at /Medoc/products/medoc-dentist/
      # (sifralabs/scripts/build-product.mjs). Same command Cloudflare runs, with the Pages base.
      - name: Build Sifra Labs + MeDoc Dentist
        working-directory: sifralabs
        env:
          # SITE_ORIGIN is host only; SITE_BASE is the Pages path (decorate joins them).
          SITE_BASE: /Medoc
          SITE_ORIGIN: https://achrafbennanizia.github.io
          # Forms on Pages must POST to the Worker, not to github.io.
          CONTACT_API: https://sifralabs.com/api/contact
          VITE_CONTACT_API: https://sifralabs.com/api/contact
          TURNSTILE_SITE_KEY: 0x4AAAAAAGWRuo3Zp4ZVJq6h
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAGWRuo3Zp4ZVJq6h
        run: |
          npm ci
          npm run build:all
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: sifralabs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
