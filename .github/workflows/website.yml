name: Website

on:
  push:
    branches: [main]
  # Pull requests that touch either site build them but never deploy.
  pull_request:
    paths:
      - "website/**"
      - "sifralabs/**"
      - "package-lock.json"
      - "sifralabs/package-lock.json"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('website-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Company site (Sifra Labs) is the GitHub Pages root at /Medoc/.
      - name: Build Sifra Labs (main site)
        working-directory: sifralabs
        env:
          # SITE_ORIGIN is host only; SITE_BASE is the Pages path (decorate joins them).
          SITE_BASE: /Medoc
          SITE_ORIGIN: https://achrafbennanizia.github.io
          PRODUCT_SITE: https://achrafbennanizia.github.io/Medoc/dentist/
          # Forms on Pages must POST to the Worker, not to github.io.
          CONTACT_API: https://sifralabs.com/api/contact
        run: |
          npm ci
          npm run build
      # Product site nests under /Medoc/dentist/. Same Worker contact API as the company form.
      - name: Build MeDoc Dentist
        env:
          VITE_CONTACT_API: https://sifralabs.com/api/contact
        run: npm ci && npm run build -w medoc-dentist
      - name: Assemble Pages artifact
        run: |
          mkdir -p publish/dentist
          cp -a sifralabs/dist/. publish/
          cp -a website/dist/. publish/dentist/
          touch publish/.nojekyll
          touch publish/dentist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: publish

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
