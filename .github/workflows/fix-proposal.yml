name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Failure class to target"
        required: true
        type: choice
        default: verify_red_main
        options:
          - verify_red_main
          - test_failure
          - type_error
          - advisory
      verify_run_url:
        description: "Optional URL of the failing verify run"
        required: false
        type: string
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  propose:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install }}
      - id: attempt
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            reason="${{ inputs.reason }}"
          else
            reason="verify_red_main"
          fi

          report_path="$(bash scripts/ci/fix-proposal-attempt.sh "$reason")"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
      - id: classify
        shell: bash
        run: |
          changed_files="$(git diff --name-only)"
          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed_files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if printf '%s\n' "$changed_files" | rg -i '(^|/)(security|audit|crypto|rbac)(/|_|\\.|$)' >/dev/null; then
            echo "needs_human_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build draft PR body
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            verify_run_url="${{ github.event.workflow_run.html_url }}"
          else
            verify_run_url="${{ inputs.verify_run_url }}"
          fi

          if [ -z "$verify_run_url" ]; then
            verify_run_url="NOT PROVIDED"
          fi

          cat > /tmp/fix-proposal-pr-body.md <<EOF
          ## Tier 3 CI fix proposal

          This draft PR was generated by the \`fix-proposal\` workflow as a human-reviewed proposal.

          - Trigger reason: \`${{ steps.attempt.outputs.reason }}\`
          - Source verify run: ${verify_run_url}
          - Evidence report: \`${{ steps.attempt.outputs.report_path }}\`
          - Sensitive-path guard (\`security|audit|crypto|rbac\`): \`${{ steps.classify.outputs.needs_human_review }}\`

          ### Changed files
          \`\`\`text
          ${{ steps.classify.outputs.changed_files }}
          \`\`\`

          ### Notes
          - This workflow always opens a **draft** PR.
          - It never auto-merges.
          - If sensitive paths are touched, a \`needs-human-review\` label is applied.
          EOF
      - id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/fix-proposal-${{ github.run_id }}
          base: main
          draft: true
          commit-message: "ci: draft fix proposal for ${{ steps.attempt.outputs.reason }}"
          title: "ci: draft fix proposal (${{ steps.attempt.outputs.reason }})"
          body-path: /tmp/fix-proposal-pr-body.md
          labels: |
            ci-fix-proposal
      - name: Label sensitive proposal
        if: steps.classify.outputs.needs_human_review == 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              labels: ["needs-human-review"],
            });
