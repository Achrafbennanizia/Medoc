name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git ref to repair (branch, tag, or SHA)"
        required: true
        default: "main"
      rationale:
        description: "Why this proposal was requested"
        required: false
        default: "Manual trigger"
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOG_DIR: ${{ runner.temp }}/ci-fix
    steps:
      - id: target
        name: Resolve source ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "checkout_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "trigger_note=verify failed on main (${{ github.event.workflow_run.head_sha }})" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ inputs.target_ref }}" >> "$GITHUB_OUTPUT"
            echo "trigger_note=${{ inputs.rationale }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: System deps for Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true

      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --immutable" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - run: corepack enable
      - run: ${{ steps.pm.outputs.install }}

      - name: Prepare proposal evidence directory
        run: mkdir -p "$LOG_DIR"

      - id: before
        name: Capture failing-before evidence
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set +e
          cargo test --workspace > "$LOG_DIR/before-cargo-test.log" 2>&1
          echo "cargo_test=$?" >> "$GITHUB_OUTPUT"
          cargo audit > "$LOG_DIR/before-cargo-audit.log" 2>&1
          echo "cargo_audit=$?" >> "$GITHUB_OUTPUT"
          if [ "$PM" = "npm" ]; then
            {
              npm run typecheck -w medoc
              npm run typecheck -w medoc-lan-web-client
            } > "$LOG_DIR/before-typecheck.log" 2>&1
          elif [ "$PM" = "pnpm" ]; then
            {
              pnpm --filter medoc run typecheck
              pnpm --filter medoc-lan-web-client run typecheck
            } > "$LOG_DIR/before-typecheck.log" 2>&1
          else
            {
              yarn workspace medoc run typecheck
              yarn workspace medoc-lan-web-client run typecheck
            } > "$LOG_DIR/before-typecheck.log" 2>&1
          fi
          echo "typecheck=$?" >> "$GITHUB_OUTPUT"
          set -e

      - id: attempt
        name: Attempt substantive remediation on proposal branch
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set +e
          cargo update -w > "$LOG_DIR/action-cargo-update.log" 2>&1
          echo "cargo_update=$?" >> "$GITHUB_OUTPUT"

          if [ "$PM" = "npm" ]; then
            npm audit fix --package-lock-only --omit=dev > "$LOG_DIR/action-npm-audit-fix.log" 2>&1
            echo "js_audit_fix=$?" >> "$GITHUB_OUTPUT"
          else
            echo "Package manager '$PM' has no configured lockfile-only audit fixer in this workflow." > "$LOG_DIR/action-js-audit-fix.log"
            echo "js_audit_fix=0" >> "$GITHUB_OUTPUT"
          fi
          set -e

      - id: after
        name: Capture passing-after evidence
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set +e
          cargo test --workspace > "$LOG_DIR/after-cargo-test.log" 2>&1
          echo "cargo_test=$?" >> "$GITHUB_OUTPUT"
          cargo audit > "$LOG_DIR/after-cargo-audit.log" 2>&1
          echo "cargo_audit=$?" >> "$GITHUB_OUTPUT"
          if [ "$PM" = "npm" ]; then
            {
              npm run typecheck -w medoc
              npm run typecheck -w medoc-lan-web-client
            } > "$LOG_DIR/after-typecheck.log" 2>&1
          elif [ "$PM" = "pnpm" ]; then
            {
              pnpm --filter medoc run typecheck
              pnpm --filter medoc-lan-web-client run typecheck
            } > "$LOG_DIR/after-typecheck.log" 2>&1
          else
            {
              yarn workspace medoc run typecheck
              yarn workspace medoc-lan-web-client run typecheck
            } > "$LOG_DIR/after-typecheck.log" 2>&1
          fi
          echo "typecheck=$?" >> "$GITHUB_OUTPUT"
          set -e

      - id: changed
        name: Check whether proposal changed files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - id: labels
        if: steps.changed.outputs.changed == 'true'
        name: Compute proposal labels
        run: |
          labels="ci-fix-proposal"
          if git diff --name-only | grep -Eiq '(security|audit|crypto|rbac)'; then
            labels="$labels,needs-human-review"
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - name: Build draft PR body
        if: steps.changed.outputs.changed == 'true'
        run: |
          {
            echo "## CI fix proposal"
            echo
            echo "- Trigger: ${{ steps.target.outputs.trigger_note }}"
            echo "- Source ref: \`${{ steps.target.outputs.checkout_ref }}\`"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "## Rationale"
            echo
            echo "This proposal was generated automatically to address failing verify checks on a new branch."
            echo
            echo "## Evidence (failing-before / passing-after)"
            echo
            echo "| Check | Before | After |"
            echo "| --- | --- | --- |"
            echo "| cargo test --workspace | ${{ steps.before.outputs.cargo_test }} | ${{ steps.after.outputs.cargo_test }} |"
            echo "| cargo audit | ${{ steps.before.outputs.cargo_audit }} | ${{ steps.after.outputs.cargo_audit }} |"
            echo "| js typecheck | ${{ steps.before.outputs.typecheck }} | ${{ steps.after.outputs.typecheck }} |"
            echo
            echo "## Automated changes attempted"
            echo
            echo "- cargo update exit code: ${{ steps.attempt.outputs.cargo_update }}"
            echo "- JS audit fix exit code: ${{ steps.attempt.outputs.js_audit_fix }}"
            echo
            echo "## Files changed"
            echo
            echo '```text'
            git status --short
            echo '```'
            echo
            if [ "${{ steps.labels.outputs.sensitive }}" = "true" ]; then
              echo "> This proposal touches security/audit/crypto/RBAC-related paths and is labeled \`needs-human-review\`."
            fi
          } > "$LOG_DIR/proposal-body.md"

      - name: Commit and open draft PR
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/fix-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          base: main
          commit-message: "ci: draft fix proposal from failing verify"
          title: "ci: draft fix proposal from failing verify"
          body-path: ${{ env.LOG_DIR }}/proposal-body.md
          draft: true
          labels: ${{ steps.labels.outputs.labels }}

      - name: No-op summary when nothing changed
        if: steps.changed.outputs.changed != 'true'
        run: |
          {
            echo "No source changes were generated by the proposal workflow."
            echo "Review uploaded fix-proposal evidence logs for diagnostics."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proposal evidence logs
        uses: actions/upload-artifact@v4
        with:
          name: fix-proposal-evidence-${{ github.run_id }}
          path: ${{ env.LOG_DIR }}/*.log
