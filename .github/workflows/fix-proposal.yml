name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      failure_class:
        description: "Target failure class to remediate"
        required: true
        type: choice
        options:
          - tests
          - audit
          - typecheck
          - mixed
      rationale:
        description: "Optional context for the proposal"
        required: false
        type: string
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fix-proposal-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install }}
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "failure_class=mixed" >> "$GITHUB_OUTPUT"
            echo "failure_url=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "failure_class=${{ github.event.inputs.failure_class }}" >> "$GITHUB_OUTPUT"
            echo "failure_url=manual-dispatch" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=ci/fix-proposal-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - name: Create proposal branch
        run: git switch -c "${{ steps.meta.outputs.branch }}" "${{ steps.meta.outputs.base_sha }}"
      - id: before
        env:
          FAILURE_CLASS: ${{ steps.meta.outputs.failure_class }}
          PM_RUN_CMD: ${{ steps.pm.outputs.run }}
        run: |
          set +e
          case "$FAILURE_CLASS" in
            audit)
              cargo audit > .github/fix-before.log 2>&1
              ;;
            typecheck)
              eval "$PM_RUN_CMD typecheck" > .github/fix-before.log 2>&1
              ;;
            tests)
              cargo test --workspace --tests > .github/fix-before.log 2>&1
              ;;
            *)
              (cargo test --workspace --tests && eval "$PM_RUN_CMD typecheck") > .github/fix-before.log 2>&1
              ;;
          esac
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
      - id: attempt
        env:
          FAILURE_CLASS: ${{ steps.meta.outputs.failure_class }}
          PM_RUN_CMD: ${{ steps.pm.outputs.run }}
        run: |
          case "$FAILURE_CLASS" in
            audit)
              cargo update || true
              npm audit fix --omit=dev || true
              ;;
            typecheck)
              cargo fmt --all
              eval "$PM_RUN_CMD lint:fix" || true
              eval "$PM_RUN_CMD format" || true
              ;;
            tests)
              cargo fmt --all
              eval "$PM_RUN_CMD lint:fix" || true
              ;;
            *)
              cargo update || true
              cargo fmt --all
              eval "$PM_RUN_CMD lint:fix" || true
              eval "$PM_RUN_CMD format" || true
              ;;
          esac

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - id: after
        if: steps.attempt.outputs.changed == 'true'
        env:
          FAILURE_CLASS: ${{ steps.meta.outputs.failure_class }}
          PM_RUN_CMD: ${{ steps.pm.outputs.run }}
        run: |
          set +e
          case "$FAILURE_CLASS" in
            audit)
              cargo audit > .github/fix-after.log 2>&1
              ;;
            typecheck)
              eval "$PM_RUN_CMD typecheck" > .github/fix-after.log 2>&1
              ;;
            tests)
              cargo test --workspace --tests > .github/fix-after.log 2>&1
              ;;
            *)
              (cargo test --workspace --tests && eval "$PM_RUN_CMD typecheck") > .github/fix-after.log 2>&1
              ;;
          esac
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
      - id: sensitive
        if: steps.attempt.outputs.changed == 'true'
        run: |
          files="$(git diff --name-only)"
          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$files" | rg -q '(^|/)(security|audit|crypto|rbac)(/|$)|config/rbac\.yaml'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write proposal body
        if: steps.attempt.outputs.changed == 'true'
        run: |
          cat > .github/fix-proposal-body.md <<'EOF'
          ## CI fix proposal (draft)

          This draft PR was generated by the **fix-proposal** workflow on a new branch.
          It is intentionally draft-only and requires human review before merge.

          ### Trigger
          - Failure source: ${{ steps.meta.outputs.failure_url }}
          - Failure class: `${{ steps.meta.outputs.failure_class }}`
          - Rationale input: `${{ github.event.inputs.rationale || 'n/a' }}`

          ### Evidence
          - Failing-before exit code: `${{ steps.before.outputs.exit_code }}`
          - Passing-after exit code: `${{ steps.after.outputs.exit_code || 'not-run' }}`
          - Before log: `.github/fix-before.log`
          - After log: `.github/fix-after.log`

          ### Changed files
          ```
          ${{ steps.sensitive.outputs.changed_files }}
          ```

          ### Guardrails
          - Never auto-merge this PR.
          - If sensitive areas were touched, `needs-human-review` is applied and automation stops.
          EOF
      - id: cpr
        if: steps.attempt.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.meta.outputs.branch }}
          base: main
          title: "ci: fix proposal for ${{ steps.meta.outputs.failure_class }} failure"
          draft: true
          commit-message: "ci: propose automated remediation for failing pipeline"
          body-path: .github/fix-proposal-body.md
          labels: ci,fix-proposal
      - name: Label sensitive proposal
        if: steps.attempt.outputs.changed == 'true' && steps.sensitive.outputs.hit == 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              labels: ["needs-human-review"],
            });
      - name: Stop automation for sensitive paths
        if: steps.attempt.outputs.changed == 'true' && steps.sensitive.outputs.hit == 'true'
        run: |
          echo "Sensitive path changes detected; labelled needs-human-review and stopping."
          exit 1
      - name: Fail when no proposal diff was generated
        if: steps.attempt.outputs.changed != 'true'
        run: |
          echo "No changes were generated by fix-proposal; manual intervention is required."
          exit 1
