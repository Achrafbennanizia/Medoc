name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      failure_kind:
        description: "Failure kind to target (auto/test/advisory/typecheck/custom)."
        required: false
        default: auto
        type: choice
        options:
          - auto
          - test
          - advisory
          - typecheck
          - custom
      fix_command:
        description: "Optional command that attempts a real fix on a new branch."
        required: false
        type: string
      verify_command:
        description: "Optional command used to prove passing-after evidence."
        required: false
        type: string
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  propose-fix:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked || true

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}

      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}

      - name: Prepare evidence directory
        run: mkdir -p .github/fix-proposal

      - id: commands
        name: Resolve before/fix/after commands
        shell: bash
        env:
          INPUT_FAILURE_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_kind || 'auto' }}
          INPUT_FIX_COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.fix_command || '' }}
          INPUT_VERIFY_COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_command || '' }}
        run: |
          set -euo pipefail
          kind="$INPUT_FAILURE_KIND"
          before_cmd=""
          fix_cmd=""
          verify_cmd=""

          case "$kind" in
            auto)
              before_cmd='cargo test --workspace && npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json && npx tsc --noEmit -p apps/lan-web-client/tsconfig.json && cargo audit'
              fix_cmd=$'cargo update -w || true\nnpm audit fix --package-lock-only --omit=dev || true\nnpm run lint:fix --if-present || true\nnpm run format --if-present || true'
              verify_cmd='cargo test --workspace && npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json && npx tsc --noEmit -p apps/lan-web-client/tsconfig.json && cargo audit'
              ;;
            test)
              before_cmd='cargo test --workspace'
              fix_cmd='echo "No generic test fix command configured. Provide workflow_dispatch input fix_command."'
              verify_cmd='cargo test --workspace'
              ;;
            advisory)
              before_cmd='cargo audit && npm audit --omit=dev'
              fix_cmd=$'cargo update -w || true\nnpm audit fix --package-lock-only --omit=dev || true'
              verify_cmd='cargo audit && npm audit --omit=dev'
              ;;
            typecheck)
              before_cmd='npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json && npx tsc --noEmit -p apps/lan-web-client/tsconfig.json'
              fix_cmd=$'npm run lint:fix --if-present || true\nnpm run format --if-present || true'
              verify_cmd='npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json && npx tsc --noEmit -p apps/lan-web-client/tsconfig.json'
              ;;
            custom)
              before_cmd='echo "Custom fix proposal requested."'
              fix_cmd='echo "No default custom fix command configured."'
              verify_cmd='echo "No default custom verify command configured."'
              ;;
            *)
              echo "::error::Unsupported failure_kind: $kind"
              exit 1
              ;;
          esac

          if [ -n "$INPUT_FIX_COMMAND" ]; then
            fix_cmd="$INPUT_FIX_COMMAND"
          fi
          if [ -n "$INPUT_VERIFY_COMMAND" ]; then
            verify_cmd="$INPUT_VERIFY_COMMAND"
          fi

          {
            echo "kind=$kind"
            echo "before_cmd<<EOF"
            echo "$before_cmd"
            echo "EOF"
            echo "fix_cmd<<EOF"
            echo "$fix_cmd"
            echo "EOF"
            echo "verify_cmd<<EOF"
            echo "$verify_cmd"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: before
        name: Capture failing-before evidence
        shell: bash
        env:
          BEFORE_CMD: ${{ steps.commands.outputs.before_cmd }}
        run: |
          set +e
          bash -lc "$BEFORE_CMD" > .github/fix-proposal/failing-before.log 2>&1
          before_exit="$?"
          set -e
          echo "before_exit=$before_exit" >> "$GITHUB_OUTPUT"

      - id: fix
        name: Attempt real fix
        shell: bash
        env:
          FIX_CMD: ${{ steps.commands.outputs.fix_cmd }}
        run: |
          set +e
          bash -lc "$FIX_CMD" > .github/fix-proposal/fix-attempt.log 2>&1
          fix_exit="$?"
          set -e
          echo "fix_exit=$fix_exit" >> "$GITHUB_OUTPUT"

      - id: after
        name: Capture passing-after evidence
        shell: bash
        env:
          VERIFY_CMD: ${{ steps.commands.outputs.verify_cmd }}
        run: |
          set +e
          bash -lc "$VERIFY_CMD" > .github/fix-proposal/passing-after.log 2>&1
          after_exit="$?"
          set -e
          echo "after_exit=$after_exit" >> "$GITHUB_OUTPUT"

      - id: changes
        name: Detect fix diff
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No code changes produced by fix attempt."
          fi

      - id: sensitive
        name: Tag compliance-sensitive edits
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.has_changes }}" != "true" ]; then
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SENSITIVE_PATTERN='(^|/)(security|audit|crypto|rbac)(/|\\.|_|-)|(^|/)auth(/|\\.|_|-)|(^|/)license(/|\\.|_|-)'
          SENSITIVE_CHANGED="$(git diff --name-only | rg "$SENSITIVE_PATTERN" || true)"
          if [ -n "$SENSITIVE_CHANGED" ]; then
            echo "needs_human_review=true" >> "$GITHUB_OUTPUT"
            echo "$SENSITIVE_CHANGED" > .github/fix-proposal/sensitive-paths.txt
          else
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
          fi

      - id: labels
        name: Resolve PR labels
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.sensitive.outputs.needs_human_review }}" = "true" ]; then
            echo "labels=ci-fix-proposal,needs-human-review" >> "$GITHUB_OUTPUT"
          else
            echo "labels=ci-fix-proposal" >> "$GITHUB_OUTPUT"
          fi

      - name: Build draft PR body
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          FAILURE_KIND: ${{ steps.commands.outputs.kind }}
          BEFORE_CMD: ${{ steps.commands.outputs.before_cmd }}
          FIX_CMD: ${{ steps.commands.outputs.fix_cmd }}
          VERIFY_CMD: ${{ steps.commands.outputs.verify_cmd }}
          BEFORE_EXIT: ${{ steps.before.outputs.before_exit }}
          FIX_EXIT: ${{ steps.fix.outputs.fix_exit }}
          AFTER_EXIT: ${{ steps.after.outputs.after_exit }}
        run: |
          set -euo pipefail
          cat > .github/fix-proposal/pr-body.md <<EOF
          ## CI fix proposal

          This draft PR was generated by tier-3 automation on a new branch.

          - Failure kind: \`$FAILURE_KIND\`
          - Failing-before exit code: \`$BEFORE_EXIT\`
          - Fix command exit code: \`$FIX_EXIT\`
          - Passing-after exit code: \`$AFTER_EXIT\`

          ### Failing-before command
          \`\`\`bash
          EOF
          printf '%s\n' "$BEFORE_CMD" >> .github/fix-proposal/pr-body.md
          cat >> .github/fix-proposal/pr-body.md <<EOF
          \`\`\`

          ### Fix command
          \`\`\`bash
          EOF
          printf '%s\n' "$FIX_CMD" >> .github/fix-proposal/pr-body.md
          cat >> .github/fix-proposal/pr-body.md <<EOF
          \`\`\`

          ### Passing-after command
          \`\`\`bash
          EOF
          printf '%s\n' "$VERIFY_CMD" >> .github/fix-proposal/pr-body.md
          cat >> .github/fix-proposal/pr-body.md <<EOF
          \`\`\`

          ### Failing-before evidence (tail)
          \`\`\`text
          EOF
          tail -n 120 .github/fix-proposal/failing-before.log >> .github/fix-proposal/pr-body.md
          cat >> .github/fix-proposal/pr-body.md <<EOF
          \`\`\`

          ### Passing-after evidence (tail)
          \`\`\`text
          EOF
          tail -n 120 .github/fix-proposal/passing-after.log >> .github/fix-proposal/pr-body.md
          cat >> .github/fix-proposal/pr-body.md <<EOF
          \`\`\`
          EOF

      - name: Open draft PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "ci: fix proposal (${{ steps.commands.outputs.kind }})"
          branch: ci/fix-proposal-${{ github.run_id }}
          base: main
          title: "ci: fix proposal for ${{ steps.commands.outputs.kind }} failure"
          body-path: .github/fix-proposal/pr-body.md
          draft: true
          labels: ${{ steps.labels.outputs.labels }}

      - name: Stop when sensitive paths changed
        if: steps.changes.outputs.has_changes == 'true' && steps.sensitive.outputs.needs_human_review == 'true'
        run: |
          echo "Sensitive paths changed; draft PR is labeled needs-human-review."
          exit 1
