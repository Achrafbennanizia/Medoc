name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Optional context for the failing check set
        required: false
        type: string
      base_ref:
        description: Base branch for the draft proposal PR
        required: false
        default: main
        type: string
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fix-proposal-${{ github.event.workflow_run.head_branch || inputs.base_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  propose-fix:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - name: Resolve trigger context
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "base_ref=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "trigger_reason=verify failed on ${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "trigger_url=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
          else
            BASE="${{ inputs.base_ref }}"
            if [ -z "$BASE" ]; then
              BASE="main"
            fi
            REASON="${{ inputs.reason }}"
            if [ -z "$REASON" ]; then
              REASON="manual fix proposal dispatch"
            fi
            echo "base_ref=$BASE" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$BASE" >> "$GITHUB_OUTPUT"
            echo "trigger_reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "trigger_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac

      - name: Baseline snapshot (before)
        id: before
        run: |
          set +e
          PM="${{ steps.pm.outputs.pm }}"
          overall=0
          : > /tmp/fix-before.log

          run_medoc_script() {
            case "$PM" in
              pnpm) pnpm --filter medoc run "$1" ;;
              yarn) yarn workspace medoc run "$1" ;;
              npm) npm run "$1" -w medoc ;;
            esac
          }

          echo "$ cargo test --workspace --all-targets" >> /tmp/fix-before.log
          cargo test --workspace --all-targets >> /tmp/fix-before.log 2>&1
          rust_status=$?
          echo "exit_code=$rust_status" >> /tmp/fix-before.log
          if [ "$rust_status" -ne 0 ]; then
            overall=1
          fi

          echo "$ lint/typecheck/test/build (web)" >> /tmp/fix-before.log
          run_medoc_script lint >> /tmp/fix-before.log 2>&1
          lint_status=$?
          if [ "$lint_status" -ne 0 ]; then
            overall=1
          fi

          if node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('apps/practice-host-ui/package.json','utf8')); process.exit(pkg.scripts && pkg.scripts.typecheck ? 0 : 1);" ; then
            run_medoc_script typecheck >> /tmp/fix-before.log 2>&1
            type_status=$?
          else
            case "$PM" in
              pnpm) pnpm --filter medoc exec tsc --noEmit >> /tmp/fix-before.log 2>&1 ;;
              yarn) yarn workspace medoc tsc --noEmit >> /tmp/fix-before.log 2>&1 ;;
              npm) npm exec --workspace medoc -- tsc --noEmit >> /tmp/fix-before.log 2>&1 ;;
            esac
            type_status=$?
          fi
          if [ "$type_status" -ne 0 ]; then
            overall=1
          fi

          run_medoc_script test >> /tmp/fix-before.log 2>&1
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            overall=1
          fi

          run_medoc_script build >> /tmp/fix-before.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            overall=1
          fi

          echo "status=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Attempt fix via configured agent command
        id: agent
        env:
          FIX_PROPOSAL_AGENT_CMD: ${{ secrets.FIX_PROPOSAL_AGENT_CMD }}
        run: |
          if [ -z "${FIX_PROPOSAL_AGENT_CMD:-}" ]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "No FIX_PROPOSAL_AGENT_CMD configured." > /tmp/fix-agent.log
            exit 0
          fi

          echo "ran=true" >> "$GITHUB_OUTPUT"
          set +e
          bash -lc "$FIX_PROPOSAL_AGENT_CMD" > /tmp/fix-agent.log 2>&1
          agent_exit=$?
          set -e
          echo "exit_code=$agent_exit" >> /tmp/fix-agent.log

      - name: Verification snapshot (after)
        id: after
        run: |
          set +e
          PM="${{ steps.pm.outputs.pm }}"
          overall=0
          : > /tmp/fix-after.log

          run_medoc_script() {
            case "$PM" in
              pnpm) pnpm --filter medoc run "$1" ;;
              yarn) yarn workspace medoc run "$1" ;;
              npm) npm run "$1" -w medoc ;;
            esac
          }

          echo "$ cargo test --workspace --all-targets" >> /tmp/fix-after.log
          cargo test --workspace --all-targets >> /tmp/fix-after.log 2>&1
          rust_status=$?
          if [ "$rust_status" -ne 0 ]; then
            overall=1
          fi

          echo "$ lint/typecheck/test/build (web)" >> /tmp/fix-after.log
          run_medoc_script lint >> /tmp/fix-after.log 2>&1
          lint_status=$?
          if [ "$lint_status" -ne 0 ]; then
            overall=1
          fi

          if node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('apps/practice-host-ui/package.json','utf8')); process.exit(pkg.scripts && pkg.scripts.typecheck ? 0 : 1);" ; then
            run_medoc_script typecheck >> /tmp/fix-after.log 2>&1
            type_status=$?
          else
            case "$PM" in
              pnpm) pnpm --filter medoc exec tsc --noEmit >> /tmp/fix-after.log 2>&1 ;;
              yarn) yarn workspace medoc tsc --noEmit >> /tmp/fix-after.log 2>&1 ;;
              npm) npm exec --workspace medoc -- tsc --noEmit >> /tmp/fix-after.log 2>&1 ;;
            esac
            type_status=$?
          fi
          if [ "$type_status" -ne 0 ]; then
            overall=1
          fi

          run_medoc_script test >> /tmp/fix-after.log 2>&1
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            overall=1
          fi

          run_medoc_script build >> /tmp/fix-after.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            overall=1
          fi

          echo "status=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Detect proposal diff
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u > /tmp/fix-proposal-files.txt
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            : > /tmp/fix-proposal-files.txt
          fi

      - name: Detect sensitive-path changes
        id: sensitive
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          if rg -n '(^|/)(security|audit|crypto|rbac)(/|_|-|\\.)|^config/rbac\\.yaml$' /tmp/fix-proposal-files.txt > /tmp/fix-sensitive-hits.txt; then
            echo "touches=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches=false" >> "$GITHUB_OUTPUT"
            : > /tmp/fix-sensitive-hits.txt
          fi

      - name: Prepare draft PR body
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          {
            echo "## Tier 3 fix proposal"
            echo
            echo "- Trigger reason: ${{ steps.ctx.outputs.trigger_reason }}"
            echo "- Trigger run: ${{ steps.ctx.outputs.trigger_url }}"
            echo "- Baseline status (before): ${{ steps.before.outputs.status }}"
            echo "- Verification status (after): ${{ steps.after.outputs.status }}"
            echo "- Agent command executed: ${{ steps.agent.outputs.ran || 'false' }}"
            echo
            echo "### Changed files"
            echo '```text'
            cat /tmp/fix-proposal-files.txt
            echo '```'
            echo
            echo "### Failing-before evidence (tail)"
            echo '```text'
            tail -n 80 /tmp/fix-before.log
            echo '```'
            echo
            echo "### Passing-after evidence (tail)"
            echo '```text'
            tail -n 80 /tmp/fix-after.log
            echo '```'
            echo
            echo "### Agent attempt output (tail)"
            echo '```text'
            tail -n 80 /tmp/fix-agent.log
            echo '```'
          } > /tmp/fix-proposal-pr-body.md

      - name: Open draft proposal PR
        id: cpr
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/fix-proposal-${{ github.run_id }}
          base: ${{ steps.ctx.outputs.base_ref }}
          draft: true
          delete-branch: true
          commit-message: "ci: propose fix for failing verification"
          title: "ci: fix proposal for failing verification"
          body-path: /tmp/fix-proposal-pr-body.md
          labels: |
            ci
            fix-proposal

      - name: Add needs-human-review label for sensitive paths
        if: steps.cpr.outputs.pull-request-number != '' && steps.sensitive.outputs.touches == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              labels: ["needs-human-review"]
            });

      - name: No-change summary
        if: steps.diff.outputs.has_changes != 'true'
        run: |
          {
            echo "No changes produced by fix-proposal run."
            echo "Trigger: ${{ steps.ctx.outputs.trigger_reason }}"
            echo "Before status: ${{ steps.before.outputs.status }}"
            echo "After status: ${{ steps.after.outputs.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proposal logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-proposal-logs-${{ github.run_id }}
          path: |
            /tmp/fix-before.log
            /tmp/fix-after.log
            /tmp/fix-agent.log
            /tmp/fix-proposal-files.txt
            /tmp/fix-sensitive-hits.txt
