name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this fix proposal is being run"
        required: false
      verify_command:
        description: "Verification command used for failing-before/passing-after evidence"
        required: false
      fix_command:
        description: "Fix command that may create a proposal diff"
        required: false
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-main
  cancel-in-progress: true

jobs:
  propose-fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - id: context
        name: Resolve target context and commands
        shell: bash
        env:
          DEFAULT_BASELINE_COMMAND: cargo test --workspace
          BASELINE_FROM_VAR: ${{ vars.CI_FIX_PROPOSAL_BASELINE_COMMAND }}
          FIX_FROM_VAR: ${{ vars.CI_FIX_PROPOSAL_COMMAND }}
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
          DISPATCH_BASELINE: ${{ github.event.inputs.verify_command }}
          DISPATCH_FIX: ${{ github.event.inputs.fix_command }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "target_branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "target_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "reason=Triggered by failed verify on main: ${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "target_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            if [ -n "$DISPATCH_REASON" ]; then
              echo "reason=$DISPATCH_REASON" >> "$GITHUB_OUTPUT"
            else
              echo "reason=Manual workflow dispatch" >> "$GITHUB_OUTPUT"
            fi
          fi

          baseline="${DISPATCH_BASELINE:-$BASELINE_FROM_VAR}"
          if [ -z "$baseline" ]; then
            baseline="$DEFAULT_BASELINE_COMMAND"
          fi
          echo "baseline_cmd=$baseline" >> "$GITHUB_OUTPUT"

          fix_cmd="${DISPATCH_FIX:-$FIX_FROM_VAR}"
          echo "fix_cmd=$fix_cmd" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          fetch-depth: 0

      - id: pm
        name: Detect JavaScript package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install }}

      - id: verify_before
        name: Verify before fix attempt
        shell: bash
        env:
          BASELINE_CMD: ${{ steps.context.outputs.baseline_cmd }}
        run: |
          mkdir -p .ci/fix-proposal
          set +e
          bash -lc "$BASELINE_CMD" > .ci/fix-proposal/verify-before.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - id: fix_attempt
        name: Apply fix attempt
        shell: bash
        env:
          FIX_CMD: ${{ steps.context.outputs.fix_cmd }}
        run: |
          if [ -z "$FIX_CMD" ]; then
            echo "No fix command configured (set CI_FIX_PROPOSAL_COMMAND or workflow input)." > .ci/fix-proposal/fix-attempt.log
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          bash -lc "$FIX_CMD" > .ci/fix-proposal/fix-attempt.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - id: verify_after
        name: Verify after fix attempt
        shell: bash
        env:
          BASELINE_CMD: ${{ steps.context.outputs.baseline_cmd }}
        run: |
          set +e
          bash -lc "$BASELINE_CMD" > .ci/fix-proposal/verify-after.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - id: changes
        name: Detect changed files
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff --name-only > .ci/fix-proposal/changed-files.txt
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - id: restricted
        if: steps.changes.outputs.has_changes == 'true'
        name: Check for restricted code paths
        shell: bash
        run: |
          if rg -i "(security|audit|crypto|rbac)" .ci/fix-proposal/changed-files.txt >/dev/null; then
            echo "restricted=true" >> "$GITHUB_OUTPUT"
          else
            echo "restricted=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.has_changes == 'true'
        name: Build draft PR body
        shell: bash
        env:
          BASELINE_CMD: ${{ steps.context.outputs.baseline_cmd }}
          FIX_CMD: ${{ steps.context.outputs.fix_cmd }}
          REASON: ${{ steps.context.outputs.reason }}
          BEFORE_EXIT: ${{ steps.verify_before.outputs.exit_code }}
          FIX_EXIT: ${{ steps.fix_attempt.outputs.exit_code }}
          AFTER_EXIT: ${{ steps.verify_after.outputs.exit_code }}
          RESTRICTED: ${{ steps.restricted.outputs.restricted }}
        run: |
          {
            echo "## CI fix proposal"
            echo
            echo "- Trigger reason: $REASON"
            echo "- Source commit: \`${{ steps.context.outputs.target_sha }}\`"
            echo "- Source branch: \`${{ steps.context.outputs.target_branch }}\`"
            echo
            echo "## Evidence"
            echo
            echo "- Baseline verify command: \`$BASELINE_CMD\`"
            if [ -n "$FIX_CMD" ]; then
              echo "- Fix command: \`$FIX_CMD\`"
            else
              echo "- Fix command: _(not configured; only baseline evidence captured)_"
            fi
            echo "- Verify before exit code: \`$BEFORE_EXIT\`"
            echo "- Fix command exit code: \`$FIX_EXIT\`"
            echo "- Verify after exit code: \`$AFTER_EXIT\`"
            echo
            echo "## Changed files"
            echo
            echo '```text'
            cat .ci/fix-proposal/changed-files.txt
            echo '```'
            echo
            echo "## Log excerpts"
            echo
            echo "<details><summary>verify before (tail)</summary>"
            echo
            echo '```text'
            tail -n 80 .ci/fix-proposal/verify-before.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>fix attempt (tail)</summary>"
            echo
            echo '```text'
            tail -n 80 .ci/fix-proposal/fix-attempt.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>verify after (tail)</summary>"
            echo
            echo '```text'
            tail -n 80 .ci/fix-proposal/verify-after.log
            echo '```'
            echo
            echo "</details>"
            echo
            if [ "$RESTRICTED" = "true" ]; then
              echo "> ⚠️ Restricted path touched (security/audit/crypto/RBAC). This proposal requires explicit human review."
            fi
          } > .ci/fix-proposal/pr-body.md

      - if: steps.changes.outputs.has_changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/fix-proposal-${{ github.run_id }}
          base: main
          title: "ci: draft fix proposal for failing verify gate"
          body-path: .ci/fix-proposal/pr-body.md
          commit-message: "ci: draft fix proposal from failing verify gate"
          draft: true
          labels: ci-fix-proposal
          delete-branch: false

      - if: steps.changes.outputs.has_changes == 'true' && steps.restricted.outputs.restricted == 'true' && steps.create_pr.outputs.pull-request-number != ''
        name: Add needs-human-review label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number("${{ steps.create_pr.outputs.pull-request-number }}"),
                labels: ["needs-human-review"]
              });
            } catch (error) {
              core.warning(`Could not add needs-human-review label: ${error.message}`);
            }

      - if: steps.changes.outputs.has_changes == 'true' && steps.restricted.outputs.restricted == 'true'
        name: Stop for required human review
        run: |
          echo "Restricted files were touched by fix proposal. Human review is required."
          exit 1

      - if: steps.changes.outputs.has_changes != 'true'
        name: No fix proposal created
        run: |
          echo "No code changes were produced by the fix proposal run."
