name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch for the draft PR"
        required: false
        default: "main"
        type: string
      failing_command:
        description: "Command that reproduces the failure before the fix"
        required: true
        type: string
      fix_command:
        description: "Command that applies the proposed fix"
        required: true
        type: string
      passing_command:
        description: "Command that must pass after the fix"
        required: true
        type: string
      rationale:
        description: "Short rationale for the proposed fix"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-fix:
    name: propose draft fix PR
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - id: context
        name: Resolve trigger context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASE_REF: ${{ inputs.base_ref }}
          DISPATCH_FAILING_COMMAND: ${{ inputs.failing_command }}
          DISPATCH_FIX_COMMAND: ${{ inputs.fix_command }}
          DISPATCH_PASSING_COMMAND: ${{ inputs.passing_command }}
          DISPATCH_RATIONALE: ${{ inputs.rationale }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTO_FAILING_COMMAND: ${{ vars.CI_FIX_PROPOSAL_FAILING_COMMAND }}
          AUTO_FIX_COMMAND: ${{ vars.CI_FIX_PROPOSAL_FIX_COMMAND }}
          AUTO_PASSING_COMMAND: ${{ vars.CI_FIX_PROPOSAL_PASSING_COMMAND }}
        run: |
          branch_name="ci/fix-proposal/$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            checkout_ref="${DISPATCH_BASE_REF:-main}"
            base_branch="${DISPATCH_BASE_REF:-main}"
            failing_command="$DISPATCH_FAILING_COMMAND"
            fix_command="$DISPATCH_FIX_COMMAND"
            passing_command="$DISPATCH_PASSING_COMMAND"
            rationale="${DISPATCH_RATIONALE:-Manual fix proposal run.}"
          else
            checkout_ref="$WORKFLOW_RUN_HEAD_SHA"
            base_branch="main"
            failing_command="${AUTO_FAILING_COMMAND:-cargo test --workspace --tests}"
            fix_command="${AUTO_FIX_COMMAND:-echo 'CI_FIX_PROPOSAL_FIX_COMMAND repository variable is not set'; exit 1}"
            passing_command="${AUTO_PASSING_COMMAND:-${AUTO_FAILING_COMMAND:-cargo test --workspace --tests}}"
            rationale="Auto-triggered from failed verify run ${WORKFLOW_RUN_ID} on branch ${WORKFLOW_RUN_HEAD_BRANCH}."
          fi

          {
            echo "branch_name=$branch_name"
            echo "checkout_ref=$checkout_ref"
            echo "base_branch=$base_branch"
            echo "failing_command<<EOF"
            echo "$failing_command"
            echo "EOF"
            echo "fix_command<<EOF"
            echo "$fix_command"
            echo "EOF"
            echo "passing_command<<EOF"
            echo "$passing_command"
            echo "EOF"
            echo "rationale<<EOF"
            echo "$rationale"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --immutable" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}

      - name: Create proposal branch
        run: git checkout -b "${{ steps.context.outputs.branch_name }}"

      - id: failing
        name: Capture failing-before evidence
        shell: bash
        run: |
          set +e
          bash -lc "${{ steps.context.outputs.failing_command }}" > failing-before.log 2>&1
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "Warning: failing-before command exited 0." >> failing-before.log
          fi

      - name: Apply proposed fix command
        shell: bash
        run: bash -lc "${{ steps.context.outputs.fix_command }}"

      - name: Capture passing-after evidence
        shell: bash
        run: bash -lc "${{ steps.context.outputs.passing_command }}" > passing-after.log 2>&1

      - name: Ensure proposed fix actually changed files
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Fix command produced no repository changes; no draft PR to open."
            exit 1
          fi

      - id: sensitive
        name: Detect sensitive-code touches
        shell: bash
        run: |
          git diff --name-only > changed-files.txt
          if rg -n -i "(^|/)(security|audit|crypto|rbac)(/|_|\\.|$)" changed-files.txt >/dev/null; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build draft PR body
        shell: bash
        run: |
          cat <<'EOF' > fix-proposal-body.md
          ## Summary

          ${{ steps.context.outputs.rationale }}

          ## Evidence

          - Failing-before command: `${{ steps.context.outputs.failing_command }}`
          - Failing-before exit code: `${{ steps.failing.outputs.exit_code }}`
          - Passing-after command: `${{ steps.context.outputs.passing_command }}`
          - Passing-after exit code: `0`

          Full logs are attached as the workflow artifact `fix-proposal-evidence`.

          ## Safety

          - This PR was opened as **draft** and is never auto-merged.
          - If sensitive paths (security/audit/crypto/RBAC) were touched, the workflow applies `needs-human-review` and stops.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: fix-proposal-evidence
          path: |
            failing-before.log
            passing-after.log
            changed-files.txt

      - id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: propose fix for failing verification"
          branch: ${{ steps.context.outputs.branch_name }}
          base: ${{ steps.context.outputs.base_branch }}
          title: "ci: draft fix proposal for failing verification"
          body-path: fix-proposal-body.md
          draft: true
          delete-branch: false

      - name: Label sensitive fix proposals
        if: steps.sensitive.outputs.sensitive == 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              labels: ["needs-human-review"],
            });

      - name: Stop automation for sensitive changes
        if: steps.sensitive.outputs.sensitive == 'true'
        run: |
          echo "Sensitive path(s) touched; draft PR labeled needs-human-review."
          exit 1
