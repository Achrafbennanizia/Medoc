name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch for the proposal PR."
        required: false
        default: "main"
      verify_command:
        description: "Command used for failing-before/passing-after evidence."
        required: false
        default: "cargo test --workspace --tests && npm run typecheck && npm run test"
      fix_command:
        description: "Optional substantive fix command. If empty, advisory update fallback is used."
        required: false
        default: ""
      rationale:
        description: "Rationale shown in the draft PR body."
        required: false
        default: "Manual fix-proposal dispatch."
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  propose:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - id: context
        name: Resolve trigger context
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "base_branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "reason=Triggered by failing verify run: ${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_branch=${{ inputs.base_branch }}" >> "$GITHUB_OUTPUT"
            echo "reason=${{ inputs.rationale }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.base_branch }}
      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - run: corepack enable
      - name: Install dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - id: verifycmd
        name: Resolve verification command
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf 'value=%s\n' "${{ inputs.verify_command }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) printf 'value=%s\n' "cargo test --workspace --tests && pnpm run typecheck && pnpm run test" >> "$GITHUB_OUTPUT" ;;
              yarn) printf 'value=%s\n' "cargo test --workspace --tests && yarn run typecheck && yarn run test" >> "$GITHUB_OUTPUT" ;;
              npm) printf 'value=%s\n' "cargo test --workspace --tests && npm run typecheck && npm run test" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - id: before
        name: Capture failing-before evidence
        shell: bash
        env:
          MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
          MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
          VERIFY_COMMAND: ${{ steps.verifycmd.outputs.value }}
        run: |
          set +e
          bash -lc "$VERIFY_COMMAND" > before.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - id: fixcmd
        name: Resolve fix command
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.fix_command }}" ]]; then
            printf 'value=%s\n' "${{ inputs.fix_command }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) printf 'value=%s\n' "cargo update --workspace || true" >> "$GITHUB_OUTPUT" ;;
              yarn) printf 'value=%s\n' "cargo update --workspace || true" >> "$GITHUB_OUTPUT" ;;
              npm) printf 'value=%s\n' "cargo update --workspace || true; npm audit fix --package-lock-only --omit=dev || true" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - id: attempt
        name: Attempt substantive remediation
        shell: bash
        env:
          MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
          MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
          FIX_COMMAND: ${{ steps.fixcmd.outputs.value }}
        run: |
          set +e
          bash -lc "$FIX_COMMAND" > fix.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - id: after
        name: Capture passing-after evidence
        shell: bash
        env:
          MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
          MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
          VERIFY_COMMAND: ${{ steps.verifycmd.outputs.value }}
        run: |
          set +e
          bash -lc "$VERIFY_COMMAND" > after.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix-proposal-evidence-${{ github.run_id }}
          path: |
            before.log
            fix.log
            after.log
      - id: diff
        name: Check whether remediation changed files
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - id: labels
        if: steps.diff.outputs.has_changes == 'true'
        name: Detect sensitive code changes
        shell: bash
        run: |
          if git diff --name-only | rg -i '(security|audit|crypto|rbac)' >/dev/null; then
            echo "needs_human_review=true" >> "$GITHUB_OUTPUT"
            echo "labels=ci-fix-proposal,needs-human-review" >> "$GITHUB_OUTPUT"
          else
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
            echo "labels=ci-fix-proposal" >> "$GITHUB_OUTPUT"
          fi
      - id: cpr
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/fix-proposal-${{ github.run_id }}
          base: ${{ steps.context.outputs.base_branch }}
          draft: true
          commit-message: "ci: propose automated remediation"
          title: "ci: fix proposal for verify gate failures"
          labels: ${{ steps.labels.outputs.labels }}
          body: |
            ## Fix proposal rationale
            ${{ steps.context.outputs.reason }}

            ## Evidence
            - Failing-before command: `${{ steps.verifycmd.outputs.value }}`
            - Failing-before exit code: `${{ steps.before.outputs.status }}`
            - Remediation command: `${{ steps.fixcmd.outputs.value }}`
            - Remediation exit code: `${{ steps.attempt.outputs.status }}`
            - Passing-after command: `${{ steps.verifycmd.outputs.value }}`
            - Passing-after exit code: `${{ steps.after.outputs.status }}`
            - Workflow artifacts include `before.log`, `fix.log`, and `after.log`.

            ## Guardrails
            - Draft PR only (never auto-merged).
            - If security/audit/crypto/RBAC paths are touched, `needs-human-review` is applied.
      - name: No changes to propose
        if: steps.diff.outputs.has_changes != 'true'
        run: echo "No code changes were produced by the remediation attempt."
      - name: Stop on sensitive paths
        if: steps.diff.outputs.has_changes == 'true' && steps.labels.outputs.needs_human_review == 'true'
        run: |
          echo "Sensitive files changed. Draft PR was labeled needs-human-review."
          exit 1
