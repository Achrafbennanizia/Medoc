name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      rationale:
        description: Why this substantive fix is proposed
        required: true
      verify_command:
        description: Command that reproduces the failure before the fix
        required: false
        default: cargo test --workspace && npm run typecheck && npm run test
      fix_command:
        description: Command that attempts a substantive fix
        required: true
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  propose-fix:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - id: cfg
        name: Resolve proposal configuration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "verify_command=${{ inputs.verify_command }}" >> "$GITHUB_OUTPUT"
            echo "fix_command=${{ inputs.fix_command }}" >> "$GITHUB_OUTPUT"
            {
              echo "rationale<<EOF"
              echo "${{ inputs.rationale }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            if [ -x scripts/ci/fix-proposal.sh ]; then
              echo "fix_command=./scripts/ci/fix-proposal.sh" >> "$GITHUB_OUTPUT"
            else
              echo "fix_command=" >> "$GITHUB_OUTPUT"
            fi
            echo "verify_command=cargo test --workspace && npm run typecheck && npm run test" >> "$GITHUB_OUTPUT"
            {
              echo "rationale<<EOF"
              echo "Triggered automatically by a failed verify run on main: ${{ github.event.workflow_run.html_url }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Require an explicit substantive fix strategy
        if: steps.cfg.outputs.fix_command == ''
        run: |
          echo "No non-deterministic fix strategy configured for red-main trigger."
          echo "Use workflow_dispatch with a targeted fix_command, or add scripts/ci/fix-proposal.sh."
          exit 1

      - id: branch
        name: Create proposal branch
        run: |
          PROPOSAL_BRANCH="ci/fix-proposal-${{ github.run_id }}"
          git checkout -b "$PROPOSAL_BRANCH"
          echo "proposal_branch=$PROPOSAL_BRANCH" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install_cmd }}

      - id: verify_before
        name: Capture failing-before evidence
        env:
          VERIFY_COMMAND: ${{ steps.cfg.outputs.verify_command }}
        run: |
          mkdir -p /tmp/fix-proposal
          set +e
          bash -lc "$VERIFY_COMMAND" > /tmp/fix-proposal/verify-before.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - id: apply_fix
        name: Attempt substantive fix
        env:
          FIX_COMMAND: ${{ steps.cfg.outputs.fix_command }}
        run: |
          set +e
          bash -lc "$FIX_COMMAND" > /tmp/fix-proposal/fix.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - id: verify_after
        name: Capture passing-after evidence
        env:
          VERIFY_COMMAND: ${{ steps.cfg.outputs.verify_command }}
        run: |
          set +e
          bash -lc "$VERIFY_COMMAND" > /tmp/fix-proposal/verify-after.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - id: sensitive
        name: Detect sensitive code touches
        run: |
          git diff --name-only origin/main...HEAD > /tmp/fix-proposal/changed-files.txt
          if rg -n -i '(^|/)(security|audit|crypto|rbac)(/|_|\\.|$)' /tmp/fix-proposal/changed-files.txt; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build draft PR body
        run: |
          cat > /tmp/fix-proposal/pr-body.md <<'EOF'
          ## Tier 3 fix proposal

          ### Rationale
          ${{ steps.cfg.outputs.rationale }}

          ### Commands
          - Verify command: `${{ steps.cfg.outputs.verify_command }}`
          - Fix command: `${{ steps.cfg.outputs.fix_command }}`

          ### Evidence
          - verify-before exit code: `${{ steps.verify_before.outputs.status }}`
          - fix-command exit code: `${{ steps.apply_fix.outputs.status }}`
          - verify-after exit code: `${{ steps.verify_after.outputs.status }}`

          ### Logs
          #### verify-before (last 80 lines)
          ```text
          EOF
          tail -n 80 /tmp/fix-proposal/verify-before.log >> /tmp/fix-proposal/pr-body.md || true
          cat >> /tmp/fix-proposal/pr-body.md <<'EOF'
          ```

          #### fix-command (last 80 lines)
          ```text
          EOF
          tail -n 80 /tmp/fix-proposal/fix.log >> /tmp/fix-proposal/pr-body.md || true
          cat >> /tmp/fix-proposal/pr-body.md <<'EOF'
          ```

          #### verify-after (last 80 lines)
          ```text
          EOF
          tail -n 80 /tmp/fix-proposal/verify-after.log >> /tmp/fix-proposal/pr-body.md || true
          cat >> /tmp/fix-proposal/pr-body.md <<'EOF'
          ```
          EOF

      - id: cpr
        name: Open draft proposal PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "ci: tier-3 fix proposal"
          branch: ${{ steps.branch.outputs.proposal_branch }}
          base: main
          title: "ci: tier-3 fix proposal (${{ github.run_id }})"
          body-path: /tmp/fix-proposal/pr-body.md
          draft: true
          labels: ci,fix-proposal

      - name: Label sensitive proposals
        if: steps.sensitive.outputs.sensitive == 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              labels: ["needs-human-review"]
            });

      - name: Stop on sensitive code touches
        if: steps.sensitive.outputs.sensitive == 'true'
        run: |
          echo "Sensitive files changed; applied needs-human-review label. Manual review is required."
          exit 1
