name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Base branch for the draft fix proposal
        required: false
        default: main
        type: string
      reason:
        description: Why this fix proposal run was requested
        required: false
        default: Manual fix-proposal request
        type: string
      agent_command:
        description: Optional override command for the fix agent
        required: false
        type: string
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: fix-proposal-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  propose:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_branch || github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - id: branch
        name: Create proposal branch
        run: |
          branch="ci/fix-proposal-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_cmd=pnpm --filter medoc lint" >> "$GITHUB_OUTPUT"
            echo "test_cmd=pnpm --filter medoc test" >> "$GITHUB_OUTPUT"
            echo "build_cmd=pnpm --filter medoc build" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_cmd=yarn workspace medoc lint" >> "$GITHUB_OUTPUT"
            echo "test_cmd=yarn workspace medoc test" >> "$GITHUB_OUTPUT"
            echo "build_cmd=yarn workspace medoc build" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "lint_cmd=npm run lint -w medoc" >> "$GITHUB_OUTPUT"
            echo "test_cmd=npm run test -w medoc" >> "$GITHUB_OUTPUT"
            echo "build_cmd=npm run build -w medoc" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.name }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}

      - name: Capture failing-before evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-fix-evidence
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh run view "${{ github.event.workflow_run.id }}" --log-failed > /tmp/ci-fix-evidence/failing-before.log || true
          fi

      - name: Run fix-proposal agent command
        shell: bash
        env:
          INPUT_AGENT_COMMAND: ${{ inputs.agent_command }}
          SECRET_AGENT_COMMAND: ${{ secrets.CI_FIX_AGENT_COMMAND }}
        run: |
          set -euo pipefail
          agent_cmd="${INPUT_AGENT_COMMAND:-}"
          if [ -z "$agent_cmd" ]; then
            agent_cmd="${SECRET_AGENT_COMMAND:-}"
          fi
          if [ -z "$agent_cmd" ]; then
            echo "::error::No fix agent command configured. Set workflow input 'agent_command' or secret 'CI_FIX_AGENT_COMMAND'."
            exit 1
          fi
          bash -lc "$agent_cmd"

      - id: verify_after
        name: Collect passing-after evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-fix-evidence
          overall=0

          run_and_capture() {
            name="$1"
            cmd="$2"
            log="/tmp/ci-fix-evidence/${name}.log"
            set +e
            bash -lc "$cmd" >"$log" 2>&1
            status=$?
            set -e
            echo "${name}_status=$status" >> "$GITHUB_OUTPUT"
            if [ "$status" -ne 0 ]; then
              overall=1
            fi
          }

          run_and_capture rust_fmt "cargo fmt --all -- --check"
          run_and_capture rust_clippy "cargo clippy --workspace --all-targets -- -D warnings"
          run_and_capture rust_test "cargo test --workspace"
          run_and_capture rust_audit "if ! command -v cargo-audit >/dev/null 2>&1; then cargo install cargo-audit --locked; fi && cargo audit"
          run_and_capture js_lint "${{ steps.pm.outputs.lint_cmd }}"
          run_and_capture js_typecheck "npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json && if [ -f apps/lan-web-client/tsconfig.json ]; then npx tsc --noEmit -p apps/lan-web-client/tsconfig.json; fi"
          run_and_capture js_test "${{ steps.pm.outputs.test_cmd }}"
          run_and_capture js_build "${{ steps.pm.outputs.build_cmd }}"

          echo "overall_status=$overall" >> "$GITHUB_OUTPUT"

      - id: scope
        name: Detect changed files and sensitive scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
            echo "changed_files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if echo "$changed" | grep -Eiq '(^|/)(security|audit|crypto|rbac)(/|[-_.]|$)'; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail when no proposal diff was produced
        if: steps.scope.outputs.changed != 'true'
        run: |
          echo "::error::Fix agent produced no working tree changes; no draft PR created."
          exit 1

      - id: pr_body
        name: Compose draft PR body
        shell: bash
        run: |
          set -euo pipefail
          fail_before_line="- Manual request reason: ${{ inputs.reason }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            fail_before_line="- Failed verify run: ${{ github.event.workflow_run.html_url }}"
          fi

          overall_line="❌ verify-after commands still failing"
          if [ "${{ steps.verify_after.outputs.overall_status }}" = "0" ]; then
            overall_line="✅ verify-after commands passed"
          fi

          {
            echo "body<<'EOF'"
            echo "## CI Fix Proposal (Draft)"
            echo
            echo "This draft PR was opened by the Tier 3 fix-proposal workflow."
            echo
            echo "### Failing-before evidence"
            echo "$fail_before_line"
            if [ -f /tmp/ci-fix-evidence/failing-before.log ]; then
              echo "- Failed log capture: \`gh run view --log-failed\` archived in workflow artifacts/logs."
            fi
            echo
            echo "### Passing-after evidence"
            echo "- Overall: $overall_line"
            echo
            echo "| Check | Exit code |"
            echo "| --- | ---: |"
            echo "| cargo fmt --all -- --check | ${{ steps.verify_after.outputs.rust_fmt_status }} |"
            echo "| cargo clippy --workspace --all-targets -- -D warnings | ${{ steps.verify_after.outputs.rust_clippy_status }} |"
            echo "| cargo test --workspace | ${{ steps.verify_after.outputs.rust_test_status }} |"
            echo "| cargo audit | ${{ steps.verify_after.outputs.rust_audit_status }} |"
            echo "| web lint | ${{ steps.verify_after.outputs.js_lint_status }} |"
            echo "| web typecheck | ${{ steps.verify_after.outputs.js_typecheck_status }} |"
            echo "| web test | ${{ steps.verify_after.outputs.js_test_status }} |"
            echo "| web build | ${{ steps.verify_after.outputs.js_build_status }} |"
            echo
            echo "### Proposed diff"
            echo '```text'
            echo "${{ steps.scope.outputs.changed_files }}"
            echo '```'
            echo
            echo "### Guardrails"
            echo "- Draft PR only (no auto-merge)."
            echo "- If sensitive files (security/audit/crypto/RBAC) are touched, this workflow adds \`needs-human-review\` and stops."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.branch.outputs.name }}
          base: ${{ github.event_name == 'workflow_dispatch' && inputs.base_branch || github.event.workflow_run.head_branch }}
          commit-message: "ci: draft fix proposal from failed verify"
          title: "ci: draft fix proposal"
          body: ${{ steps.pr_body.outputs.body }}
          draft: true
          labels: ci,fix-proposal

      - name: Add needs-human-review label for sensitive changes
        if: steps.scope.outputs.sensitive == 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              labels: ["needs-human-review"],
            });

      - name: Stop after labeling sensitive proposal
        if: steps.scope.outputs.sensitive == 'true'
        run: |
          echo "::error::Sensitive paths were modified; 'needs-human-review' label applied and automation stopped."
          exit 1
