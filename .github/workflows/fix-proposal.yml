name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: Why this fix proposal was started
        required: false
        type: string
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.event.workflow_run.head_branch || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  propose-fix:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - name: Resolve source metadata
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "source_url=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
            echo "reason=verify-main-failure" >> "$GITHUB_OUTPUT"
          else
            reason="${{ github.event.inputs.trigger_reason }}"
            if [ -z "$reason" ]; then
              reason="manual-dispatch"
            fi
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "source_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - run: corepack enable
      - name: Install dependencies
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - run: cargo install cargo-audit --locked || true
      - name: Attempt remediation and collect evidence
        env:
          PM: ${{ steps.pm.outputs.pm }}
          SOURCE_RUN_URL: ${{ steps.source.outputs.source_url }}
          TRIGGER_REASON: ${{ steps.source.outputs.reason }}
          REPORT_PATH: /tmp/fix-proposal-report.md
          LOG_DIR: /tmp/fix-proposal-logs
        run: bash scripts/ci/fix-proposal-attempt.sh
      - name: Evaluate changes and compliance scope
        id: guard
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "needs_human=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          changed_files="$(git diff --name-only)"
          if printf '%s\n' "$changed_files" | grep -E '(^|/)(security|audit|crypto)(/|_|\.|$)|(^|/)rbac(\.|/|_|$)|(^|/)config/rbac\.yaml$'; then
            echo "needs_human=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_human=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open draft fix proposal PR
        if: steps.guard.outputs.has_changes == 'true' && steps.guard.outputs.needs_human == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ steps.source.outputs.base }}
          branch: ci/fix-proposal-${{ github.run_id }}
          delete-branch: false
          commit-message: "ci: propose remediation for failing verify gate"
          title: "ci: automated fix proposal for verify gate"
          body-path: /tmp/fix-proposal-report.md
          draft: true
      - name: Open draft PR and enforce human review label
        if: steps.guard.outputs.has_changes == 'true' && steps.guard.outputs.needs_human == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ steps.source.outputs.base }}
          branch: ci/fix-proposal-${{ github.run_id }}
          delete-branch: false
          commit-message: "ci: fix proposal requiring human review"
          title: "ci: fix proposal (needs human review)"
          body-path: /tmp/fix-proposal-report.md
          labels: needs-human-review
          draft: true
      - name: Stop after compliance-sensitive proposal
        if: steps.guard.outputs.has_changes == 'true' && steps.guard.outputs.needs_human == 'true'
        run: |
          echo "Compliance-sensitive files were touched and labeled needs-human-review."
          exit 1
      - name: No-op when no diff produced
        if: steps.guard.outputs.has_changes != 'true'
        run: echo "No code diff produced by remediation attempt; no draft PR opened."
