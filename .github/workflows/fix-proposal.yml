name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for manual fix proposal run"
        required: false
  workflow_run:
    workflows: ["verify"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  propose-fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.name }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --immutable
              ;;
            npm)
              npm ci
              ;;
            *)
              echo "Unsupported package manager: ${{ steps.pm.outputs.name }}"
              exit 1
              ;;
          esac
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Capture failing-before baseline
        run: |
          set +e
          mkdir -p .github/fix-proposal
          : > .github/fix-proposal/before.status
          run_and_capture() {
            label="$1"
            shift
            "$@"
            code=$?
            echo "${label}=${code}" >> .github/fix-proposal/before.status
          }
          run_and_capture "cargo_clippy" cargo clippy --workspace --all-targets -- -D warnings
          run_and_capture "cargo_test" cargo test --workspace
          run_and_capture "cargo_audit" cargo audit
          case "${{ steps.pm.outputs.name }}" in
            pnpm) run_and_capture "web_typecheck" pnpm run typecheck ;;
            yarn) run_and_capture "web_typecheck" yarn run typecheck ;;
            npm) run_and_capture "web_typecheck" npm run typecheck ;;
          esac
          set -e
      - name: Attempt fix with configured agent command
        continue-on-error: true
        env:
          CI_FIX_AGENT_COMMAND: ${{ secrets.CI_FIX_AGENT_COMMAND }}
        run: |
          if [ -z "${CI_FIX_AGENT_COMMAND}" ]; then
            echo "CI_FIX_AGENT_COMMAND is not configured; skipping non-deterministic fix attempt."
            exit 0
          fi
          bash -lc "${CI_FIX_AGENT_COMMAND}"
      - name: Capture passing-after baseline
        run: |
          set +e
          mkdir -p .github/fix-proposal
          : > .github/fix-proposal/after.status
          run_and_capture() {
            label="$1"
            shift
            "$@"
            code=$?
            echo "${label}=${code}" >> .github/fix-proposal/after.status
          }
          run_and_capture "cargo_clippy" cargo clippy --workspace --all-targets -- -D warnings
          run_and_capture "cargo_test" cargo test --workspace
          run_and_capture "cargo_audit" cargo audit
          case "${{ steps.pm.outputs.name }}" in
            pnpm) run_and_capture "web_typecheck" pnpm run typecheck ;;
            yarn) run_and_capture "web_typecheck" yarn run typecheck ;;
            npm) run_and_capture "web_typecheck" npm run typecheck ;;
          esac
          set -e
      - name: Write proposal evidence
        run: |
          mkdir -p .github/fix-proposal
          {
            echo "# CI fix proposal evidence"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Branch: \`${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}\`"
            echo "- Source run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "## Failing-before evidence"
            echo
            echo "| Check | Exit code |"
            echo "| ----- | --------- |"
            while IFS='=' read -r check code; do
              echo "| \`${check}\` | \`${code}\` |"
            done < .github/fix-proposal/before.status
            echo
            echo "## Passing-after evidence"
            echo
            echo "| Check | Exit code |"
            echo "| ----- | --------- |"
            while IFS='=' read -r check code; do
              echo "| \`${check}\` | \`${code}\` |"
            done < .github/fix-proposal/after.status
            echo
            echo "## Guardrails"
            echo
            echo "- Draft PR only; no auto-merge."
            echo "- If security/audit/crypto/RBAC paths were touched, label \`needs-human-review\` is applied and the workflow stops."
          } > .github/fix-proposal/evidence.md
      - name: Detect sensitive paths
        id: sensitive
        run: |
          if git diff --name-only | rg -i '(^|/)(security|audit|crypto|rbac)(/|[._-])' >/dev/null; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open draft fix proposal PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/fix-proposal-${{ github.run_id }}
          delete-branch: true
          commit-message: "ci: draft fix proposal from failing verify"
          title: "ci: draft fix proposal for failing verify on main"
          body: |
            ## Summary
            This draft PR was created by the Tier 3 fix-proposal workflow.

            ## Evidence
            - Failing-before and passing-after checks are documented in `.github/fix-proposal/evidence.md`.
            - The source workflow run is: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## Policy guardrails
            - Draft only (never auto-merged).
            - If sensitive code paths are touched (`security`, `audit`, `crypto`, `rbac`), the PR is labeled `needs-human-review` and the workflow stops for manual review.
          draft: true
          labels: |
            ci-fix-proposal
      - name: Add sensitive label
        if: steps.sensitive.outputs.sensitive == 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              labels: ["needs-human-review"],
            });
      - name: Stop after sensitive-path detection
        if: steps.sensitive.outputs.sensitive == 'true'
        run: |
          echo "Sensitive code paths changed. Human review required before any merge."
          exit 1
