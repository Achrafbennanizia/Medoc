name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      failure_context:
        description: "Short context for the failing verify signal"
        required: false
        type: string
      fix_command:
        description: "Optional override command for the agent fix attempt"
        required: false
        type: string
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  propose-fix:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
      FAILURE_CONTEXT: "${{ github.event.inputs.failure_context || github.event.workflow_run.html_url || 'verify failure on main' }}"
      FIX_COMMAND_INPUT: ${{ github.event.inputs.fix_command }}
      FIX_COMMAND_DEFAULT: ${{ vars.MEDOC_FIX_PROPOSAL_COMMAND }}
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}
      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true

      - id: before_tests
        name: Baseline rust tests (before fix)
        continue-on-error: true
        run: cargo test --workspace
      - id: before_audit
        name: Baseline cargo audit (before fix)
        continue-on-error: true
        run: cargo audit
      - id: before_typecheck
        name: Baseline JS typecheck (before fix)
        continue-on-error: true
        run: ${{ steps.pm.outputs.run }} typecheck

      - id: fix_attempt
        name: Agent fix attempt
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cmd="${FIX_COMMAND_INPUT:-}"
          if [[ -z "$cmd" ]]; then
            cmd="${FIX_COMMAND_DEFAULT:-}"
          fi
          if [[ -z "$cmd" ]]; then
            echo "No MEDOC_FIX_PROPOSAL_COMMAND configured; no automated fix command to run."
            exit 0
          fi
          echo "Running fix command: $cmd"
          bash -lc "$cmd"

      - id: after_tests
        name: Post-fix rust tests
        continue-on-error: true
        run: cargo test --workspace
      - id: after_audit
        name: Post-fix cargo audit
        continue-on-error: true
        run: cargo audit
      - id: after_typecheck
        name: Post-fix JS typecheck
        continue-on-error: true
        run: ${{ steps.pm.outputs.run }} typecheck

      - id: has_changes
        name: Detect branch diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - id: sensitive
        if: steps.has_changes.outputs.changed == 'true'
        name: Mark sensitive scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > changed-files.txt
          if grep -E -i "(security|audit|crypto|rbac)" changed-files.txt; then
            echo "needs_human_review=true" >> "$GITHUB_OUTPUT"
            echo "labels=needs-human-review" >> "$GITHUB_OUTPUT"
          else
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
            echo "labels=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write fix proposal report
        if: steps.has_changes.outputs.changed == 'true'
        shell: bash
        run: |
          cat > .github/fix-proposal-report.md <<EOF
          ## Tier 3 fix proposal (draft)

          **Failure context**
          - ${FAILURE_CONTEXT}

          **Evidence (before fix attempt)**
          - rust tests: ${{ steps.before_tests.outcome }}
          - cargo audit: ${{ steps.before_audit.outcome }}
          - JS typecheck: ${{ steps.before_typecheck.outcome }}

          **Fix command**
          - \`${FIX_COMMAND_INPUT:-${FIX_COMMAND_DEFAULT:-none configured}}\`
          - step outcome: ${{ steps.fix_attempt.outcome }}

          **Evidence (after fix attempt)**
          - rust tests: ${{ steps.after_tests.outcome }}
          - cargo audit: ${{ steps.after_audit.outcome }}
          - JS typecheck: ${{ steps.after_typecheck.outcome }}

          **Sensitive scope guard**
          - needs-human-review: ${{ steps.sensitive.outputs.needs_human_review || 'false' }}

          This pull request remains **draft** and requires human review/merge.
          EOF

      - name: Open draft pull request for review
        id: cpr
        if: steps.has_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "ci: tier-3 fix proposal from verify failure"
          branch: ci/fix-proposal-${{ github.run_id }}
          delete-branch: true
          title: "ci: draft fix proposal for verify failure"
          body-path: .github/fix-proposal-report.md
          draft: true
          labels: ${{ steps.sensitive.outputs.labels }}

      - name: Stop when no fix diff is produced
        if: steps.has_changes.outputs.changed != 'true'
        shell: bash
        run: |
          echo "No code changes were produced by the fix attempt. No draft PR was created."
          exit 1
