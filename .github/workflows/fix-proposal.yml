name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or ref to propose fixes against
        required: false
        default: main
      failing_run_url:
        description: Optional URL to the failing run that prompted this proposal
        required: false
        default: ""
      fix_agent_command:
        description: Optional command that performs the fix attempt on the proposal branch
        required: false
        default: ""
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fix-proposal-${{ github.event_name }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  propose-fix:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: context
        name: Resolve trigger context
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "base_ref=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "failing_run_url=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=${{ inputs.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ inputs.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "failing_run_url=${{ inputs.failing_run_url }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.base_sha }}
      - id: proposal_branch
        name: Create fix-proposal branch
        run: |
          BRANCH="ci/fix-proposal-${{ github.run_id }}-${GITHUB_SHA::7}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - name: Enable Corepack for pnpm/yarn
        if: steps.pm.outputs.pm != 'npm'
        run: corepack enable
      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            npm) npm ci ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - id: fix
        name: Attempt agent fix command
        env:
          INPUT_FIX_AGENT_COMMAND: ${{ github.event.inputs.fix_agent_command }}
          CI_FIX_AGENT_COMMAND: ${{ vars.CI_FIX_AGENT_COMMAND }}
        run: |
          set -euo pipefail
          COMMAND="${INPUT_FIX_AGENT_COMMAND:-${CI_FIX_AGENT_COMMAND:-}}"
          if [ -z "$COMMAND" ]; then
            echo "command_used=NOT_CONFIGURED" >> "$GITHUB_OUTPUT"
            echo "No fix command configured via workflow input or CI_FIX_AGENT_COMMAND variable."
            exit 0
          fi
          echo "command_used=$COMMAND" >> "$GITHUB_OUTPUT"
          bash -lc "$COMMAND"
      - id: changes
        name: Detect branch changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - id: evidence
        if: steps.changes.outputs.has_changes == 'true'
        name: Collect failing-before and passing-after evidence
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          mkdir -p .github/fix-proposal-logs

          run_check() {
            local check_name="$1"
            local command="$2"
            local log_file="$3"
            set +e
            bash -lc "$command" > "$log_file" 2>&1
            local rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "| ${check_name} | \`${command}\` | **PASS** |" >> .github/fix-proposal-evidence.md
            else
              echo "| ${check_name} | \`${command}\` | **FAIL** |" >> .github/fix-proposal-evidence.md
              ALL_PASSED=0
            fi
          }

          case "$PM" in
            pnpm)
              LINT_CMD="pnpm run lint"
              TEST_CMD="pnpm run test"
              BUILD_CMD="pnpm run build"
              TYPECHECK_CMD="npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json && npx tsc --noEmit -p apps/lan-web-client/tsconfig.json"
              ;;
            yarn)
              LINT_CMD="yarn run lint"
              TEST_CMD="yarn run test"
              BUILD_CMD="yarn run build"
              TYPECHECK_CMD="npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json && npx tsc --noEmit -p apps/lan-web-client/tsconfig.json"
              ;;
            npm)
              LINT_CMD="npm run lint"
              TEST_CMD="npm run test"
              BUILD_CMD="npm run build"
              TYPECHECK_CMD="npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json && npx tsc --noEmit -p apps/lan-web-client/tsconfig.json"
              ;;
          esac

          FAILING_BEFORE="${{ steps.context.outputs.failing_run_url }}"
          if [ -z "$FAILING_BEFORE" ]; then
            FAILING_BEFORE="NOT PROVIDED"
          fi

          {
            echo "## Evidence"
            echo ""
            echo "- Failing before: ${FAILING_BEFORE}"
            echo "- Base ref: \`${{ steps.context.outputs.base_ref }}\`"
            echo "- Base SHA: \`${{ steps.context.outputs.base_sha }}\`"
            echo "- Fix command: \`${{ steps.fix.outputs.command_used }}\`"
            echo ""
            echo "### Passing-after verification"
            echo ""
            echo "| Check | Command | Result |"
            echo "|---|---|---|"
          } > .github/fix-proposal-evidence.md

          ALL_PASSED=1
          run_check "Rust format check" "cargo fmt --all --check" ".github/fix-proposal-logs/cargo-fmt.log"
          run_check "Rust clippy" "cargo clippy --workspace --all-targets -- -D warnings" ".github/fix-proposal-logs/cargo-clippy.log"
          run_check "Rust tests" "cargo test --workspace --tests" ".github/fix-proposal-logs/cargo-test.log"
          run_check "Rust audit" "cargo install cargo-audit --locked && cargo audit" ".github/fix-proposal-logs/cargo-audit.log"
          run_check "JS lint" "$LINT_CMD" ".github/fix-proposal-logs/js-lint.log"
          run_check "JS typecheck" "$TYPECHECK_CMD" ".github/fix-proposal-logs/js-typecheck.log"
          run_check "JS tests" "$TEST_CMD" ".github/fix-proposal-logs/js-test.log"
          run_check "JS build" "$BUILD_CMD" ".github/fix-proposal-logs/js-build.log"

          if [ "$ALL_PASSED" -eq 1 ]; then
            echo "all_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_passed=false" >> "$GITHUB_OUTPUT"
          fi
      - id: sensitive
        if: steps.changes.outputs.has_changes == 'true'
        name: Flag sensitive-path edits
        run: |
          if git diff --name-only | rg -q -n '(?i)(^|/)(security|crypto|audit|rbac)(/|$)|(^|/)[^/]*(security|crypto|audit|rbac)[^/]*\.'; then
            echo "needs_human_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build draft PR body
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          {
            echo "## Tier 3 fix proposal"
            echo ""
            echo "This draft PR was generated by \`fix-proposal.yml\` on a new branch."
            echo "It does not auto-merge."
            echo ""
            if [ "${{ steps.sensitive.outputs.needs_human_review }}" = "true" ]; then
              echo "> ⚠️ Sensitive paths touched (security/audit/crypto/RBAC). Added \`needs-human-review\` label."
              echo ""
            fi
            cat .github/fix-proposal-evidence.md
          } > fix-proposal-pr-body.md
      - id: pr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.proposal_branch.outputs.name }}
          base: ${{ steps.context.outputs.base_ref }}
          commit-message: "ci: draft fix proposal for verify failure"
          title: "ci: draft fix proposal for verify failure"
          body-path: fix-proposal-pr-body.md
          draft: true
          delete-branch: false
      - name: Add needs-human-review label
        if: steps.changes.outputs.has_changes == 'true' && steps.sensitive.outputs.needs_human_review == 'true' && steps.pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const label = "needs-human-review";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "B60205",
                  description: "Touches security, audit, crypto, or RBAC paths."
                });
              } else {
                throw error;
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
      - name: No-op when no diff was produced
        if: steps.changes.outputs.has_changes != 'true'
        run: echo "No file changes were produced by the fix command; no draft PR opened."
