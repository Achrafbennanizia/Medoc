name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch to propose against"
        required: false
        default: "main"
        type: string
      verify_command:
        description: "Verification command to capture failing-before / passing-after evidence"
        required: false
        default: "cargo test --workspace && cargo audit && npm run lint && npm run typecheck && npm run test && npm run build"
        type: string
      fix_command:
        description: "Agent fix command (runs on a new branch)"
        required: false
        default: ""
        type: string
      rationale:
        description: "Why this fix proposal is being attempted"
        required: false
        default: "Manual tier-3 fix proposal request."
        type: string
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  propose:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.base_ref }}
      BASE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.base_ref }}
      VERIFY_COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_command || 'cargo test --workspace && cargo audit && npm run lint && npm run typecheck && npm run test && npm run build' }}
      FIX_COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.fix_command || vars.CI_FIX_PROPOSAL_COMMAND }}
      RATIONALE: ${{ github.event_name == 'workflow_dispatch' && inputs.rationale || 'Automatically triggered because verify failed on main.' }}
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - name: Install cargo-audit (best effort)
        run: cargo install cargo-audit --locked || true
      - name: Install dependencies
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          corepack enable
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: $PM" && exit 1 ;;
          esac
      - id: branch
        name: Create proposal branch
        shell: bash
        run: |
          BRANCH="ci/fix-proposal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - id: before
        name: Capture failing-before evidence
        shell: bash
        run: |
          set +e
          bash -lc "$VERIFY_COMMAND" > before.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - id: fix
        name: Run fix agent command
        shell: bash
        run: |
          set +e
          if [ -z "$FIX_COMMAND" ]; then
            echo "::error::No fix command provided. Set workflow_dispatch input fix_command or repository variable CI_FIX_PROPOSAL_COMMAND."
            exit 1
          fi
          bash -lc "$FIX_COMMAND" > fix.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - id: after
        name: Capture passing-after evidence
        shell: bash
        run: |
          set +e
          bash -lc "$VERIFY_COMMAND" > after.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - id: restricted
        name: Flag sensitive code touchpoints
        shell: bash
        run: |
          if git diff --name-only | rg -i "(security|audit|crypto|rbac)"; then
            echo "needs_human_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
          fi
      - id: changes
        name: Check whether fix produced a diff
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build draft PR body
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          {
            echo "## Tier 3 fix proposal"
            echo
            echo "- Base branch: \`$BASE_BRANCH\`"
            echo "- Base ref: \`$BASE_REF\`"
            echo "- Rationale: $RATIONALE"
            echo "- Before verify exit code: \`${{ steps.before.outputs.status }}\`"
            echo "- Fix command exit code: \`${{ steps.fix.outputs.status }}\`"
            echo "- After verify exit code: \`${{ steps.after.outputs.status }}\`"
            echo
            echo "### Failing-before evidence"
            echo '```text'
            tail -n 200 before.log || true
            echo '```'
            echo
            echo "### Fix command output"
            echo '```text'
            tail -n 200 fix.log || true
            echo '```'
            echo
            echo "### Passing-after evidence"
            echo '```text'
            tail -n 200 after.log || true
            echo '```'
            echo
            echo "### Guardrails"
            echo "- Auto-merge is disabled; this PR stays draft for human review."
            echo "- If security/audit/crypto/RBAC paths are touched, \`needs-human-review\` is applied and this workflow exits non-zero."
          } > pr-body.md
      - id: cpr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.branch.outputs.name }}
          base: ${{ env.BASE_BRANCH }}
          draft: true
          commit-message: "ci: tier-3 fix proposal"
          title: "ci: tier-3 fix proposal (${{ github.run_id }})"
          body-path: pr-body.md
          labels: |
            ci-fix-proposal
      - name: Label restricted change set
        if: steps.cpr.outputs.pull-request-number != '' && steps.restricted.outputs.needs_human_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              labels: ["needs-human-review"]
            });
      - name: Stop when restricted code changed
        if: steps.restricted.outputs.needs_human_review == 'true'
        shell: bash
        run: |
          echo "::error::Sensitive code paths were modified; human review is required."
          exit 1
      - name: Fail when no fix diff was produced
        if: steps.changes.outputs.has_changes != 'true'
        shell: bash
        run: |
          echo "::error::No code diff was produced by the fix command; no proposal PR opened."
          exit 1
