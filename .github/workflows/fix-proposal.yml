name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      failure_reason:
        description: "Optional context for the failing check"
        required: false
        type: string
      proposal_command:
        description: "Optional command to attempt a substantive fix"
        required: false
        type: string
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  propose-fix:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - id: context
        name: Resolve run context
        env:
          INPUT_FAILURE_REASON: ${{ github.event.inputs.failure_reason }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            reason="verify workflow failed on main"
            source_run="https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
            checkout_ref="${{ github.event.workflow_run.head_sha }}"
          else
            reason="${INPUT_FAILURE_REASON:-manual fix proposal request}"
            source_run="manual workflow_dispatch"
            checkout_ref="${{ github.sha }}"
          fi

          {
            echo "checkout_ref=${checkout_ref}"
            echo "branch_name=ci/fix-proposal-${{ github.run_id }}"
            echo "source_run=${source_run}"
            echo "failure_reason<<EOF"
            echo "${reason}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - id: pm
        name: Detect package manager and proposal commands
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "cache_path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "typecheck=pnpm --filter medoc run typecheck" >> "$GITHUB_OUTPUT"
            echo "lint_fix=pnpm --filter medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format=pnpm --filter medoc run format" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "cache_path=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "typecheck=yarn workspace medoc run typecheck" >> "$GITHUB_OUTPUT"
            echo "lint_fix=yarn workspace medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format=yarn workspace medoc run format" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "cache_path=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "typecheck=npm run typecheck -w medoc" >> "$GITHUB_OUTPUT"
            echo "lint_fix=npm run lint:fix -w medoc" >> "$GITHUB_OUTPUT"
            echo "format=npm run format -w medoc" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.cache_path }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - id: before
        name: Capture failing-before evidence
        run: |
          set +e

          cargo test --workspace > before-cargo-test.log 2>&1
          cargo_test_exit=$?

          cargo audit > before-cargo-audit.log 2>&1
          cargo_audit_exit=$?

          eval "${{ steps.pm.outputs.typecheck }}" > before-typecheck.log 2>&1
          typecheck_exit=$?

          set -e
          {
            echo "cargo_test=${cargo_test_exit}"
            echo "cargo_audit=${cargo_audit_exit}"
            echo "typecheck=${typecheck_exit}"
          } >> "$GITHUB_OUTPUT"

      - id: fixcmd
        name: Resolve proposal command
        env:
          INPUT_PROPOSAL_COMMAND: ${{ github.event.inputs.proposal_command }}
          CONFIGURED_PROPOSAL_COMMAND: ${{ vars.CI_FIX_PROPOSAL_COMMAND }}
        run: |
          cmd="${INPUT_PROPOSAL_COMMAND:-$CONFIGURED_PROPOSAL_COMMAND}"
          if [ -z "${cmd}" ]; then
            cmd="cargo fmt --all && ${{ steps.pm.outputs.lint_fix }} && ${{ steps.pm.outputs.format }}"
          fi

          {
            echo "command<<EOF"
            echo "${cmd}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attempt substantive fix proposal
        run: |
          set -euo pipefail
          eval "${{ steps.fixcmd.outputs.command }}"

      - id: after
        name: Capture passing-after evidence
        run: |
          set +e

          cargo test --workspace > after-cargo-test.log 2>&1
          cargo_test_exit=$?

          cargo audit > after-cargo-audit.log 2>&1
          cargo_audit_exit=$?

          eval "${{ steps.pm.outputs.typecheck }}" > after-typecheck.log 2>&1
          typecheck_exit=$?

          set -e
          {
            echo "cargo_test=${cargo_test_exit}"
            echo "cargo_audit=${cargo_audit_exit}"
            echo "typecheck=${typecheck_exit}"
          } >> "$GITHUB_OUTPUT"

      - id: changed
        name: Detect changed files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - id: sensitive
        name: Detect sensitive-path edits
        run: |
          if [ "${{ steps.changed.outputs.has_changes }}" != "true" ]; then
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git status --porcelain | awk '{print $2}')"
          if printf "%s\n" "${changed_files}" | rg -q '(^config/rbac\.yaml$|(^|/)(security|audit|crypto|rbac)(/|_|\.))'; then
            echo "needs_human_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_human_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write proposal evidence summary
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          cat > fix-proposal-evidence.md <<EOF
          # CI fix proposal evidence

          - Source: ${{ steps.context.outputs.source_run }}
          - Failure reason: ${{ steps.context.outputs.failure_reason }}
          - Attempt command: \`${{ steps.fixcmd.outputs.command }}\`

          ## Failing-before

          - cargo test --workspace: exit ${{ steps.before.outputs.cargo_test }}
          - cargo audit: exit ${{ steps.before.outputs.cargo_audit }}
          - web typecheck: exit ${{ steps.before.outputs.typecheck }}

          ## Passing-after

          - cargo test --workspace: exit ${{ steps.after.outputs.cargo_test }}
          - cargo audit: exit ${{ steps.after.outputs.cargo_audit }}
          - web typecheck: exit ${{ steps.after.outputs.typecheck }}
          EOF

      - name: Upload proposal logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-proposal-evidence-${{ github.run_id }}
          path: |
            before-cargo-test.log
            before-cargo-audit.log
            before-typecheck.log
            after-cargo-test.log
            after-cargo-audit.log
            after-typecheck.log
            fix-proposal-evidence.md

      - name: Open draft PR (standard paths)
        if: steps.changed.outputs.has_changes == 'true' && steps.sensitive.outputs.needs_human_review != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.context.outputs.branch_name }}
          base: main
          commit-message: "ci: automated fix proposal"
          title: "ci: fix proposal for verify failure on main"
          draft: true
          labels: |
            ci-fix-proposal
          body: |
            ## CI fix proposal

            This draft PR was created by tier-3 fix-proposal automation.

            - Source: `${{ steps.context.outputs.source_run }}`
            - Failure reason: `${{ steps.context.outputs.failure_reason }}`
            - Attempt command: `${{ steps.fixcmd.outputs.command }}`

            ### Failing-before
            - `cargo test --workspace` exit code: `${{ steps.before.outputs.cargo_test }}`
            - `cargo audit` exit code: `${{ steps.before.outputs.cargo_audit }}`
            - web typecheck exit code: `${{ steps.before.outputs.typecheck }}`

            ### Passing-after
            - `cargo test --workspace` exit code: `${{ steps.after.outputs.cargo_test }}`
            - `cargo audit` exit code: `${{ steps.after.outputs.cargo_audit }}`
            - web typecheck exit code: `${{ steps.after.outputs.typecheck }}`

            Detailed logs are attached as workflow artifacts.

      - name: Open draft PR (sensitive paths)
        if: steps.changed.outputs.has_changes == 'true' && steps.sensitive.outputs.needs_human_review == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.context.outputs.branch_name }}
          base: main
          commit-message: "ci: automated fix proposal (sensitive paths)"
          title: "ci: fix proposal for verify failure on main"
          draft: true
          labels: |
            ci-fix-proposal
            needs-human-review
          body: |
            ## CI fix proposal (sensitive paths touched)

            This draft PR requires explicit human review because the automation touched security/audit/crypto/RBAC paths.

            - Source: `${{ steps.context.outputs.source_run }}`
            - Failure reason: `${{ steps.context.outputs.failure_reason }}`
            - Attempt command: `${{ steps.fixcmd.outputs.command }}`

            ### Failing-before
            - `cargo test --workspace` exit code: `${{ steps.before.outputs.cargo_test }}`
            - `cargo audit` exit code: `${{ steps.before.outputs.cargo_audit }}`
            - web typecheck exit code: `${{ steps.before.outputs.typecheck }}`

            ### Passing-after
            - `cargo test --workspace` exit code: `${{ steps.after.outputs.cargo_test }}`
            - `cargo audit` exit code: `${{ steps.after.outputs.cargo_audit }}`
            - web typecheck exit code: `${{ steps.after.outputs.typecheck }}`

            Detailed logs are attached as workflow artifacts.

      - name: Stop after labeling sensitive proposal
        if: steps.changed.outputs.has_changes == 'true' && steps.sensitive.outputs.needs_human_review == 'true'
        run: |
          echo "Sensitive paths were changed. Draft PR labeled needs-human-review."
          exit 1

      - name: Fail when no proposal changes were produced
        if: steps.changed.outputs.has_changes != 'true'
        run: |
          echo "No fix proposal changes were produced. Configure CI_FIX_PROPOSAL_COMMAND or provide proposal_command input."
          exit 1
