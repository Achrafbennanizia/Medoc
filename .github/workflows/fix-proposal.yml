name: fix-proposal

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch or ref to repair"
        required: false
        default: "main"
      reason:
        description: "Optional failure context"
        required: false
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-proposal-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  propose-fix:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - name: Prepare branch metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "checkout_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "reason=verify workflow run ${{ github.event.workflow_run.id }} failed on main" >> "$GITHUB_OUTPUT"
          else
            BASE_REF="${{ github.event.inputs.base_ref }}"
            if [ -z "$BASE_REF" ]; then
              BASE_REF="main"
            fi
            REASON="${{ github.event.inputs.reason }}"
            if [ -z "$REASON" ]; then
              REASON="manual dispatch"
            fi
            echo "checkout_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
            echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          fi
          echo "proposal_branch=ci/fix-proposal-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.checkout_ref }}
      - name: Create proposal branch
        run: git switch -c "${{ steps.meta.outputs.proposal_branch }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "web_typecheck=pnpm --filter medoc run typecheck" >> "$GITHUB_OUTPUT"
            echo "web_test=pnpm --filter medoc run test" >> "$GITHUB_OUTPUT"
            echo "web_lint_fix=pnpm --filter medoc run lint:fix" >> "$GITHUB_OUTPUT"
            echo "web_format=pnpm --filter medoc run format" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "web_typecheck=yarn workspace medoc typecheck" >> "$GITHUB_OUTPUT"
            echo "web_test=yarn workspace medoc test" >> "$GITHUB_OUTPUT"
            echo "web_lint_fix=yarn workspace medoc lint:fix" >> "$GITHUB_OUTPUT"
            echo "web_format=yarn workspace medoc format" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "web_typecheck=npm run typecheck -w medoc" >> "$GITHUB_OUTPUT"
            echo "web_test=npm run test -w medoc" >> "$GITHUB_OUTPUT"
            echo "web_lint_fix=npm run lint:fix -w medoc" >> "$GITHUB_OUTPUT"
            echo "web_format=npm run format -w medoc" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager"; exit 1 ;;
          esac
      - name: Initialize evidence report
        run: |
          EVIDENCE_PATH="$RUNNER_TEMP/fix-proposal-evidence.md"
          echo "EVIDENCE_PATH=$EVIDENCE_PATH" >> "$GITHUB_ENV"
          {
            echo "# Automated fix proposal"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Base ref: \`${{ steps.meta.outputs.base_ref }}\`"
            echo "- Reason: ${{ steps.meta.outputs.reason }}"
            echo ""
            echo "## Failing-before snapshot"
            echo ""
            echo "| Check | Command | Exit code |"
            echo "| ----- | ------- | --------- |"
          } > "$EVIDENCE_PATH"
      - name: Capture failing-before status
        run: |
          run_check() {
            local check_name="$1"
            local command="$2"
            set +e
            bash -lc "$command" > "$RUNNER_TEMP/${check_name}.before.log" 2>&1
            local status=$?
            set -e
            printf '| %s | `%s` | %s |\n' "$check_name" "$command" "$status" >> "$EVIDENCE_PATH"
          }

          run_check "cargo-test" "cargo test --workspace"
          run_check "cargo-audit" "cargo audit"
          run_check "web-typecheck" "${{ steps.pm.outputs.web_typecheck }}"
          run_check "web-test" "${{ steps.pm.outputs.web_test }}"
      - name: Attempt automated proposal fixes
        run: |
          cargo fix --workspace --allow-dirty --allow-staged || true
          cargo fmt --all || true
          bash -lc "${{ steps.pm.outputs.web_lint_fix }}" || true
          bash -lc "${{ steps.pm.outputs.web_format }}" || true

          if [ "${{ steps.pm.outputs.pm }}" = "npm" ]; then
            npm audit fix || true
          fi
      - name: Capture passing-after status
        run: |
          {
            echo ""
            echo "## Passing-after snapshot"
            echo ""
            echo "| Check | Command | Exit code |"
            echo "| ----- | ------- | --------- |"
          } >> "$EVIDENCE_PATH"

          run_check() {
            local check_name="$1"
            local command="$2"
            set +e
            bash -lc "$command" > "$RUNNER_TEMP/${check_name}.after.log" 2>&1
            local status=$?
            set -e
            printf '| %s | `%s` | %s |\n' "$check_name" "$command" "$status" >> "$EVIDENCE_PATH"
          }

          run_check "cargo-test" "cargo test --workspace"
          run_check "cargo-audit" "cargo audit"
          run_check "web-typecheck" "${{ steps.pm.outputs.web_typecheck }}"
          run_check "web-test" "${{ steps.pm.outputs.web_test }}"
      - id: changes
        name: Detect proposal diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - id: sensitivity
        if: steps.changes.outputs.has_changes == 'true'
        name: Classify sensitive-path changes
        run: |
          if git diff --name-only | rg -i '(^|/)(security|audit|crypto|rbac)(/|_|\\.|$)' >/dev/null; then
            echo "labels=needs-human-review" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "## Review guardrails"
              echo ""
              echo "Sensitive paths were touched (`security|audit|crypto|rbac`)."
              echo "Label \`needs-human-review\` is applied and this proposal remains draft-only."
            } >> "$EVIDENCE_PATH"
          else
            echo "labels=" >> "$GITHUB_OUTPUT"
          fi
      - name: Append rationale
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          {
            echo ""
            echo "## Rationale"
            echo ""
            echo "- Automated proposal branch from failed verification context."
            echo "- Applied non-deterministic proposal attempts (`cargo fix`, dependency advisory fix, lint/format fixers)."
            echo "- Draft PR only; no auto-merge."
          } >> "$EVIDENCE_PATH"
      - name: Open draft pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.meta.outputs.proposal_branch }}
          base: ${{ steps.meta.outputs.base_ref }}
          title: "ci: draft fix proposal from failing verify run"
          commit-message: "ci: propose automated remediation for failing verify"
          body-path: ${{ env.EVIDENCE_PATH }}
          labels: ${{ steps.sensitivity.outputs.labels }}
          draft: true
      - name: No proposal generated
        if: steps.changes.outputs.has_changes != 'true'
        run: echo "No code diff produced by automated proposal attempt."
