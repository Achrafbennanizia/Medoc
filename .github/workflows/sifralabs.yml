name: Sifra Labs site

on:
  push:
    branches: [main]
    paths:
      - "sifralabs/**"
      # MeDoc Dentist ships inside this site at /products/medoc-dentist/.
      - "website/**"
      - "package-lock.json"
      - ".github/workflows/sifralabs.yml"
  pull_request:
    paths:
      - "sifralabs/**"
      # MeDoc Dentist ships inside this site at /products/medoc-dentist/.
      - "website/**"
      - "package-lock.json"
      - ".github/workflows/sifralabs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sifralabs-pr-{0}', github.ref) || 'sifralabs' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sifralabs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sifralabs/package-lock.json
      - run: npm ci
      - name: Build
        env:
          TURNSTILE_SITE_KEY: 0x4AAAAAAGWRuo3Zp4ZVJq6h
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAGWRuo3Zp4ZVJq6h
        run: npm run build:all

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sifralabs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sifralabs/package-lock.json
      - run: npm ci
      - name: Build
        env:
          TURNSTILE_SITE_KEY: 0x4AAAAAAGWRuo3Zp4ZVJq6h
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAGWRuo3Zp4ZVJq6h
        run: npm run build:all
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sifralabs
          # Worker name must match wrangler.jsonc ("sifralabs-site") and the CF project.
          command: deploy
