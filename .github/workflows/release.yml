name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      security-events: read

  build:
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4

      - id: js
        name: Detect JavaScript package manager and release commands
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f pnpm-lock.yaml ]]; then
            pm="pnpm"
            install_cmd="pnpm install --frozen-lockfile"
            tauri_build_cmd="pnpm --filter medoc run tauri build"
          elif [[ -f yarn.lock ]]; then
            pm="yarn"
            install_cmd="yarn install --frozen-lockfile"
            tauri_build_cmd="yarn workspace medoc tauri build"
          else
            pm="npm"
            install_cmd="npm ci"
            tauri_build_cmd="npm run tauri build -w medoc"
          fi

          {
            echo "pm=$pm"
            echo "install_cmd<<EOF"
            echo "$install_cmd"
            echo "EOF"
            echo "tauri_build_cmd<<EOF"
            echo "$tauri_build_cmd"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.js.outputs.pm }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.js.outputs.install_cmd }}

      - name: Verify tagged commit before build
        run: cargo test --workspace

      - name: Build signed release bundle (no source mutation)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ${{ steps.js.outputs.tauri_build_cmd }}

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: |
            apps/practice-host/target/release/bundle/**
            target/release/bundle/**

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            apps/practice-host/target/release/bundle/**
            target/release/bundle/**
