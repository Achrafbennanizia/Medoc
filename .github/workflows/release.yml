name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gate:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  build:
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect JavaScript package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1

      - name: Verify workspace tests
        run: cargo test --workspace

      - name: Build signed bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ${{ steps.pm.outputs.pm }} run tauri -- build

      - uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: apps/practice-host/target/release/bundle/**/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/practice-host/target/release/bundle/**/*
