name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  build:
    name: build-signed-${{ matrix.os }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    environment: release
    timeout-minutes: 75
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
      MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}
      MEDOC_UPDATER_GITHUB_TOKEN: ${{ secrets.MEDOC_UPDATER_GITHUB_PAT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager"; exit 1 ;;
          esac

      - name: Verify Rust tests on tagged commit
        run: cargo test --workspace --tests

      - name: Configure Tauri updater endpoint
        run: node scripts/configure-tauri-updater.mjs

      - name: Build signed Tauri bundle
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc tauri build ;;
            yarn) yarn workspace medoc tauri build ;;
            npm) npm run tauri build -w medoc ;;
            *) echo "Unsupported package manager"; exit 1 ;;
          esac

      - name: Upload signed release bundles
        uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: apps/practice-host/target/release/bundle/**/*
          if-no-files-found: error
