name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32

jobs:
  gate:
    name: Verify tagged commit
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  build:
    name: Signed bundle (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: dmg,app
          - os: windows-latest
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Detect package manager from lockfile
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.cache }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1

      - name: Export OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $dir = Join-Path $root "installed\x64-windows"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $lines = @(
            "OPENSSL_DIR=$dir"
            "OPENSSL_LIB_DIR=$(Join-Path $dir 'lib')"
            "OPENSSL_INCLUDE_DIR=$(Join-Path $dir 'include')"
          )
          $payload = ($lines -join [Environment]::NewLine) + [Environment]::NewLine
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $payload, $utf8NoBom)
          $lines | ForEach-Object { Write-Host $_ }

      - name: Verify Rust tests on release commit
        run: cargo test --workspace

      - name: Build signed artifacts
        env:
          MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}
          MEDOC_UPDATER_GITHUB_TOKEN: ${{ secrets.MEDOC_UPDATER_GITHUB_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm --filter medoc run build
              pnpm --filter medoc run tauri -- build --bundles "${{ matrix.bundles }}"
              ;;
            yarn)
              yarn workspace medoc build
              yarn workspace medoc tauri build --bundles "${{ matrix.bundles }}"
              ;;
            npm)
              npm run build -w medoc
              npm run tauri -w medoc -- build --bundles "${{ matrix.bundles }}"
              ;;
            *)
              echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2
              exit 1
              ;;
          esac

      - name: Upload signed bundles
        uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: apps/practice-host/target/release/bundle/**/*
