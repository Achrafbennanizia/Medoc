name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}

jobs:
  gate:
    uses: ./.github/workflows/verify.yml

  build:
    name: Build signed release bundle (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 60
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}"; exit 1 ;;
          esac
      - name: Verify Rust workspace
        run: cargo test --workspace --tests
      - name: Build signed bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: ${{ steps.pm.outputs.pm }} run tauri build -w medoc
      - name: Ensure source tree was not mutated
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: apps/practice-host/target/release/bundle/**/*
