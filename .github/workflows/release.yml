name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32

jobs:
  gate:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  build:
    name: signed-build (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - name: Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install JS dependencies
        env:
          PM: ${{ steps.pm.outputs.pm }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "::error::Unsupported package manager: $PM"; exit 1 ;;
          esac

      - name: Verify again on release candidate commit
        env:
          PM: ${{ steps.pm.outputs.pm }}
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail

          pm_run_in_dir() {
            local dir="$1"
            local script="$2"
            shift 2
            case "$PM" in
              pnpm) (cd "$dir" && pnpm run "$script" "$@") ;;
              yarn) (cd "$dir" && yarn run "$script" "$@") ;;
              npm) (cd "$dir" && npm run "$script" -- "$@") ;;
              *) echo "::error::Unsupported package manager: $PM"; exit 1 ;;
            esac
          }

          cargo test --workspace
          pm_run_in_dir "apps/practice-host-ui" lint
          pm_run_in_dir "apps/practice-host-ui" typecheck
          pm_run_in_dir "apps/lan-web-client" typecheck
          bash ./scripts/ci-frontend-test.sh
          pm_run_in_dir "apps/practice-host-ui" build
          pm_run_in_dir "apps/lan-web-client" build

      - name: Configure updater endpoint
        env:
          MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}
          MEDOC_UPDATER_GITHUB_TOKEN: ${{ secrets.MEDOC_UPDATER_GITHUB_PAT }}
        run: node scripts/configure-tauri-updater.mjs

      - name: Build signed bundle
        env:
          PM: ${{ steps.pm.outputs.pm }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) (cd apps/practice-host && pnpm run tauri -- build) ;;
            yarn) (cd apps/practice-host && yarn run tauri build) ;;
            npm) (cd apps/practice-host && npm run tauri -- build) ;;
            *) echo "::error::Unsupported package manager: $PM"; exit 1 ;;
          esac

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/practice-host/target/release/bundle/**/*

      - uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: apps/practice-host/target/release/bundle/**/*
