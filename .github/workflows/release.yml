name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "version*"
  # After CI on main succeeds: ship the desktop app (not NSIS/MSI/keygen).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}
  # workflow_run's github.sha is the workflow file on default branch, not the green CI commit.
  MEDOC_CHECKOUT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-app:
    name: App (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tauri_args: --no-bundle
          - os: macos-latest
            tauri_args: --bundles app
          - os: windows-latest
            tauri_args: --no-bundle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEDOC_CHECKOUT_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1
      - run: npm run build -w medoc
      # Run from medoc-tauri-host (apps/practice-host), not -w medoc.
      - name: Tauri app (no OS installer packages)
        run: npm run tauri -w medoc-tauri-host -- build ${{ matrix.tauri_args }}
      - name: Stage app payload (+ replica)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-app
          macos_bundle="apps/practice-host/target/release/bundle/macos"
          if [[ -d "$macos_bundle/MeDoc.app" ]]; then
            cp -R "$macos_bundle/MeDoc.app" dist-app/
            # Compiled replica app (same binary, field-deploy naming).
            rm -rf dist-app/Medoc_replica.app
            ditto dist-app/MeDoc.app dist-app/Medoc_replica.app
            PLIST="dist-app/Medoc_replica.app/Contents/Info.plist"
            for key in CFBundleName CFBundleDisplayName; do
              /usr/libexec/PlistBuddy -c "Set :${key} Medoc_replica" "$PLIST" \
                || /usr/libexec/PlistBuddy -c "Add :${key} string Medoc_replica" "$PLIST"
            done
            codesign --force --deep --sign - dist-app/Medoc_replica.app || true
          elif [[ -d "$macos_bundle" ]]; then
            cp -R "$macos_bundle"/. dist-app/
          elif [[ -f apps/practice-host/target/release/medoc.exe ]]; then
            cp apps/practice-host/target/release/medoc.exe dist-app/medoc.exe
            cp dist-app/medoc.exe dist-app/medoc-replica.exe
          elif [[ -f target/release/medoc.exe ]]; then
            cp target/release/medoc.exe dist-app/medoc.exe
            cp dist-app/medoc.exe dist-app/medoc-replica.exe
          elif [[ -f apps/practice-host/target/release/medoc ]]; then
            cp apps/practice-host/target/release/medoc dist-app/medoc
            cp dist-app/medoc dist-app/medoc-replica
            chmod +x dist-app/medoc dist-app/medoc-replica
          elif [[ -f target/release/medoc ]]; then
            cp target/release/medoc dist-app/medoc
            cp dist-app/medoc dist-app/medoc-replica
            chmod +x dist-app/medoc dist-app/medoc-replica
          else
            echo "No MeDoc app binary found under target/release" >&2
            find apps/practice-host/target/release -maxdepth 3 -type f 2>/dev/null | head -50 || true
            find target/release -maxdepth 2 -type f 2>/dev/null | head -20 || true
            exit 1
          fi
          ls -la dist-app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: medoc-app-${{ matrix.os }}
          path: dist-app/**

  build-ops-uis:
    name: Ops UIs (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEDOC_CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps for egui (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1
      - name: Export OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $dir = Join-Path $root "installed\x64-windows"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $lines = @(
            "OPENSSL_DIR=$dir"
            "OPENSSL_LIB_DIR=$(Join-Path $dir 'lib')"
            "OPENSSL_INCLUDE_DIR=$(Join-Path $dir 'include')"
          )
          $payload = ($lines -join [Environment]::NewLine) + [Environment]::NewLine
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $payload, $utf8NoBom)
          $lines | ForEach-Object { Write-Host $_ }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-ops-uis-${{ matrix.os }}
      - name: Release build activation + recovery UIs
        run: cargo build --release -p medoc-usb-setup -p medoc-recovery
      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-ops-uis
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/medoc-usb-setup.exe dist-ops-uis/MedocUsbSetup.exe
            cp target/release/medoc-recovery.exe dist-ops-uis/medoc-recovery.exe
            cp target/release/medoc-recovery-ui.exe dist-ops-uis/medoc-recovery-ui.exe
          else
            cp target/release/medoc-usb-setup dist-ops-uis/MedocUsbSetup
            cp target/release/medoc-recovery dist-ops-uis/medoc-recovery
            cp target/release/medoc-recovery-ui dist-ops-uis/medoc-recovery-ui
            chmod +x dist-ops-uis/*
          fi
          ls -la dist-ops-uis
      - name: Upload ops UI binaries
        uses: actions/upload-artifact@v4
        with:
          name: medoc-ops-uis-${{ matrix.os }}
          path: dist-ops-uis/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/version')
    runs-on: ubuntu-latest
    needs: [build-app, build-ops-uis]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
