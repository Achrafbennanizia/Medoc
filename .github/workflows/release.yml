name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "version*"
  # After CI on main succeeds: build installers. Does not publish a GitHub Release.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}
  # Long-lived read-only PAT for private release assets (NOT the ephemeral GITHUB_TOKEN).
  MEDOC_UPDATER_GITHUB_TOKEN: ${{ secrets.MEDOC_UPDATER_GITHUB_PAT }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
  # workflow_run's github.sha is the workflow file on default branch, not the green CI commit.
  MEDOC_CHECKOUT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-keygen:
    name: medoc-keygen (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: medoc-keygen-linux-x86_64
          - os: macos-latest
            artifact: medoc-keygen-macos
          - os: windows-latest
            artifact: medoc-keygen-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEDOC_CHECKOUT_REF }}
      - name: Install libsodium (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev cmake build-essential
      - name: Install libsodium (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium cmake
      - name: Build keygen (Unix)
        if: runner.os != 'Windows'
        run: bash installer/build-keygen.sh
      - name: Build keygen (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake -y
          vcpkg install libsodium:x64-windows
          cmake -S installer/medoc-keygen -B installer/medoc-keygen/build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build installer/medoc-keygen/build --config Release
          New-Item -ItemType Directory -Force -Path installer/dist | Out-Null
          Copy-Item installer/medoc-keygen/build/Release/medoc-keygen.exe installer/dist/medoc-keygen-windows-x86_64.exe
          Copy-Item installer/medoc-keygen/build/Release/medoc-keygen-verify.exe installer/dist/medoc-keygen-verify-windows-x86_64.exe
      - name: Upload keygen artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer/dist/*

  activation-smoke:
    name: Activation interop smoke
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: [build-keygen]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEDOC_CHECKOUT_REF }}
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev cmake build-essential
      - run: bash installer/build-keygen.sh
      - name: Generate and verify manifest
        run: |
          echo 'correct horse battery staple' > /tmp/pw.txt
          ./installer/dist/medoc-keygen-linux-* --out /tmp/activation.json --passphrase-file /tmp/pw.txt
          ./installer/dist/medoc-keygen-verify-linux-* /tmp/activation.json 'correct horse battery staple'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Rust activation unwrap test
        run: MEDOC_VENDOR_PUBKEY=$MEDOC_VENDOR_PUBKEY cargo test -p medoc-sync activation::tests::unwrap_matches_cpp_keygen_when_available -- --nocapture

  build-installer:
    name: App installer (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    needs: [activation-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: dmg,app
          - os: windows-latest
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEDOC_CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1
      - run: npm run build -w medoc
      - name: Configure Tauri updater (GitHub Releases endpoint)
        run: node scripts/configure-tauri-updater.mjs
      # Same as CI smoke: UI package `src-tauri` is a symlink; cargo metadata
      # on Windows must run from medoc-tauri-host (apps/practice-host).
      - name: Tauri bundle
        run: npm run tauri -w medoc-tauri-host -- build --bundles ${{ matrix.bundles }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: medoc-installer-${{ matrix.os }}
          path: apps/practice-host/target/release/bundle/**/*

  publish-release:
    name: Publish GitHub Release (updater manifest)
    if: startsWith(github.ref, 'refs/tags/version')
    runs-on: ubuntu-latest
    needs: [build-installer]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Merge updater latest.json
        run: |
          node scripts/merge-updater-latest.mjs release-artifacts > latest.json
          cat latest.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            release-artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
