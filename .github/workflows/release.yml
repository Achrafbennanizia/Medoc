name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: verify tagged commit
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  build:
    name: build-signed-${{ matrix.os }}
    needs: gate
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}
      MEDOC_UPDATER_GITHUB_TOKEN: ${{ secrets.MEDOC_UPDATER_GITHUB_PAT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        name: detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - name: enable corepack
        run: corepack enable
      - name: linux tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: install dependencies
        run: ${{ steps.pm.outputs.install_cmd }}
      - name: cargo test (verify again, no fixes)
        run: cargo test --workspace
      - name: build signed tauri bundle
        working-directory: apps/practice-host-ui
        run: ${{ steps.pm.outputs.pm }} run tauri -- build
      - name: checksum release bundle
        run: |
          node -e "
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('apps/practice-host-ui/src-tauri/target/release/bundle');
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile()) files.push(full);
            }
          }
          walk(root);
          files.sort();
          const lines = files.map((file) => {
            const digest = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            const rel = path.relative(root, file).split(path.sep).join('/');
            return digest + '  ' + rel;
          });
          fs.writeFileSync(path.join(root, 'SHA256SUMS.txt'), lines.join('\n') + '\n');
          "
      - name: upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: apps/practice-host-ui/src-tauri/target/release/bundle/**/*
      - name: attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: apps/practice-host-ui/src-tauri/target/release/bundle/**/*
