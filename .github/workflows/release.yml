name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "version*"
  # After CI on main succeeds: ship the desktop app (not NSIS/MSI/keygen).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}
  # workflow_run's github.sha is the workflow file on default branch, not the green CI commit.
  MEDOC_CHECKOUT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-app:
    name: App (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tauri_args: --no-bundle
          - os: macos-latest
            tauri_args: --bundles app
          - os: windows-latest
            tauri_args: --no-bundle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEDOC_CHECKOUT_REF }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1
      - run: npm run build -w medoc
      # Run from medoc-tauri-host (apps/practice-host), not -w medoc.
      - name: Tauri app (no OS installer packages)
        run: npm run tauri -w medoc-tauri-host -- build ${{ matrix.tauri_args }}
      - name: Stage app payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-app
          macos_bundle="apps/practice-host/target/release/bundle/macos"
          if [[ -d "$macos_bundle" ]]; then
            cp -R "$macos_bundle"/. dist-app/
          elif [[ -f apps/practice-host/target/release/medoc.exe ]]; then
            cp apps/practice-host/target/release/medoc.exe dist-app/
          elif [[ -f target/release/medoc.exe ]]; then
            cp target/release/medoc.exe dist-app/
          elif [[ -f apps/practice-host/target/release/medoc ]]; then
            cp apps/practice-host/target/release/medoc dist-app/
          elif [[ -f target/release/medoc ]]; then
            cp target/release/medoc dist-app/
          else
            echo "No MeDoc app binary found under target/release" >&2
            find apps/practice-host/target/release -maxdepth 3 -type f 2>/dev/null | head -50 || true
            find target/release -maxdepth 2 -type f 2>/dev/null | head -20 || true
            exit 1
          fi
          ls -la dist-app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: medoc-app-${{ matrix.os }}
          path: dist-app/**

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/version')
    runs-on: ubuntu-latest
    needs: [build-app]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
