name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/verify.yml

  build:
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    environment: release
    timeout-minutes: 60
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager and release commands
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "tauri_build_cmd=pnpm --filter medoc run tauri -- build" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "tauri_build_cmd=yarn workspace medoc run tauri build" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "tauri_build_cmd=npm run tauri -w medoc -- build" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - uses: Swatinem/rust-cache@v2

      - name: Linux system dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Enable Corepack
        run: corepack enable
      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install_cmd }}
      - name: Verify Rust workspace (no mutation)
        run: cargo test --workspace
      - name: Build signed bundle from tagged commit
        run: ${{ steps.pm.outputs.tauri_build_cmd }}
      - name: Upload signed bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: apps/practice-host-ui/src-tauri/target/release/bundle/**/*
