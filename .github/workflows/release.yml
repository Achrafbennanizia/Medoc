name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  MEDOC_UPDATER_GITHUB_REPO: ${{ github.repository }}
  MEDOC_UPDATER_GITHUB_TOKEN: ${{ secrets.MEDOC_UPDATER_GITHUB_PAT }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gate:
    uses: ./.github/workflows/verify.yml

  build:
    needs: gate
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: pm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm install" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - name: Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}
      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1
      - name: Verify Rust tests on tagged commit
        run: cargo test --workspace
      - name: Build web bundle
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc run build ;;
            npm) npm run build -w medoc ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: Build signed Tauri bundles
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-latest) bundles="deb,rpm,appimage" ;;
            windows-latest) bundles="nsis,msi" ;;
            macos-latest) bundles="dmg,app" ;;
            *) echo "Unsupported OS: ${{ matrix.os }}" >&2; exit 1 ;;
          esac
          (
            cd apps/practice-host
            npx tauri build --bundles "$bundles"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: medoc-${{ matrix.os }}
          path: apps/practice-host/target/release/bundle/**/*
