name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: System deps for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      # bundled-sqlcipher links against OpenSSL headers/libs at build time.
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1

      # Belt-and-suspenders: pin OPENSSL_* for Windows cargo steps even if
      # GITHUB_ENV encoding is odd on the runner (libsqlite3-sys requires these).
      - name: Export OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $dir = Join-Path $root "installed\x64-windows"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $lines = @(
            "OPENSSL_DIR=$dir"
            "OPENSSL_LIB_DIR=$(Join-Path $dir 'lib')"
            "OPENSSL_INCLUDE_DIR=$(Join-Path $dir 'include')"
          )
          $payload = ($lines -join [Environment]::NewLine) + [Environment]::NewLine
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $payload, $utf8NoBom)
          $lines | ForEach-Object { Write-Host $_ }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-${{ matrix.os }}

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --tests

      - name: cargo clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-audit
        if: runner.os == 'Linux'
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true

      - name: cargo audit
        if: runner.os == 'Linux'
        run: cargo audit

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci

      # npm workspace junctions under apps/*/node_modules break Node realpath on Windows (EPERM).
      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1

      # Audit once on Linux (lockfile is OS-independent).
      - name: npm audit
        if: runner.os == 'Linux'
        run: npm audit --omit=dev

      # Small, single-purpose files: no new oversized file, and listed legacy files may only shrink.
      - name: file size rule
        if: runner.os == 'Linux'
        run: npm run check:size

      # Every text lives in packages/shared/locales/<lang>.json, with the same keys in all four languages.
      - name: translations in locale files
        if: runner.os == 'Linux'
        run: npm run i18n:verify && npm run i18n:scan

      - name: unit tests
        if: runner.os != 'Windows'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bash ./scripts/ci-frontend-test.sh

      - name: unit tests (Windows)
        if: runner.os == 'Windows'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: pwsh
        run: ./scripts/ci-frontend-test.ps1

      - name: production build
        run: npm run build

  tauri-smoke:
    name: Tauri smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1

      - name: Export OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $dir = Join-Path $root "installed\x64-windows"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $lines = @(
            "OPENSSL_DIR=$dir"
            "OPENSSL_LIB_DIR=$(Join-Path $dir 'lib')"
            "OPENSSL_INCLUDE_DIR=$(Join-Path $dir 'include')"
          )
          $payload = ($lines -join [Environment]::NewLine) + [Environment]::NewLine
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $payload, $utf8NoBom)
          $lines | ForEach-Object { Write-Host $_ }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-smoke-${{ matrix.os }}

      - name: npm ci
        run: npm ci

      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1

      # Vite dist is required by frontendDist; also run via beforeBuildCommand.
      - name: Build web assets
        run: npm run build -w medoc

      # Run from medoc-tauri-host (apps/practice-host), not -w medoc: the UI
      # package's src-tauri symlink breaks cargo metadata on Windows (path is
      # practice-host-ui\src-tauri, which is not a workspace member).
      - name: tauri build (debug, no bundle)
        run: npm run tauri -w medoc-tauri-host -- build --debug --no-bundle

  # Activation UI (medoc-usb-setup) + recovery CLI/UI — release binaries as artifacts.
  ops-uis:
    name: Ops UIs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps for egui (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1

      - name: Export OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $dir = Join-Path $root "installed\x64-windows"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $lines = @(
            "OPENSSL_DIR=$dir"
            "OPENSSL_LIB_DIR=$(Join-Path $dir 'lib')"
            "OPENSSL_INCLUDE_DIR=$(Join-Path $dir 'include')"
          )
          $payload = ($lines -join [Environment]::NewLine) + [Environment]::NewLine
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $payload, $utf8NoBom)
          $lines | ForEach-Object { Write-Host $_ }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ops-uis-${{ matrix.os }}

      - name: Release build activation + recovery UIs
        run: |
          cargo build --release -p medoc-usb-setup -p medoc-recovery

      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-ops-uis
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/medoc-usb-setup.exe dist-ops-uis/MedocUsbSetup.exe
            cp target/release/medoc-recovery.exe dist-ops-uis/medoc-recovery.exe
            cp target/release/medoc-recovery-ui.exe dist-ops-uis/medoc-recovery-ui.exe
          else
            cp target/release/medoc-usb-setup dist-ops-uis/MedocUsbSetup
            cp target/release/medoc-recovery dist-ops-uis/medoc-recovery
            cp target/release/medoc-recovery-ui dist-ops-uis/medoc-recovery-ui
            chmod +x dist-ops-uis/*
          fi
          ls -la dist-ops-uis

      - name: Upload ops UI binaries
        uses: actions/upload-artifact@v4
        with:
          name: medoc-ops-uis-${{ matrix.os }}
          path: dist-ops-uis/**
          if-no-files-found: error

  playwright-lan:
    name: Playwright LAN
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev curl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-ubuntu-latest

      - name: Build medoc-server
        run: cargo build -p medoc-lan-server --bin medoc-server

      - name: Start LAN server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/medoc-lan-data"
          MEDOC_DEV_SEED=1 ./target/debug/medoc-server \
            --data-dir "$RUNNER_TEMP/medoc-lan-data" \
            --http-bind 127.0.0.1 \
            --http-port 8787 \
            > "$RUNNER_TEMP/medoc-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/medoc-server.pid"
          for _ in $(seq 1 60); do
            if curl -fsSk https://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "medoc-server did not become healthy"
          cat "$RUNNER_TEMP/medoc-server.log" || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/practice-host-ui
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: apps/practice-host-ui
        env:
          MEDOC_LAN_E2E: "1"
          MEDOC_LAN_URL: https://127.0.0.1:8787
        run: npm run test:playwright

  # One build per edition × flavor (docs/architecture/editions-plan.md §7). cargo check proves each
  # feature set compiles and matches config/editions.yaml; the surface check proves that code an
  # edition does not have is not in its binary or bundle.
  editions:
    name: Edition ${{ matrix.edition }}${{ matrix.replica && ' (replica)' || '' }}
    runs-on: ubuntu-latest
    needs: [rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: solo, replica: false }
          - { edition: duo, replica: false }
          - { edition: duo, replica: true }
          - { edition: group, replica: false }
          - { edition: group, replica: true }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps for Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-ubuntu-latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci

      - name: cargo check
        run: cargo check -p medoc --no-default-features --features "edition-${{ matrix.edition }}${{ matrix.replica && ',replica' || '' }}"

      - name: web build
        env:
          MEDOC_EDITION: ${{ matrix.edition }}
          VITE_MEDOC_FLAVOR: ${{ matrix.replica && 'replica' || '' }}
        run: npm run build -w medoc

      - name: edition surface check
        run: bash scripts/check-edition-surface.sh ${{ matrix.edition }}

      # Code that only exists in this edition (guest inbox in Solo) is only tested here.
      - name: edition tests
        run: |
          cargo test -p medoc-practice --no-default-features --features "edition-${{ matrix.edition }}${{ matrix.replica && ',replica' || '' }}" --lib
          if [ "${{ matrix.edition }}" = "solo" ]; then
            cargo test -p medoc-core --features cap-guest-inbox --test guest_inbox_tests
          fi

  ci-ok:
    name: CI gate
    if: always()
    needs: [rust, frontend, tauri-smoke, playwright-lan, ops-uis, editions]
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to succeed
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=${{ needs.rust.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "tauri-smoke=${{ needs.tauri-smoke.result }}"
          echo "playwright-lan=${{ needs.playwright-lan.result }}"
          echo "ops-uis=${{ needs.ops-uis.result }}"
          echo "editions=${{ needs.editions.result }}"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.tauri-smoke.result }}" = "success"
          test "${{ needs.playwright-lan.result }}" = "success"
          test "${{ needs.ops-uis.result }}" = "success"
          test "${{ needs.editions.result }}" = "success"
