name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: System deps for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      # bundled-sqlcipher links against OpenSSL headers/libs at build time.
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-${{ matrix.os }}

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --tests

      - name: cargo clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-audit
        if: runner.os == 'Linux'
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true

      - name: cargo audit
        if: runner.os == 'Linux'
        run: cargo audit

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci

      # npm workspace junctions under apps/*/node_modules break Node realpath on Windows (EPERM).
      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1

      # Audit once on Linux (lockfile is OS-independent).
      - name: npm audit
        if: runner.os == 'Linux'
        run: npm audit --omit=dev

      - name: unit tests
        if: runner.os != 'Windows'
        run: npm run test

      - name: unit tests (Windows)
        if: runner.os == 'Windows'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        shell: pwsh
        run: npm run test -- --pool=forks --maxWorkers=2 --fileParallelism=false

      - name: production build
        run: npm run build

  tauri-smoke:
    name: Tauri smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-install-openssl.ps1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-smoke-${{ matrix.os }}

      - name: npm ci
        run: npm ci

      - name: Unwrap Windows workspace node_modules links
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-unwrap-workspace-node-modules.ps1

      - name: tauri build (debug, no bundle)
        run: npm run tauri build -- --debug --no-bundle

  ci-ok:
    name: CI gate
    if: always()
    needs: [rust, frontend, tauri-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to succeed
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=${{ needs.rust.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "tauri-smoke=${{ needs.tauri-smoke.result }}"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.tauri-smoke.result }}" = "success"
