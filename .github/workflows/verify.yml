name: verify

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect JavaScript package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Lint (no auto-fix)
        run: ${{ steps.pm.outputs.pm }} run lint

      - name: Typecheck
        shell: bash
        run: |
          if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts.typecheck ? 0 : 1)"; then
            ${{ steps.pm.outputs.pm }} run typecheck
          elif node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts.check ? 0 : 1)"; then
            ${{ steps.pm.outputs.pm }} run check
          else
            echo "No typecheck/check script declared in package.json" >&2
            exit 1
          fi

      - name: Test
        run: ${{ steps.pm.outputs.pm }} run test

      - name: Build
        run: ${{ steps.pm.outputs.pm }} run build

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect JavaScript package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Build UI for accessibility checks
        run: ${{ steps.pm.outputs.pm }} run build

      - name: Run axe-core and fail on critical WCAG 2.1 A/AA violations
        shell: bash
        run: |
          if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts['test:a11y'] ? 0 : 1)"; then
            ${{ steps.pm.outputs.pm }} run test:a11y
            exit 0
          fi

          npx --yes http-server apps/practice-host-ui/dist --port 4173 >/tmp/http-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wait-on http://127.0.0.1:4173
          npx --yes @axe-core/cli "http://127.0.0.1:4173" --tags wcag2a,wcag2aa --save axe-results.json || true

          node <<'NODE'
          const fs = require("node:fs");
          const reportPath = "axe-results.json";

          if (!fs.existsSync(reportPath)) {
            console.error("Expected axe report at axe-results.json");
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const violations = Array.isArray(report.violations) ? report.violations : [];
          const critical = violations.filter((violation) => violation.impact === "critical");

          if (critical.length > 0) {
            console.error(`Found ${critical.length} critical WCAG 2.1 A/AA violations.`);
            for (const violation of critical) {
              const nodeCount = Array.isArray(violation.nodes) ? violation.nodes.length : 0;
              console.error(`- ${violation.id}: ${violation.help} (${nodeCount} nodes)`);
            }
            process.exit(1);
          }

          console.log(`No critical WCAG 2.1 A/AA violations detected (${violations.length} total violations).`);
          NODE
