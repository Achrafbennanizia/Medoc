name: verify

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt/clippy/test/audit)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies for Tauri-linked workspace crates
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --tests
      - name: Install cargo-audit if missing
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked || true
          fi
      - run: cargo audit

  web:
    name: web (lint/typecheck/test/build)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run_cmd=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --immutable" >> "$GITHUB_OUTPUT"
            echo "run_cmd=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "run_cmd=npm run" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}
      - run: ${{ steps.pm.outputs.run_cmd }} lint
      - run: ${{ steps.pm.outputs.run_cmd }} typecheck
      - run: ${{ steps.pm.outputs.run_cmd }} test
      - run: ${{ steps.pm.outputs.run_cmd }} build

  a11y:
    name: a11y (axe-core critical wcag2.1 aa)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run_cmd=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --immutable" >> "$GITHUB_OUTPUT"
            echo "run_cmd=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
            echo "run_cmd=npm run" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_cmd }}
      - run: ${{ steps.pm.outputs.run_cmd }} build
      - name: Install matching Chrome and ChromeDriver
        run: npx --yes browser-driver-manager install chrome
      - id: drivers
        name: Resolve browser and driver paths
        shell: bash
        run: |
          eval "$(npx --yes browser-driver-manager which)"
          echo "chrome_path=$CHROME_TEST_PATH" >> "$GITHUB_OUTPUT"
          echo "chromedriver_path=$CHROMEDRIVER_TEST_PATH" >> "$GITHUB_OUTPUT"
      - name: Run axe-core audit against built UI
        shell: bash
        run: |
          npx --yes http-server apps/practice-host-ui/dist --port 4173 --silent > /tmp/medoc-a11y-server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173" >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS "http://127.0.0.1:4173" >/dev/null; then
            echo "A11y server did not start in time."
            cat /tmp/medoc-a11y-server.log
            exit 1
          fi

          npx --yes @axe-core/cli "http://127.0.0.1:4173" \
            --tags wcag2a,wcag2aa \
            --save axe-report.json \
            --dir . \
            --no-reporter \
            --chrome-path "${{ steps.drivers.outputs.chrome_path }}" \
            --chromedriver-path "${{ steps.drivers.outputs.chromedriver_path }}"

          node <<'NODE'
          const fs = require("fs");
          const reports = JSON.parse(fs.readFileSync("axe-report.json", "utf8"));
          const criticalViolations = reports
            .flatMap((report) => report.violations || [])
            .filter((violation) => violation.impact === "critical");

          if (criticalViolations.length > 0) {
            console.error(`Critical WCAG 2.1 A/AA violations: ${criticalViolations.length}`);
            for (const violation of criticalViolations) {
              console.error(`- ${violation.id}: ${violation.help}`);
            }
            process.exit(1);
          }

          console.log("No critical WCAG 2.1 A/AA violations detected by axe-core.");
          NODE
