name: verify

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps for Tauri workspace crates
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --tests
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  web:
    name: Web verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Detect package manager and command map
        id: pm
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_command=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_command=pnpm run lint" >> "$GITHUB_OUTPUT"
            echo "typecheck_command=pnpm run typecheck" >> "$GITHUB_OUTPUT"
            echo "test_command=pnpm run test" >> "$GITHUB_OUTPUT"
            echo "build_command=pnpm run build" >> "$GITHUB_OUTPUT"
            echo "build_ui_command=pnpm --filter medoc run build" >> "$GITHUB_OUTPUT"
            echo "a11y_command=pnpm run test:a11y" >> "$GITHUB_OUTPUT"
            echo "lint_fix_command=pnpm run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_command=pnpm run format" >> "$GITHUB_OUTPUT"
            echo "tauri_build_command=pnpm --filter medoc run tauri -- build" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_command=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "lint_command=yarn lint" >> "$GITHUB_OUTPUT"
            echo "typecheck_command=yarn typecheck" >> "$GITHUB_OUTPUT"
            echo "test_command=yarn test" >> "$GITHUB_OUTPUT"
            echo "build_command=yarn build" >> "$GITHUB_OUTPUT"
            echo "build_ui_command=yarn workspace medoc build" >> "$GITHUB_OUTPUT"
            echo "a11y_command=yarn test:a11y" >> "$GITHUB_OUTPUT"
            echo "lint_fix_command=yarn lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_command=yarn format" >> "$GITHUB_OUTPUT"
            echo "tauri_build_command=yarn workspace medoc tauri build" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_command=npm ci" >> "$GITHUB_OUTPUT"
            echo "lint_command=npm run lint" >> "$GITHUB_OUTPUT"
            echo "typecheck_command=npm run typecheck" >> "$GITHUB_OUTPUT"
            echo "test_command=npm run test" >> "$GITHUB_OUTPUT"
            echo "build_command=npm run build" >> "$GITHUB_OUTPUT"
            echo "build_ui_command=npm run build -w medoc" >> "$GITHUB_OUTPUT"
            echo "a11y_command=npm run test:a11y" >> "$GITHUB_OUTPUT"
            echo "lint_fix_command=npm run lint:fix" >> "$GITHUB_OUTPUT"
            echo "format_command=npm run format" >> "$GITHUB_OUTPUT"
            echo "tauri_build_command=npm run tauri build -w medoc" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install_command }}
      - name: Lint (no autofix)
        run: ${{ steps.pm.outputs.lint_command }}
      - name: Typecheck
        run: ${{ steps.pm.outputs.typecheck_command }}
      - name: Test
        run: ${{ steps.pm.outputs.test_command }}
      - name: Build
        run: ${{ steps.pm.outputs.build_command }}

  a11y:
    name: Web accessibility (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect package manager and command map
        id: pm
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_command=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "build_ui_command=pnpm --filter medoc run build" >> "$GITHUB_OUTPUT"
            echo "preview_command=pnpm --filter medoc run preview -- --host 127.0.0.1 --port 4173" >> "$GITHUB_OUTPUT"
            echo "a11y_command=pnpm run test:a11y" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_command=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "build_ui_command=yarn workspace medoc build" >> "$GITHUB_OUTPUT"
            echo "preview_command=yarn workspace medoc preview --host 127.0.0.1 --port 4173" >> "$GITHUB_OUTPUT"
            echo "a11y_command=yarn test:a11y" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_command=npm ci" >> "$GITHUB_OUTPUT"
            echo "build_ui_command=npm run build -w medoc" >> "$GITHUB_OUTPUT"
            echo "preview_command=npm run preview -w medoc -- --host 127.0.0.1 --port 4173" >> "$GITHUB_OUTPUT"
            echo "a11y_command=npm run test:a11y" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install_command }}
      - name: Build UI for a11y scan
        run: ${{ steps.pm.outputs.build_ui_command }}
      - name: Run axe-core critical WCAG 2.1 AA gate
        env:
          A11Y_PREVIEW_COMMAND: ${{ steps.pm.outputs.preview_command }}
        run: ${{ steps.pm.outputs.a11y_command }}
