name: verify

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  web:
    name: Web verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "No lockfile found in repository root." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - run: corepack enable
      - name: install dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: lint (no fix)
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run lint ;;
            yarn) yarn workspace medoc run lint ;;
            npm) npm run lint -w medoc ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: typecheck
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc exec tsc --noEmit ;;
            yarn) yarn workspace medoc run tsc --noEmit ;;
            npm) npm exec --workspace medoc -- tsc --noEmit ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: test
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run test ;;
            yarn) yarn workspace medoc run test ;;
            npm) npm run test -w medoc ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: build
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc run build ;;
            npm) npm run build -w medoc ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac

  a11y:
    name: Accessibility verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "No lockfile found in repository root." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - run: corepack enable
      - name: install dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: build web app
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc run build ;;
            npm) npm run build -w medoc ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: axe-core scan (critical WCAG 2.1 A/AA)
        shell: bash
        run: |
          npx --yes serve -s apps/practice-host-ui/dist -l 4173 >/tmp/medoc-a11y-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wait-on http://127.0.0.1:4173
          npx --yes @axe-core/cli "http://127.0.0.1:4173" \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --save axe-results.json

          node <<'NODE'
          const fs = require("fs");
          const raw = JSON.parse(fs.readFileSync("axe-results.json", "utf8"));
          const pages = Array.isArray(raw) ? raw : [raw];

          const critical = [];
          for (const page of pages) {
            const violations = Array.isArray(page.violations) ? page.violations : [];
            for (const violation of violations) {
              if (violation.impact === "critical") {
                critical.push({
                  id: violation.id,
                  impact: violation.impact,
                  help: violation.help,
                  url: violation.helpUrl,
                });
              }
            }
          }

          if (critical.length > 0) {
            console.error("Critical WCAG 2.1 A/AA violations detected:");
            console.error(JSON.stringify(critical, null, 2));
            process.exit(1);
          }

          console.log("No critical WCAG 2.1 A/AA violations detected.");
          NODE
