name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Linux dependencies for Tauri-linked crates
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" && exit 1 ;;
          esac
      - name: Lint, typecheck, test, build
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          run_workspace_script() {
            script="$1"
            case "$PM" in
              npm) npm run "$script" -w medoc ;;
              pnpm) pnpm --filter medoc run "$script" ;;
              yarn) yarn workspace medoc run "$script" ;;
              *) echo "Unsupported package manager: $PM" && exit 1 ;;
            esac
          }

          run_workspace_script lint
          run_workspace_script typecheck
          run_workspace_script test
          run_workspace_script build

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" && exit 1 ;;
          esac
      - name: Build web UI
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            npm) npm run build -w medoc ;;
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc run build ;;
            *) echo "Unsupported package manager: $PM" && exit 1 ;;
          esac
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run axe-core accessibility checks
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            npm) npm run test:a11y -w medoc ;;
            pnpm) pnpm --filter medoc run test:a11y ;;
            yarn) yarn workspace medoc run test:a11y ;;
            *) echo "Unsupported package manager: $PM" && exit 1 ;;
          esac
