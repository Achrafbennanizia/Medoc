name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}

      - name: Enable corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager" && exit 1 ;;
          esac

      - name: Lint (no --fix in verify)
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run lint ;;
            yarn) yarn run lint ;;
            npm) npm run lint ;;
            *) echo "Unsupported package manager" && exit 1 ;;
          esac

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit((p.scripts||{}).typecheck ? 0 : 1)"; then
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm run typecheck ;;
              yarn) yarn run typecheck ;;
              npm) npm run typecheck ;;
              *) echo "Unsupported package manager" && exit 1 ;;
            esac
          else
            ./node_modules/.bin/tsc --noEmit -p apps/practice-host-ui/tsconfig.json
            if [ -f apps/lan-web-client/tsconfig.json ]; then
              ./node_modules/.bin/tsc --noEmit -p apps/lan-web-client/tsconfig.json
            fi
          fi

      - name: Test
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run test ;;
            yarn) yarn run test ;;
            npm) npm run test ;;
            *) echo "Unsupported package manager" && exit 1 ;;
          esac

      - name: Build
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
            *) echo "Unsupported package manager" && exit 1 ;;
          esac

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}

      - name: Enable corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager" && exit 1 ;;
          esac

      - name: Build web assets
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
            *) echo "Unsupported package manager" && exit 1 ;;
          esac

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: axe-core critical WCAG gate
        run: node scripts/test-a11y.mjs
