name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  rust:
    name: Rust workspace verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (check)
        run: cargo fmt --all --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace --tests
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  web:
    name: JavaScript workspace verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.name }}
      - run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}
      - name: Lint (no autofix)
        run: ${{ steps.pm.outputs.name }} run lint
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          if ${{ steps.pm.outputs.name }} run typecheck; then
            exit 0
          fi
          echo "No root typecheck script found, falling back to check."
          ${{ steps.pm.outputs.name }} run check
      - name: Test
        run: ${{ steps.pm.outputs.name }} run test
      - name: Build
        run: ${{ steps.pm.outputs.name }} run build

  a11y:
    name: Accessibility gate (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.name }}
      - run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}
      - name: Build web UI
        run: ${{ steps.pm.outputs.name }} run build
      - name: Scan built UI with axe-core
        shell: bash
        run: |
          set -euo pipefail
          npx --yes http-server@latest "apps/practice-host-ui/dist" -a 127.0.0.1 -p 4173 >/tmp/http-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID"; }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done

          npx --yes @axe-core/cli@latest "http://127.0.0.1:4173" \
            --tags wcag2a,wcag2aa \
            --save axe-results.json || true

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('axe-results.json', 'utf8'));
          const violations = Array.isArray(report.violations) ? report.violations : [];
          const critical = violations.filter((item) => item.impact === 'critical');

          if (critical.length > 0) {
            console.error(`Critical WCAG 2.1 AA violations: ${critical.length}`);
            for (const item of critical) {
              console.error(`- ${item.id}: ${item.help}`);
            }
            process.exit(1);
          }

          console.log(`No critical WCAG 2.1 AA violations. Total violations found: ${violations.length}.`);
          NODE
