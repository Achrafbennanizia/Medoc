name: verify

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true
      - run: cargo audit

  web:
    name: Web verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn run" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install }}
      - run: ${{ steps.pm.outputs.run }} lint
      - name: Typecheck
        run: |
          npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json
          if [ -f apps/lan-web-client/tsconfig.json ]; then
            npx tsc --noEmit -p apps/lan-web-client/tsconfig.json
          fi
      - run: ${{ steps.pm.outputs.run }} test
      - run: ${{ steps.pm.outputs.run }} build

  a11y:
    name: Accessibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn run" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install }}
      - run: ${{ steps.pm.outputs.run }} build
      - name: axe-core critical WCAG 2.1 AA
        shell: bash
        run: |
          set -euo pipefail

          npm run preview -w medoc -- --host 127.0.0.1 --port 4173 > /tmp/medoc-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() {
            if ps -p "$PREVIEW_PID" > /dev/null 2>&1; then
              kill "$PREVIEW_PID"
            fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4173" > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS "http://127.0.0.1:4173" > /dev/null 2>&1; then
            echo "Preview server did not become ready."
            cat /tmp/medoc-preview.log
            exit 1
          fi

          npx --yes @axe-core/cli "http://127.0.0.1:4173" --tags wcag2a,wcag2aa --save axe-results.json || true

          node - <<'NODE'
          const fs = require("fs");

          if (!fs.existsSync("axe-results.json")) {
            console.error("axe-results.json was not produced by axe-core CLI.");
            process.exit(1);
          }

          const parsed = JSON.parse(fs.readFileSync("axe-results.json", "utf8"));
          const docs = Array.isArray(parsed) ? parsed : [parsed];
          const critical = [];

          for (const doc of docs) {
            const violations = Array.isArray(doc?.violations) ? doc.violations : [];
            for (const violation of violations) {
              if (violation?.impact === "critical") {
                critical.push({
                  id: violation.id,
                  help: violation.help,
                  nodes: Array.isArray(violation.nodes) ? violation.nodes.length : 0
                });
              }
            }
          }

          if (critical.length > 0) {
            console.error("Critical WCAG 2.1 AA violations detected:");
            for (const item of critical) {
              console.error(`- ${item.id}: ${item.help} (nodes: ${item.nodes})`);
            }
            process.exit(1);
          }

          console.log("No critical WCAG 2.1 AA violations detected by axe-core.");
          NODE
