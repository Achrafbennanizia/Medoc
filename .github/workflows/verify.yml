name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: System deps for Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.name }}

      - run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Lint JS workspace (no auto-fix)
        shell: bash
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm --filter medoc run lint
              ;;
            yarn)
              yarn workspace medoc run lint
              ;;
            npm)
              npm run lint -w medoc
              ;;
          esac

      - name: Type-check JS workspace
        shell: bash
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm --filter medoc exec tsc --noEmit
              pnpm --filter medoc-lan-web-client run typecheck
              ;;
            yarn)
              yarn workspace medoc tsc --noEmit
              yarn workspace medoc-lan-web-client run typecheck
              ;;
            npm)
              npm exec --workspace medoc -- tsc --noEmit
              npm run typecheck -w medoc-lan-web-client
              ;;
          esac

      - name: JS tests
        shell: bash
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm --filter medoc run test
              ;;
            yarn)
              yarn workspace medoc run test
              ;;
            npm)
              npm run test -w medoc
              ;;
          esac

      - name: JS builds
        shell: bash
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm --filter medoc run build
              pnpm --filter medoc-lan-web-client run build
              ;;
            yarn)
              yarn workspace medoc run build
              yarn workspace medoc-lan-web-client run build
              ;;
            npm)
              npm run build -w medoc
              npm run build -w medoc-lan-web-client
              ;;
          esac

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.name }}

      - run: corepack enable

      - name: Install JS dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Build web UI for accessibility scan
        shell: bash
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm --filter medoc run build
              ;;
            yarn)
              yarn workspace medoc run build
              ;;
            npm)
              npm run build -w medoc
              ;;
          esac

      - name: Run axe-core; fail on critical WCAG 2.1 AA violations
        shell: bash
        run: |
          set -euo pipefail

          case "${{ steps.pm.outputs.name }}" in
            pnpm)
              pnpm --filter medoc run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/medoc-preview.log 2>&1 &
              ;;
            yarn)
              yarn workspace medoc run preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/medoc-preview.log 2>&1 &
              ;;
            npm)
              npm run preview -w medoc -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/medoc-preview.log 2>&1 &
              ;;
          esac
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for _ in {1..45}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null

          npx --yes @axe-core/cli@4.10.2 http://127.0.0.1:4173 \
            --tags wcag2a,wcag2aa,wcag21aa \
            --save axe-report.json || true

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const raw = readFileSync("axe-report.json", "utf8");
          const report = JSON.parse(raw);
          const runs = Array.isArray(report) ? report : [report];

          const aaTags = new Set(["wcag2aa", "wcag21aa"]);
          const criticalViolations = [];

          for (const run of runs) {
            const violations = Array.isArray(run?.violations) ? run.violations : [];
            for (const violation of violations) {
              const tags = new Set(violation.tags ?? []);
              const hasAaTag = [...aaTags].some((tag) => tags.has(tag));
              if (violation.impact === "critical" && hasAaTag) {
                criticalViolations.push(violation.id);
              }
            }
          }

          if (criticalViolations.length > 0) {
            console.error(
              `Critical WCAG 2.1 AA accessibility violations: ${criticalViolations.join(", ")}`
            );
            process.exit(1);
          }

          console.log("No critical WCAG 2.1 AA accessibility violations detected.");
          NODE

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: axe-report.json
