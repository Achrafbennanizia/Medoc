name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies for Tauri-linked crates
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting check
        run: cargo fmt --all -- --check

      - name: Rust clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --tests

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Cargo advisory audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect JavaScript package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Enable corepack shims
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager" >&2; exit 1 ;;
          esac

      - name: Lint (no auto-fix)
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm --filter medoc run lint ;;
            yarn) yarn workspace medoc lint ;;
            npm) npm run lint -w medoc ;;
          esac

      - name: Type-check
        run: |
          set -euo pipefail
          npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json
          npx tsc --noEmit -p apps/lan-web-client/tsconfig.json

      - name: JavaScript tests
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm --filter medoc run test ;;
            yarn) yarn workspace medoc test ;;
            npm) npm run test -w medoc ;;
          esac

      - name: Build web app
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc build ;;
            npm) npm run build -w medoc ;;
          esac

  a11y:
    runs-on: ubuntu-latest
    needs: [web]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect JavaScript package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Enable corepack shims
        run: corepack enable

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager" >&2; exit 1 ;;
          esac

      - name: Build web app for accessibility scan
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc build ;;
            npm) npm run build -w medoc ;;
          esac

      - name: Axe-core scan (fail on critical WCAG 2.1 A/AA violations)
        run: |
          set -euo pipefail

          run_preview() {
            case "${{ steps.pm.outputs.manager }}" in
              pnpm) pnpm --filter medoc run preview -- --host 127.0.0.1 --port 4173 ;;
              yarn) yarn workspace medoc preview --host 127.0.0.1 --port 4173 ;;
              npm) npm run preview -w medoc -- --host 127.0.0.1 --port 4173 ;;
            esac
          }

          cleanup() {
            if [ -n "${PREVIEW_PID:-}" ]; then
              kill "$PREVIEW_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          run_preview &
          PREVIEW_PID=$!

          for _ in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:4173" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:4173" > /dev/null

          npx --yes browser-driver-manager install chrome
          CHROME_PATH=$(rg "^CHROME_TEST_PATH" "$HOME/.browser-driver-manager/.env" | cut -d'=' -f2 | tr -d '"')
          CHROMEDRIVER_PATH=$(rg "^CHROMEDRIVER_TEST_PATH" "$HOME/.browser-driver-manager/.env" | cut -d'=' -f2 | tr -d '"')
          REPORT_PATH="$RUNNER_TEMP/axe-report.json"

          npx --yes @axe-core/cli "http://127.0.0.1:4173" \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --save axe-report.json \
            --dir "$RUNNER_TEMP" \
            --chrome-path "$CHROME_PATH" \
            --chromedriver-path "$CHROMEDRIVER_PATH"

          REPORT_PATH="$REPORT_PATH" node <<'NODE'
          const fs = require("fs");
          const reportPath = process.env.REPORT_PATH;
          const pages = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const violations = pages.flatMap((page) => page.violations || []);
          const critical = violations.filter((item) => item.impact === "critical");
          if (critical.length > 0) {
            console.error(`Found ${critical.length} critical accessibility violation(s):`);
            for (const item of critical) {
              console.error(`- ${item.id}: ${item.help}`);
            }
            process.exit(1);
          }
          console.log("No critical WCAG 2.1 A/AA accessibility violations detected by axe.");
          NODE
