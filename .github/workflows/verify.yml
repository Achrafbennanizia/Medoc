name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: cargo fmt (check-only)
        run: cargo fmt --all -- --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.pm != 'npm'
        run: corepack enable
      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: Lint (no autofix)
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run lint ;;
            yarn) yarn workspace medoc lint ;;
            npm) npm run lint -w medoc ;;
          esac
      - name: Typecheck
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run typecheck ;;
            yarn) yarn workspace medoc typecheck ;;
            npm) npm run typecheck -w medoc ;;
          esac
      - name: Test
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run test ;;
            yarn) yarn workspace medoc test ;;
            npm) npm run test -w medoc ;;
          esac
      - name: Build
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc build ;;
            npm) npm run build -w medoc ;;
          esac

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.pm != 'npm'
        run: corepack enable
      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" >&2; exit 1 ;;
          esac
      - name: Build UI
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc build ;;
            npm) npm run build -w medoc ;;
          esac
      - name: Run axe-core (fail on critical WCAG 2.1 A/AA violations)
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run preview -- --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 & ;;
            yarn) yarn workspace medoc preview --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 & ;;
            npm) npm run preview -w medoc -- --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 & ;;
          esac
          PREVIEW_PID=$!
          trap 'kill "${PREVIEW_PID}" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:4173" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 40 ]; then
              echo "Preview server did not become ready in time." >&2
              cat /tmp/medoc-preview.log >&2 || true
              exit 1
            fi
            sleep 2
          done

          npx --yes @axe-core/cli \
            "http://127.0.0.1:4173" \
            --tags wcag2a,wcag2aa \
            --save axe-report.json || true

          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("axe-report.json", "utf8"));
          const critical = (report.violations || []).filter(
            (violation) => violation.impact === "critical",
          );
          if (critical.length > 0) {
            console.error(`Found ${critical.length} critical accessibility violations.`);
            for (const violation of critical) {
              console.error(`- ${violation.id}: ${violation.help}`);
            }
            process.exit(1);
          }
          console.log("No critical WCAG 2.1 A/AA accessibility violations detected.");
          NODE
