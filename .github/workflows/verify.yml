name: verify

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        shell: bash
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac

      - name: Lint (no auto-fix)
        shell: bash
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm --filter medoc run lint ;;
            yarn) yarn workspace medoc lint ;;
            npm) npm run lint -w medoc ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm --filter medoc run typecheck ;;
            yarn) yarn workspace medoc typecheck ;;
            npm) npm run typecheck -w medoc ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac

      - name: JS tests
        shell: bash
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm --filter medoc run test ;;
            yarn) yarn workspace medoc test ;;
            npm) npm run test -w medoc ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac

      - name: JS build
        shell: bash
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc build ;;
            npm) npm run build -w medoc ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        shell: bash
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc build ;;
            npm) npm run build -w medoc ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac

      - name: axe-core WCAG 2.1 AA critical gate
        shell: bash
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm --filter medoc run preview -- --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 & ;;
            yarn) yarn workspace medoc preview --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 & ;;
            npm) npm run preview -w medoc -- --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 & ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for _ in {1..60}; do
            if curl -fsS "http://127.0.0.1:4173" >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS "http://127.0.0.1:4173" >/dev/null; then
            cat /tmp/medoc-preview.log
            exit 1
          fi
          case "$PM" in
            pnpm) A11Y_BASE_URL="http://127.0.0.1:4173" pnpm --filter medoc run test:a11y ;;
            yarn) A11Y_BASE_URL="http://127.0.0.1:4173" yarn workspace medoc test:a11y ;;
            npm) A11Y_BASE_URL="http://127.0.0.1:4173" npm run test:a11y -w medoc ;;
            *) echo "Unsupported package manager: $PM" >&2; exit 1 ;;
          esac

  verify-ok:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [rust, web, a11y]
    steps:
      - name: Enforce verify job success
        shell: bash
        run: |
          set -euo pipefail
          echo "rust=${{ needs.rust.result }}"
          echo "web=${{ needs.web.result }}"
          echo "a11y=${{ needs.a11y.result }}"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.a11y.result }}" = "success"
