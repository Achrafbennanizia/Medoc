name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock

      - name: Enable Corepack for pnpm/yarn
        run: corepack enable

      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
            *)
              echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}"
              exit 1
              ;;
          esac

      - name: Lint (no --fix)
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run lint ;;
            yarn) yarn run lint ;;
            npm) npm run lint ;;
          esac

      - name: Typecheck (no emit)
        run: |
          set -euo pipefail
          if node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); process.exit(pkg.scripts && pkg.scripts.typecheck ? 0 : 1);"; then
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm run typecheck ;;
              yarn) yarn run typecheck ;;
              npm) npm run typecheck ;;
            esac
          else
            echo "No root typecheck script found; using apps/practice-host-ui tsconfig fallback."
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm exec tsc --noEmit -p apps/practice-host-ui/tsconfig.json ;;
              yarn) yarn exec tsc --noEmit -p apps/practice-host-ui/tsconfig.json ;;
              npm) npm exec tsc --noEmit -p apps/practice-host-ui/tsconfig.json ;;
            esac
          fi

      - name: Unit tests
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run test ;;
            yarn) yarn run test ;;
            npm) npm run test ;;
          esac

      - name: Build
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
          esac

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            package-lock.json
            pnpm-lock.yaml
            yarn.lock

      - name: Enable Corepack for pnpm/yarn
        run: corepack enable

      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
            *)
              echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}"
              exit 1
              ;;
          esac

      - name: Build web UI
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
          esac

      - name: Run axe-core critical WCAG 2.1 AA gate
        run: |
          set -euo pipefail

          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm --filter medoc run preview -- --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 &
              ;;
            yarn)
              yarn workspace medoc preview --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 &
              ;;
            npm)
              npm run preview -w medoc -- --host 127.0.0.1 --port 4173 >/tmp/medoc-preview.log 2>&1 &
              ;;
          esac
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:4173 >/dev/null; then
            echo "Preview server did not become ready."
            cat /tmp/medoc-preview.log || true
            exit 1
          fi

          npx --yes browser-driver-manager install chrome
          npx --yes @axe-core/cli http://127.0.0.1:4173 --tags wcag2a,wcag2aa,wcag21a,wcag21aa --save axe-results.json --no-reporter

          node <<'NODE'
          const fs = require("fs");

          const report = JSON.parse(fs.readFileSync("axe-results.json", "utf8"));
          const pages = Array.isArray(report) ? report : [report];
          const critical = [];

          for (const page of pages) {
            const url = page.url || "unknown";
            for (const violation of page.violations || []) {
              const tags = new Set(violation.tags || []);
              const wcag21 = tags.has("wcag21a") || tags.has("wcag21aa") || tags.has("wcag2a") || tags.has("wcag2aa");
              if (wcag21 && violation.impact === "critical") {
                critical.push({
                  url,
                  id: violation.id,
                  help: violation.help,
                  nodes: Array.isArray(violation.nodes) ? violation.nodes.length : 0,
                });
              }
            }
          }

          if (critical.length > 0) {
            console.error("Critical WCAG 2.1 AA violations detected:");
            for (const item of critical) {
              console.error(`- ${item.url} :: ${item.id} :: ${item.help} (nodes=${item.nodes})`);
            }
            process.exit(1);
          }

          console.log("No critical WCAG 2.1 AA axe-core violations detected.");
          NODE

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: axe-results.json
          if-no-files-found: warn
