name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies for Tauri-linked crates
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true
      - name: cargo audit
        run: cargo audit

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install }}
      - name: Lint workspace (no auto-fix)
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run lint ;;
            yarn) yarn workspace medoc lint ;;
            npm) npm run lint -w medoc ;;
          esac
      - name: Type-check workspace
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm --filter medoc run typecheck
              pnpm --filter medoc-lan-web-client run typecheck
              ;;
            yarn)
              yarn workspace medoc typecheck
              yarn workspace medoc-lan-web-client typecheck
              ;;
            npm)
              npm run typecheck -w medoc
              npm run typecheck -w medoc-lan-web-client
              ;;
          esac
      - name: Run tests
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run test ;;
            yarn) yarn workspace medoc test ;;
            npm) npm run test -w medoc ;;
          esac
      - name: Build workspace
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm)
              pnpm --filter medoc run build
              pnpm --filter medoc-lan-web-client run build
              ;;
            yarn)
              yarn workspace medoc build
              yarn workspace medoc-lan-web-client build
              ;;
            npm)
              npm run build -w medoc
              npm run build -w medoc-lan-web-client
              ;;
          esac

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install }}
      - name: Build web UI
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run build ;;
            yarn) yarn workspace medoc build ;;
            npm) npm run build -w medoc ;;
          esac
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run axe-core critical WCAG 2.1 AA audit
        shell: bash
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run test:a11y ;;
            yarn) yarn workspace medoc test:a11y ;;
            npm) npm run test:a11y -w medoc ;;
          esac
