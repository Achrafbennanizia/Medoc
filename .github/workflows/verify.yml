name: verify

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true
      - run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_command=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_command=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_command=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_command }}
      - name: Run lint (no fix)
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run lint ;;
            yarn) yarn run lint ;;
            npm) npm run lint ;;
          esac
      - name: Run typecheck
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc exec tsc --noEmit ;;
            yarn) yarn workspace medoc tsc --noEmit ;;
            npm) npm exec -w medoc tsc --noEmit ;;
          esac
      - name: Run tests
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run test ;;
            yarn) yarn run test ;;
            npm) npm run test ;;
          esac
      - name: Run build
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
          esac

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_command=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_command=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_command=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - run: corepack enable
      - run: ${{ steps.pm.outputs.install_command }}
      - name: Build UI for accessibility audit
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
          esac
      - name: Run axe-core (fail on critical WCAG 2.1 AA violations)
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc run preview -- --host 127.0.0.1 --port 4173 >/tmp/medoc-a11y-preview.log 2>&1 & ;;
            yarn) yarn workspace medoc preview --host 127.0.0.1 --port 4173 >/tmp/medoc-a11y-preview.log 2>&1 & ;;
            npm) npm run preview -w medoc -- --host 127.0.0.1 --port 4173 >/tmp/medoc-a11y-preview.log 2>&1 & ;;
          esac
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:4173 >/dev/null; then
            echo "Preview server failed to start."
            cat /tmp/medoc-a11y-preview.log || true
            exit 1
          fi
          npx --yes @axe-core/cli "http://127.0.0.1:4173" --save axe-results.json || true
          node scripts/check-axe-critical.mjs axe-results.json
