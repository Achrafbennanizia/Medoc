name: verify

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Detect package manager
        id: pm
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install_cmd }}
      - name: Lint (no auto-fix)
        run: ${{ steps.pm.outputs.pm }} run lint
      - name: Type-check
        run: npx tsc --noEmit -p apps/practice-host-ui/tsconfig.json
      - name: Test
        run: ${{ steps.pm.outputs.pm }} run test
      - name: Build
        run: ${{ steps.pm.outputs.pm }} run build

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Detect package manager
        id: pm
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "install_cmd=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: ${{ steps.pm.outputs.install_cmd }}
      - name: Build web UI
        run: ${{ steps.pm.outputs.pm }} run build
      - name: Run axe-core scan (critical WCAG 2.1 AA)
        run: |
          set -euo pipefail
          npx --yes http-server "apps/practice-host-ui/dist" -p 4173 >/tmp/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173" >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS "http://127.0.0.1:4173" >/dev/null; then
            echo "A11y static server failed to start."
            cat /tmp/http-server.log
            exit 1
          fi

          npx --yes @axe-core/cli "http://127.0.0.1:4173" --tags wcag21aa --save axe-results.json || true

          node <<'EOF'
          const fs = require("node:fs");
          if (!fs.existsSync("axe-results.json")) {
            console.error("axe-results.json was not generated by @axe-core/cli.");
            process.exit(1);
          }

          const raw = fs.readFileSync("axe-results.json", "utf8");
          const parsed = JSON.parse(raw);
          const runs = Array.isArray(parsed) ? parsed : [parsed];
          const criticalFindings = [];

          for (const run of runs) {
            const url = run.url ?? "unknown-url";
            const violations = Array.isArray(run.violations) ? run.violations : [];
            for (const violation of violations) {
              const impact = String(violation.impact || "").toLowerCase();
              const tags = Array.isArray(violation.tags) ? violation.tags : [];
              const isWcag21Aa = tags.includes("wcag21aa") || tags.includes("wcag2aa");
              if (impact === "critical" && isWcag21Aa) {
                criticalFindings.push({
                  url,
                  id: violation.id,
                  help: violation.help,
                  nodes: Array.isArray(violation.nodes) ? violation.nodes.length : 0,
                });
              }
            }
          }

          if (criticalFindings.length > 0) {
            console.error("Critical WCAG 2.1 AA violations found:");
            for (const finding of criticalFindings) {
              console.error(`- ${finding.id} (${finding.nodes} nodes) on ${finding.url}: ${finding.help}`);
            }
            process.exit(1);
          }

          console.log("No critical WCAG 2.1 AA violations found.");
          EOF
