name: verify

on:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies for Tauri crates
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace --tests
      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true
      - name: cargo audit
        run: cargo audit

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" && exit 1 ;;
          esac
      - name: Lint (no fix)
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run lint ;;
            yarn) yarn run lint ;;
            npm) npm run lint ;;
          esac
      - name: Typecheck
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm --filter medoc exec tsc --noEmit ;;
            yarn) yarn workspace medoc tsc --noEmit ;;
            npm) npm exec -w medoc tsc -- --noEmit ;;
          esac
      - name: Test
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run test ;;
            yarn) yarn run test ;;
            npm) npm run test ;;
          esac
      - name: Build
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
          esac

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: ${{ steps.pm.outputs.pm }}" && exit 1 ;;
          esac
      - name: Build web UI
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
          esac
      - name: Run axe-core checks (critical WCAG 2.1 AA)
        run: |
          set -euo pipefail
          if node -e 'const fs=require("node:fs"); const pkg=JSON.parse(fs.readFileSync("apps/practice-host-ui/package.json","utf8")); process.exit(pkg.scripts && pkg.scripts["test:a11y"] ? 0 : 1);'; then
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm run test:a11y ;;
              yarn) yarn run test:a11y ;;
              npm) npm run test:a11y ;;
            esac
            exit 0
          fi

          echo "No test:a11y script detected; using fallback axe-core CLI scan."
          npx --yes http-server "apps/practice-host-ui/dist" -p 4173 >/tmp/medoc-a11y-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Static server never became ready on :4173"
            exit 1
          fi

          npx --yes @axe-core/cli "http://127.0.0.1:4173" --tags wcag2a,wcag2aa --save axe-results.json || true

          node <<'NODE'
          const fs = require("node:fs");
          if (!fs.existsSync("axe-results.json")) {
            console.error("axe-results.json was not produced");
            process.exit(1);
          }
          const parsed = JSON.parse(fs.readFileSync("axe-results.json", "utf8"));
          const reports = Array.isArray(parsed) ? parsed : [parsed];
          const criticalViolations = [];
          for (const report of reports) {
            for (const violation of report.violations || []) {
              if ((violation.impact || "").toLowerCase() !== "critical") continue;
              criticalViolations.push({
                id: violation.id,
                help: violation.help,
                targets: (violation.nodes || []).map((n) =>
                  Array.isArray(n.target) ? n.target.join(" ") : String(n.target),
                ),
              });
            }
          }
          if (criticalViolations.length > 0) {
            console.error(`Critical WCAG 2.1 AA violations found: ${criticalViolations.length}`);
            for (const violation of criticalViolations) {
              console.error(`- ${violation.id}: ${violation.help}`);
              for (const target of violation.targets) {
                console.error(`  target: ${target}`);
              }
            }
            process.exit(1);
          }
          console.log("No critical WCAG 2.1 AA violations detected.");
          NODE
