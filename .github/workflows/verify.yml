name: verify

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: Install cargo-audit (best effort)
        run: cargo install cargo-audit --locked || true
      - name: cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - name: Install dependencies
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          corepack enable
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: $PM" && exit 1 ;;
          esac
      - name: Lint (no --fix)
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm run lint ;;
            yarn) yarn lint ;;
            npm) npm run lint ;;
          esac
      - name: Type-check
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm run typecheck ;;
            yarn) yarn typecheck ;;
            npm) npm run typecheck ;;
          esac
      - name: Tests
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm run test ;;
            yarn) yarn test ;;
            npm) npm run test ;;
          esac
      - name: Build
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm run build ;;
            yarn) yarn build ;;
            npm) npm run build ;;
          esac

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
      - name: Install dependencies
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          corepack enable
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager: $PM" && exit 1 ;;
          esac
      - name: Build web UI for accessibility scan
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm run build ;;
            yarn) yarn build ;;
            npm) npm run build ;;
          esac
      - name: Run axe-core checks (WCAG 2.1 AA)
        shell: bash
        run: |
          PM="${{ steps.pm.outputs.pm }}"
          case "$PM" in
            pnpm) pnpm run test:a11y ;;
            yarn) yarn test:a11y ;;
            npm) npm run test:a11y ;;
          esac
