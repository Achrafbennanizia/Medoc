name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
  MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          locked: true

      - name: cargo audit
        run: cargo audit

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - name: Install JS dependencies
        env:
          PM: ${{ steps.pm.outputs.pm }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "::error::Unsupported package manager: $PM"; exit 1 ;;
          esac

      - name: Run lint, typecheck, test, and build on apps/packages workspace
        env:
          PM: ${{ steps.pm.outputs.pm }}
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail

          pm_run_in_dir() {
            local dir="$1"
            local script="$2"
            shift 2
            case "$PM" in
              pnpm) (cd "$dir" && pnpm run "$script" "$@") ;;
              yarn) (cd "$dir" && yarn run "$script" "$@") ;;
              npm) (cd "$dir" && npm run "$script" -- "$@") ;;
              *) echo "::error::Unsupported package manager: $PM"; exit 1 ;;
            esac
          }

          pm_run_in_dir "apps/practice-host-ui" lint
          pm_run_in_dir "apps/practice-host-ui" typecheck
          pm_run_in_dir "apps/lan-web-client" typecheck
          bash ./scripts/ci-frontend-test.sh
          pm_run_in_dir "apps/practice-host-ui" build
          pm_run_in_dir "apps/lan-web-client" build

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager from lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - name: Install JS dependencies
        env:
          PM: ${{ steps.pm.outputs.pm }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "::error::Unsupported package manager: $PM"; exit 1 ;;
          esac

      - name: Build web UI
        env:
          PM: ${{ steps.pm.outputs.pm }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) (cd apps/practice-host-ui && pnpm run build) ;;
            yarn) (cd apps/practice-host-ui && yarn run build) ;;
            npm) (cd apps/practice-host-ui && npm run build) ;;
            *) echo "::error::Unsupported package manager: $PM"; exit 1 ;;
          esac

      - name: Run axe-core on built UI and fail on critical WCAG 2.1 AA violations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/practice-host-ui/dist >/tmp/medoc-a11y-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for _ in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173" >/dev/null; then
              break
            fi
            sleep 1
          done

          npx --yes @axe-core/cli \
            "http://127.0.0.1:4173" \
            --tags wcag2aa,wcag21aa \
            --save axe-results.json || true

          node <<'NODE'
          const fs = require("node:fs");

          if (!fs.existsSync("axe-results.json")) {
            console.error("axe-results.json was not created by @axe-core/cli.");
            process.exit(1);
          }

          const raw = JSON.parse(fs.readFileSync("axe-results.json", "utf8"));
          const scans = Array.isArray(raw) ? raw : [raw];
          const aaTags = new Set(["wcag2aa", "wcag21aa"]);
          const criticalAa = [];

          for (const scan of scans) {
            const violations = scan?.violations ?? scan?.results?.violations ?? [];
            for (const violation of violations) {
              const tags = Array.isArray(violation.tags) ? violation.tags : [];
              const isAa = tags.some((tag) => aaTags.has(tag));
              if (isAa && violation.impact === "critical") {
                criticalAa.push(violation);
              }
            }
          }

          if (criticalAa.length > 0) {
            console.error(`Found ${criticalAa.length} critical WCAG 2.1 AA violation(s).`);
            for (const violation of criticalAa) {
              console.error(`- ${violation.id}: ${violation.description}`);
            }
            process.exit(1);
          }

          console.log("No critical WCAG 2.1 AA violations found by axe-core.");
          NODE
