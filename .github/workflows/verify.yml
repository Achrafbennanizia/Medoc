name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDOC_VENDOR_PUBKEY: 79c1662a9e6877dd6b2156324ee33b969e1076393a91fbe9b2976596dca81b32
      MEDOC_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MEDOC_AUDIT_KEY: k9-medoc-test-audit-key-32bytes!
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Rust workspace layout
        run: |
          test -f Cargo.toml
          test -d crates
          test -d apps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --tests
      - run: cargo install cargo-audit --locked || true
      - run: cargo audit

  web:
    name: web-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - name: Install JavaScript dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: Lint (verify-only, no fix)
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run lint ;;
            yarn) yarn run lint ;;
            npm) npm run lint ;;
          esac
      - name: Typecheck workspace apps
        run: |
          run_exec() {
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm exec "$@" ;;
              yarn) yarn exec "$@" ;;
              npm) npm exec -- "$@" ;;
            esac
          }
          run_exec tsc --noEmit -p apps/practice-host-ui/tsconfig.json
          run_exec tsc --noEmit -p apps/lan-web-client/tsconfig.json
      - name: Test
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run test ;;
            yarn) yarn run test ;;
            npm) npm run test ;;
          esac
      - name: Build (practice-host-ui)
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
          esac
      - name: Build (lan-web-client, if script exists)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build:lan-web'] ? 0 : 1)"; then
            case "${{ steps.pm.outputs.pm }}" in
              pnpm) pnpm run build:lan-web ;;
              yarn) yarn run build:lan-web ;;
              npm) npm run build:lan-web ;;
            esac
          else
            echo "build:lan-web script not defined; skipping."
          fi

  a11y:
    name: a11y-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pm
        name: Detect package manager from lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.pm.outputs.pm }}
      - run: corepack enable
      - name: Install JavaScript dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: Build web UI for accessibility scan
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            npm) npm run build ;;
          esac
      - name: Run axe-core WCAG 2.1 AA scan and gate on critical issues
        run: |
          python3 -m http.server 4173 --directory apps/practice-host-ui/dist > /tmp/a11y-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for _ in {1..20}; do
            if curl -sSf http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done

          npx --yes @axe-core/cli http://127.0.0.1:4173 --tags wcag21aa --save a11y-results.json || true

          node <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("a11y-results.json", "utf8"));
          const reports = Array.isArray(data) ? data : [data];
          const criticalViolations = reports
            .flatMap((report) => report.violations || [])
            .filter((violation) => violation.impact === "critical");
          if (criticalViolations.length > 0) {
            console.error(`Critical accessibility violations found: ${criticalViolations.length}`);
            for (const violation of criticalViolations) {
              console.error(`- ${violation.id}: ${violation.help}`);
            }
            process.exit(1);
          }
          console.log("No critical WCAG 2.1 AA accessibility violations found.");
          NODE
