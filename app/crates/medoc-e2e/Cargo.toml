[package]
name = "medoc-e2e"
version = "0.1.0"
edition = "2021"
description = "End-to-end integration tests for MeDoc Wave V1 (LAN, company, license, sync)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
medoc-core = { path = "../medoc-core" }
medoc-lan = { path = "../medoc-lan" }
medoc-company = { path = "../medoc-company" }
medoc-sync = { path = "../medoc-sync" }

axum = { version = "0.8", features = ["macros", "json"] }
base64 = { version = "0.22", features = ["std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
http = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "sqlite",
    "runtime-tokio",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
