[package]
name = "medoc-core"
version = "0.1.0"
edition = "2021"
description = "MeDoc shared domain + non-Tauri infrastructure (database, crypto, logging, PDF, …)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# `AppError` (re-exported into the practice/Tauri crate for source compat)
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Only the error surface needs sqlx for the `Database(#[from] sqlx::Error)` variant.
# Feature unification: practice crate enables runtime-tokio/sqlite/etc.; this stays minimal.
sqlx = { version = "0.8", default-features = false }
