[package]
name = "medoc-core"
version = "0.1.0"
edition = "2021"
description = "MeDoc shared domain + non-Tauri infrastructure (database, crypto, logging, PDF, …)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
# `macros` for `#[derive(sqlx::Type)]` on domain enums; `sqlite` + `chrono` for
# `domain::services::konflikt` which queries via `SqlitePool` and `NaiveDateTime`.
# Feature unification: practice crate enables runtime-tokio + migrate as well;
# both crates resolve to the same compiled sqlx instance.
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "sqlite",
    "runtime-tokio",
    "chrono",
] }

[build-dependencies]
medoc-codegen = { path = "../medoc-codegen" }
