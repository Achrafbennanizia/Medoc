[package]
name = "medoc-sync"
version = "0.1.0"
edition = "2021"
description = "MeDoc peer-to-peer replication — outbox, vector clocks, master/replica sync."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
medoc-core = { path = "../medoc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "sqlite",
    "runtime-tokio",
    "chrono",
] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Master keypair + activation token signing/verification (NFA-NET-09).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
