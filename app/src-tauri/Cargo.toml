[package]
name = "medoc"
version = "0.1.0"
description = "MeDoc - Zahnarztpraxis Management System"
authors = ["MeDoc Team"]
edition = "2021"
# `tauri dev` runs `cargo run` without `--bin`; prefer GUI app over `medoc-server`.
default-run = "medoc"

[lib]
name = "medoc_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
medoc-codegen = { path = "../crates/medoc-codegen" }

[dependencies]
axum = { version = "0.8", features = ["macros", "json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2"
rcgen = "0.13"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
if-addrs = "0.14"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
# Enable SQLCipher for the transitive `libsqlite3-sys` used by sqlx (see sqlx#1436).
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.17"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# Logging & Observability (NFA-LOG)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"

# Security hardening (NFA-SEC)
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
base64 = "0.22"

# Log export
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
dirs = "5"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
keyring = "3"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

[dev-dependencies]
filetime = "0.2.27"
serde_yaml = "0.9"

[[bin]]
name = "medoc-server"
path = "src/bin/medoc-server.rs"

[[bin]]
name = "medoc-company-server"
path = "src/bin/medoc-company-server.rs"
