[package]
name = "medoc-lan"
version = "0.1.0"
edition = "2021"
description = "MeDoc LAN server — authenticated HTTPS access for browsers/tablets on the practice LAN."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
medoc-core = { path = "../../../shared/medoc-core" }
medoc-sync = { path = "../../../shared/medoc-sync" }

# HTTP / TLS stack
axum = { version = "0.8", features = ["macros", "json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2"
rcgen = "0.13"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
sha2 = "0.10"

# Async runtime
tokio = { version = "1", features = ["full"] }

# JWT auth (LAN session tokens)
jsonwebtoken = "9"

# Structured logging — emit `medoc::lan` events.
tracing = "0.1"

# Data + serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "sqlite",
    "runtime-tokio",
    "chrono",
] }
# Pulls in the same SQLCipher-enabled sqlite as the practice + medoc-core crates.
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher"] }
