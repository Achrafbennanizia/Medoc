[package]
name = "medoc-lan-server"
version = "0.1.0"
edition = "2021"
description = "MeDoc LAN server — standalone binary (HTTPS API + UDP discovery)."
publish = false

[[bin]]
name = "medoc-server"
path = "src/main.rs"

[dependencies]
medoc-core = { path = "../../../shared/medoc-core" }
medoc-lan = { path = "../medoc-lan" }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
