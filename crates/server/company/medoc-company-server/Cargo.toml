[package]
name = "medoc-company-server"
version = "0.1.0"
edition = "2021"
description = "MeDoc Company server — standalone binary (vendor portal HTTP host)."
publish = false

[[bin]]
name = "medoc-company-server"
path = "src/main.rs"

[dependencies]
medoc-core = { path = "../../../shared/medoc-core" }
medoc-company = { path = "../medoc-company" }

axum = { version = "0.8", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
