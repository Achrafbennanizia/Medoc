[package]
name = "medoc-practice"
version = "0.1.0"
description = "MeDoc practice host — Tauri IPC commands and host-only wiring."
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
medoc-core = { path = "../../shared/medoc-core" }
medoc-lan = { path = "../../server/lan/medoc-lan" }
medoc-company = { path = "../../server/company/medoc-company" }
medoc-sync = { path = "../../shared/medoc-sync" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
dirs = "5"
if-addrs = "0.14"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
base64 = "0.22"
jsonwebtoken = "9"
zip = { version = "2", default-features = false, features = ["deflate"] }
btleplug = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serial_test = "3"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
bcrypt = "0.17"
rand = "0.8"
