[package]
name = "medoc-practice"
version = "0.1.0"
description = "MeDoc practice host — Tauri IPC commands and host-only wiring."
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
medoc-core = { path = "../../shared/medoc-core" }
medoc-lan = { path = "../../server/lan/medoc-lan" }
medoc-company = { path = "../../server/company/medoc-company" }
medoc-sync = { path = "../../shared/medoc-sync" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
dirs = "5"
if-addrs = "0.14"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
jsonwebtoken = "9"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
btleplug = "0.11"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serial_test = "3"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
bcrypt = "0.17"
rand = "0.8"

[features]
default = ["edition-group"]
# Replica app build (see medoc-core feature `replica`).
replica = ["medoc-core/replica"]

# Editions (config/editions.yaml, docs/architecture/editions-plan.md §3.2). Exactly one is on.
# Each lists exactly its capabilities; `src/edition.rs` fails the build if this list and the YAML
# disagree. Code checks `cfg(feature = "cap-…")`, never `edition-…`.
edition-solo = ["cap-guest-inbox"]
edition-duo = ["cap-net", "cap-multi-staff", "cap-tasks", "cap-work-time", "cap-validation", "cap-lan-client", "cap-maintenance"]
edition-group = ["cap-net", "cap-multi-staff", "cap-tasks", "cap-work-time", "cap-validation", "cap-multi-doctor", "cap-multi-admin", "cap-allowances", "cap-lan-client", "cap-maintenance"]

cap-guest-inbox = ["medoc-core/cap-guest-inbox"]
cap-net = ["medoc-core/cap-net"]
cap-multi-staff = ["medoc-core/cap-multi-staff"]
cap-tasks = ["medoc-core/cap-tasks"]
cap-work-time = ["medoc-core/cap-work-time"]
cap-validation = ["medoc-core/cap-validation"]
cap-multi-doctor = ["medoc-core/cap-multi-doctor"]
cap-multi-admin = ["medoc-core/cap-multi-admin"]
cap-allowances = ["medoc-core/cap-allowances"]
cap-lan-client = ["medoc-core/cap-lan-client"]
cap-maintenance = ["medoc-core/cap-maintenance"]
