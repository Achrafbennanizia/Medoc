[package]
name = "medoc-usb-setup"
version = "0.1.0"
edition = "2021"
description = "Password-gated USB multi-installer for MeDoc field deployment."
publish = false

[[bin]]
name = "medoc-usb-setup"
path = "src/main.rs"

[[bin]]
name = "medoc-finder-open"
path = "src/finder_open.rs"

[dependencies]
medoc-core = { path = "../../crates/shared/medoc-core" }
medoc-sync = { path = "../../crates/shared/medoc-sync" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dialoguer = "0.11"
rpassword = "7"
dirs = "5"
# Avoid eframe accesskit/atspi (zbus→quick-xml 0.30) and wayland-scanner (quick-xml 0.39).
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
single-instance = "0.3"
