[package]
name = "medoc-recovery"
version = "0.2.0"
edition = "2021"
description = "Offline Safe Bridge recovery (CLI + UI). Reuses medoc-core db_key; does not write the OS keychain."
publish = false

[[bin]]
name = "medoc-recovery"
path = "src/main.rs"

[[bin]]
name = "medoc-recovery-ui"
path = "src/bin/medoc-recovery-ui.rs"

[dependencies]
medoc-core = { path = "../../crates/shared/medoc-core" }
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rpassword = "7"
ed25519-dalek = { version = "2", features = ["std"] }
tempfile = "3"
dirs = "5"
# Same eframe feature set as medoc-usb-setup (avoid accesskit/atspi quick-xml clash).
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
single-instance = "0.3"
