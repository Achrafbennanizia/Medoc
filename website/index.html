    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MeDoc Dentist",
        "alternateName": "MeDoc Dentist by Sifra Labs",
        "url": "https://achrafbennanizia.github.io/Medoc/",

        "publisher": { "@type": "Organization", "name": "Sifra Labs", "url": "https://sifralabs.com/" },
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Dental practice management",
        "operatingSystem": "Windows 10+, macOS 12+, Ubuntu 22.04",
        "inLanguage": ["fr", "ar", "en"],
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "MAD",

    <link rel="icon" type="image/png" href="./medoc-icon.png" />
    <link rel="apple-touch-icon" href="./medoc-icon.png" />
    <script>
      // Apply theme and text direction before first paint (no flash).
      (function () {
        var d = document.documentElement, t = null, l = null;
        // Preferences live in first-party cookies (see src/prefs.ts).
        var c = function (n) { var m = document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : null; };
        try { t = c("medoc_theme"); l = c("medoc_lang"); } catch (e) {}
        var q = new URLSearchParams(location.search).get("lang");
        if (q) l = q;
        if (t === "light" || t === "dark") d.dataset.theme = t;
        else if (matchMedia("(prefers-color-scheme: dark)").matches) d.dataset.theme = "dark";
        if (l === "ar") { d.lang = "ar"; d.dir = "rtl"; } else if (l === "en" || l === "fr") d.lang = l;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
