# MeDoc RBAC matrix — single source of truth (TASK 3.4).
# Edit this file only; run `cargo build` to regenerate Rust + TypeScript.
version: 1

roles:
  - PHYSICIAN
  - RECEPTION
  # TODO(deferred-roles): TAX_ADVISOR — see docs/coordination/todos-deferred-roles.md
  # TODO(deferred-roles): PHARMA_CONSULTANT

# Reusable role groups (expanded at codegen time).
role_sets:
  physician_only: [PHYSICIAN]
  clinical_frontdesk: [PHYSICIAN, RECEPTION]
  # TODO(deferred-roles): was [PHYSICIAN, RECEPTION, TAX_ADVISOR]
  finance_staff: [PHYSICIAN, RECEPTION]
  # TODO(deferred-roles): was [PHYSICIAN, RECEPTION, PHARMA_CONSULTANT]
  inventory_write: [PHYSICIAN, RECEPTION]
  # TODO(deferred-roles): was [PHYSICIAN, RECEPTION, TAX_ADVISOR, PHARMA_CONSULTANT]
  everyone: [PHYSICIAN, RECEPTION]

# action → role set name, explicit role list, or "*" (all authenticated roles).
permissions:
  patient.read_medical: physician_only
  patient.write_medical: physician_only
  patient.read_documents: clinical_frontdesk
  patient.treatments_list_for_payment: finance_staff
  patient.read: clinical_frontdesk
  patient.write: clinical_frontdesk
  appointment.list_physicians: clinical_frontdesk
  appointment.read: clinical_frontdesk
  appointment.write: clinical_frontdesk
  # TODO(deferred-roles): was [PHYSICIAN, TAX_ADVISOR]
  finance.read: physician_only
  finance.reception.view: [RECEPTION]
  finance.write: finance_staff
  dashboard.read: everyone
  product.read: everyone
  product.write: inventory_write
  purchase_order.read: everyone
  purchase_order.write: inventory_write
  # TODO(deferred-roles): was [PHYSICIAN, TAX_ADVISOR, PHARMA_CONSULTANT]
  administration.read: physician_only
  administration.inventory.read: everyone
  administration.inventory.write: inventory_write
  administration.contracts.read: everyone
  administration.contracts.write: inventory_write
  administration.catalogs.read: finance_staff
  administration.catalogs.write: finance_staff
  administration.templates.read: physician_only
  administration.templates.write: physician_only
  # Administration sub-areas (decouple from `staff.*` HR permissions — N6).
  administration.team.read: physician_only
  administration.practice_planning.read: physician_only
  administration.practice_planning.write: physician_only
  # TODO(deferred-roles): was [PHYSICIAN, TAX_ADVISOR]
  finance.day_close.write: physician_only
  staff.read: physician_only
  staff.write: physician_only
  templates.read: physician_only
  templates.write: physician_only
  audit.read: physician_only
  ops.backup: physician_only
  ops.dsgvo: physician_only
  ops.migration: physician_only
  ops.system: physician_only
  ops.logs: physician_only
  ops.audit_chain_ack: physician_only
  # Practice tasks: change status (FA-AUFG-06 + RBAC).
  task.status.fulfill: clinical_frontdesk
  # TODO(deferred-roles): was [PHYSICIAN, TAX_ADVISOR, PHARMA_CONSULTANT]
  task.status.admin: physician_only
  work_time.self: clinical_frontdesk
  work_time.team.read: physician_only
  work_time.admin: physician_only
  statistics.read: physician_only
