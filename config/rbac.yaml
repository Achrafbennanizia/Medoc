# MeDoc RBAC matrix — single source of truth (TASK 3.4).
# Edit this file only; run `cargo build` to regenerate Rust + TypeScript.
version: 1

roles:
  - ARZT
  - REZEPTION
  # TODO(deferred-roles): STEUERBERATER — see docs/coordination/todos-deferred-roles.md
  # TODO(deferred-roles): PHARMABERATER

# Reusable role groups (expanded at codegen time).
role_sets:
  arzt_only: [ARZT]
  clinical_frontdesk: [ARZT, REZEPTION]
  # TODO(deferred-roles): was [ARZT, REZEPTION, STEUERBERATER]
  finanzen_staff: [ARZT, REZEPTION]
  # TODO(deferred-roles): was [ARZT, REZEPTION, PHARMABERATER]
  inventory_write: [ARZT, REZEPTION]
  # TODO(deferred-roles): was [ARZT, REZEPTION, STEUERBERATER, PHARMABERATER]
  everyone: [ARZT, REZEPTION]

# action → role set name, explicit role list, or "*" (all authenticated roles).
permissions:
  patient.read_medical: arzt_only
  patient.write_medical: arzt_only
  patient.read_documents: clinical_frontdesk
  patient.behandlungen_list_for_zahlung: finanzen_staff
  patient.read: clinical_frontdesk
  patient.write: clinical_frontdesk
  termin.list_aerzte: clinical_frontdesk
  termin.read: clinical_frontdesk
  termin.write: clinical_frontdesk
  # TODO(deferred-roles): was [ARZT, STEUERBERATER]
  finanzen.read: arzt_only
  finanzen.reception.view: [REZEPTION]
  finanzen.write: finanzen_staff
  dashboard.read: everyone
  produkt.read: everyone
  produkt.write: inventory_write
  bestellung.read: everyone
  bestellung.write: inventory_write
  # TODO(deferred-roles): was [ARZT, STEUERBERATER, PHARMABERATER]
  verwaltung.read: arzt_only
  verwaltung.lager.read: everyone
  verwaltung.lager.write: inventory_write
  verwaltung.vertraege.read: everyone
  verwaltung.vertraege.write: inventory_write
  verwaltung.kataloge.read: finanzen_staff
  verwaltung.kataloge.write: finanzen_staff
  verwaltung.vorlagen.read: arzt_only
  verwaltung.vorlagen.write: arzt_only
  # Verwaltung sub-areas (decouple from `personal.*` HR permissions — N6).
  verwaltung.team.read: arzt_only
  verwaltung.praxisplanung.read: arzt_only
  verwaltung.praxisplanung.write: arzt_only
  # TODO(deferred-roles): was [ARZT, STEUERBERATER]
  finanzen.tagesabschluss.write: arzt_only
  personal.read: arzt_only
  personal.write: arzt_only
  vorlagen.read: arzt_only
  vorlagen.write: arzt_only
  audit.read: arzt_only
  ops.backup: arzt_only
  ops.dsgvo: arzt_only
  ops.migration: arzt_only
  ops.system: arzt_only
  ops.logs: arzt_only
  ops.audit_chain_ack: arzt_only
  # Praxis-Aufgaben: Status ändern (FA-AUFG-06 + RBAC).
  aufgabe.status.fulfill: clinical_frontdesk
  # TODO(deferred-roles): was [ARZT, STEUERBERATER, PHARMABERATER]
  aufgabe.status.admin: arzt_only
  work_time.self: clinical_frontdesk
  work_time.team.read: arzt_only
  work_time.admin: arzt_only
  statistik.read: arzt_only
