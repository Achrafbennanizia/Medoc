# MeDoc domain enums — single source of truth (TASK 3.5).
# Edit this file only; run `cargo build` to regenerate Rust, TypeScript, Zod, and SQL CHECK fragments.
# Type / variant *identifiers* are English. `wire` values stay German (SQLite CHECK / IPC).
version: 1

enums:
  Role:
    ts_const: ROLE_VALUES
    zod_schema: RoleSchema
    sql_column: staff.role
    variants:
      - { rust: Physician, wire: PHYSICIAN }
      - { rust: Reception, wire: RECEPTION }
      # TODO(deferred-roles): login disabled — keep wire values for SQLite CHECK / legacy rows
      - { rust: TaxAdvisor, wire: TAX_ADVISOR }
      - { rust: PharmaConsultant, wire: PHARMA_CONSULTANT }

  Sex:
    ts_const: SEX_VALUES
    zod_schema: SexSchema
    sql_column: patient.sex
    variants:
      - { rust: Male, wire: MALE }
      - { rust: Female, wire: FEMALE }
      - { rust: Diverse, wire: DIVERSE }

  AppointmentKind:
    ts_const: APPOINTMENT_KIND_VALUES
    zod_schema: AppointmentKindSchema
    sql_column: appointment.kind
    variants:
      - { rust: FirstVisit, wire: FIRST_VISIT }
      - { rust: Examination, wire: EXAMINATION }
      - { rust: Treatment, wire: TREATMENT }
      - { rust: Checkup, wire: CHECKUP }
      - { rust: Consultation, wire: CONSULTATION }

  AppointmentStatus:
    ts_const: APPOINTMENT_STATUS_VALUES
    zod_schema: AppointmentStatusSchema
    sql_column: appointment.status
    variants:
      - { rust: Planned, wire: PLANNED }
      - { rust: Confirmed, wire: CONFIRMED }
      - { rust: Completed, wire: COMPLETED }
      - { rust: NoShow, wire: NO_SHOW }
      - { rust: Cancelled, wire: CANCELLED }

  PatientStatus:
    ts_const: PATIENT_STATUS_VALUES
    zod_schema: PatientStatusSchema
    sql_column: patient.status
    variants:
      - { rust: New, wire: NEW }
      - { rust: Active, wire: ACTIVE }
      - { rust: Validated, wire: VALIDATED }
      - { rust: Readonly, wire: READONLY }

  ChartStatus:
    ts_const: CHART_STATUS_VALUES
    zod_schema: ChartStatusSchema
    sql_column: patient_chart.status
    variants:
      - { rust: Draft, wire: DRAFT }
      - { rust: InProgress, wire: IN_PROGRESS }
      - { rust: Validated, wire: VALIDATED }
      - { rust: Readonly, wire: READONLY }

  PaymentMethod:
    ts_const: PAYMENT_METHOD_VALUES
    zod_schema: PaymentMethodSchema
    sql_column: payment.payment_method
    variants:
      - { rust: Cash, wire: CASH }
      - { rust: Card, wire: CARD }
      - { rust: BankTransfer, wire: BANK_TRANSFER }
      - { rust: Invoice, wire: INVOICE }

  PaymentStatus:
    ts_const: PAYMENT_STATUS_VALUES
    zod_schema: PaymentStatusSchema
    sql_column: payment.status
    variants:
      - { rust: Outstanding, wire: OUTSTANDING }
      - { rust: Paid, wire: PAID }
      - { rust: PartiallyPaid, wire: PARTIALLY_PAID }
      - { rust: Cancelled, wire: CANCELLED }

  AuditAction:
    generate_ts: false
    generate_zod: false
    variants:
      - { rust: Create, wire: CREATE }
      - { rust: Update, wire: UPDATE }
      - { rust: Delete, wire: DELETE }
      - { rust: Login, wire: LOGIN }
      - { rust: Logout, wire: LOGOUT }

  OrderStatus:
    generate_rust: false
    generate_zod: false
    ts_const: ORDER_STATUS_VALUES
    sql_column: purchase_order.status
    variants:
      - { wire: OPEN }
      - { wire: IN_TRANSIT }
      - { wire: DELIVERED }
      - { wire: CANCELLED }

  FeedbackCategory:
    generate_rust: false
    ts_const: FEEDBACK_CATEGORY_VALUES
    zod_schema: FeedbackCategorySchema
    serde_rename_all: lowercase
    sql_column: feedback.category
    variants:
      - { wire: feedback }
      - { wire: vigilance }
      - { wire: technical }

  FeedbackStatus:
    generate_rust: false
    generate_zod: false
    ts_const: FEEDBACK_STATUS_VALUES
    sql_column: feedback.status
    variants:
      - { wire: OPEN }
      - { wire: IN_PROGRESS }
      - { wire: DONE }
