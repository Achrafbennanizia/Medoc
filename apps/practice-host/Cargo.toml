[package]
name = "medoc"
version = "0.1.0"
description = "MeDoc - Zahnarztpraxis Management System"
authors = ["MeDoc Team"]
edition = "2021"

[lib]
name = "medoc_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Single app-layer dependency — practice IPC + all domain/sync/LAN/company wiring.
medoc-practice = { path = "../../crates/app/medoc-practice" }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.17"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"

argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
base64 = "0.22"

zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
dirs = "5"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
keyring = "3"
single-instance = "0.3"

[dev-dependencies]
filetime = "0.2.27"
serde_yaml = "0.9"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
axum = "0.8"
tower = "0.5"

# Production webview (custom protocol + embedded dist). `tauri build` enables this;
# plain `cargo build -p medoc --release` without it loads http://localhost:1420 (blank window).
[features]
custom-protocol = ["tauri/custom-protocol"]

# Standalone server binaries (no Tauri):
#   cargo run -p medoc-lan-server
#   cargo run -p medoc-company-server
